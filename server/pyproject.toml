[project]
name = "elvenreader-server"
version = "0.2.0"
description = "ElvenReader: a PC server and web reader that dramatizes books with local LLM and TTS models"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.10",
    "qrcode>=7.4",
    "numpy>=1.26",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-aiohttp>=1.0"]

[project.scripts]
elvenreader-server = "elvenreader_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["elvenreader_server", "elvenreader_server.engines"]

[tool.setuptools.package-data]
elvenreader_server = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
