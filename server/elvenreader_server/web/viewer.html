  document.body.classList.toggle("sidehidden", localStorage.getItem("sideHidden") === "1");
  function setReading(on) {
    if (on) setSide(false);
    document.body.classList.toggle("reading", on);
    const el = document.documentElement;
    if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    const cur = document.querySelector(".cur");  // keep the place
    if (cur) setTimeout(() => cur.scrollIntoView({ block: "center" }), 100);
    const f = $("#fullBtn");
    if (f) {
      fullscreenIcon(f, on);
      f.title = on ? "Leave reading mode (Esc)" : "Reading mode: full screen, just the text (F)";
    }
    wakeControls();
  }
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("reading")) setReading(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector("dialog[open]")) return;
    const reading = document.body.classList.contains("reading");
    if (e.key === "Escape" && document.body.classList.contains("sideopen")) setSide(false);
    else if (e.key === "Escape" && reading) setReading(false);
    else if ((e.key === "f" || e.key === "F") && !e.repeat) setReading(!reading);
  });
  ["pointermove", "pointerdown", "keydown", "wheel"].forEach(ev => document.addEventListener(ev, wakeControls, { passive: true }));
  const playLabel = (playing) => {
    if (!playing) playLoading(false);
    const b = $("#readPlay"); if (!b) return;
    b.textContent = playing ? "\u25A0" : "\u25B6";
    b.title = playing ? "Stop" : "Play (from where you are)";
  };
  // While the PC makes the passage about to play, the play button shows a spinning ring (in place of ■) and shimmers.
  const playLoading = (on) => {
    const b = $("#readPlay");
    if (!b || b.classList.contains("loading") === on) return;
    b.classList.toggle("loading", on);
    b.setAttribute("aria-busy", on ? "true" : "false");
    b.title = on ? "Making the speech on the PC\u2026 (click to stop)" : st.session ? "Stop" : "Play (from where you are)";
    if (on) b.replaceChildren(h("span", { class: "spin" }));
    else b.textContent = st.session ? "\u25A0" : "\u25B6";
  };

  function renderAll() { renderStatus(); renderCast(); renderSelectors(); renderText(); }

  /* Sleep timer (the moon): a tap starts it at the end of SLEEP_DEFAULT_CHAPTERS chapters (this one counts) and the
     button counts down; a tap while it runs offers one more, another length, or off. A timed one fades the voice
     out over its last SLEEP_FADE_MS, then playback stops. */
  const SLEEP_DEFAULT_CHAPTERS = 2, SLEEP_FADE_MS = 15000;
  const chaptersText = (n) => n === 1 ? "end of this chapter" : n === 2 ? "end of the next chapter" : `end of ${n} chapters`;
  function sleepClick(btn) {
    if (!st.sleep) { startSleep({ chapters: SLEEP_DEFAULT_CHAPTERS }); return; }
    const s = st.sleep;
    popMenu(btn, [
      { label: s.chapters ? `Stopping at the ${chaptersText(s.chapters)}` : `Stopping in ${sleepLeft()}` },
      s.chapters ? { text: "+1 chapter", run: () => startSleep({ chapters: s.chapters + 1 }) }
        : { text: "+15 minutes", run: () => startSleep({ until: s.until + 15 * 60000 }) },
      "-", { label: "Stop playing after" },
      ...[30, 60, 90].map(m => ({ text: `${m} minutes`, run: () => startSleep({ until: Date.now() + m * 60000 }) })),
      ...[1, 2, 3].map(n => ({ text: n === 1 ? "This chapter" : `${n} chapters`, title: "This one counts as the first",
        run: () => startSleep({ chapters: n }) })),
      "-", { text: "Turn off the sleep timer", run: () => endSleep() },
    ]);
  }
  // At the end of a chapter: true when the sleep timer stops playback there.
  function sleepAtChapterEnd() {
    if (!st.sleep || !st.sleep.chapters) return false;
    if (--st.sleep.chapters > 0) { renderSleep(); return false; }
    endSleep();
    return true;
  }
  function startSleep(s) {
    clearInterval(st.sleepTick);
    st.sleep = s;
    st.audio.volume = 1;
    if (s.until) st.sleepTick = setInterval(sleepStep, 1000);
    renderSleep();
  }
  function endSleep() {
    clearInterval(st.sleepTick);
    st.sleep = null;
    st.audio.volume = 1;
    renderSleep();
  }
  function sleepStep() {
    if (!$("#sleepBtn")) { clearInterval(st.sleepTick); return; }  // left the book
    const left = st.sleep.until - Date.now();
    if (left <= 0) { stopPlayback(); endSleep(); return; }
    st.audio.volume = Math.min(1, left / SLEEP_FADE_MS);
    renderSleep();
  }
  function sleepLeft() {
    const s = Math.max(0, Math.round((st.sleep.until - Date.now()) / 1000));
    return s >= 60 ? `${Math.ceil(s / 60)} min` : `${s} s`;
  }
  function renderSleep() {
    const b = $("#sleepBtn");
    if (!b) return;
    svgIcon(b, MOON_ICON);
    b.classList.toggle("on", !!st.sleep);
    if (!st.sleep) {
      b.title = `Sleep timer: stop playing at the ${chaptersText(SLEEP_DEFAULT_CHAPTERS)}`;
      return;
    }
    const left = st.sleep.chapters ? `${st.sleep.chapters}ch` : sleepLeft().replace(" min", "m").replace(" s", "s");
    b.append(h("span", { class: "left" }, left));
    b.title = st.sleep.chapters ? `Sleep timer: stopping at the ${chaptersText(st.sleep.chapters)} (click to change)`
      : `Sleep timer: stopping in ${sleepLeft()} (click to change)`;
  }
  renderSleep();

  function toggleScreenOn() {
    localStorage.setItem(SCREEN_ON_KEY, keepScreenOn() ? "0" : "1");
    if (st.session) screenAwake(keepScreenOn());
    renderAwake();
  }
  function renderAwake() {
    const b = $("#awakeBtn"), on = keepScreenOn();
    if (!b) return;
    svgIcon(b, SUN_ICON);
    b.classList.toggle("off", !on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.title = on ? "The screen stays on while reading aloud (click to let it turn off)"
      : "The screen may turn off while reading aloud (click to keep it on)";
  }
  renderAwake();

  function renderStatus() { $("#status").textContent = briefStatus(st.script); }

  function renderChapters() {
    const lines = st.script.lines;
    $("#chapters").replaceChildren(...st.book.chapters.map((c, i) => {
      const done = c.quotes.filter(q => lines[q[0]]).length;
      return h("button", { class: "chap" + (i === st.chapter ? " on" : ""), onclick: () => { gotoChapter(i); setSide(false); } },
        c.title, h("span", { class: "cnt" }, c.quotes.length ? `${done}/${c.quotes.length}` : ""));
    }));
  }

  const TIERS = [["main", "Main"], ["supporting", "Supporting"], ["extra", "Extras"], ["", "Not sorted yet"]];
  const tierOf = (c) => c && TIERS.some(([k]) => k && k === c.role) ? c.role : "";
  const castOpen = { main: true, supporting: true, extra: false, "": true };

  function renderCast() {
    const q = st.castQuery || "";
    const hit = (c) => !q || [c.name, ...(c.aliases || [])].some(n => n.toLowerCase().includes(q));
    // The series' cast joins a volume before it is labelled, so returning characters are recognised; those who
    // haven't spoken in it (yet) stay out of the list (narrators and characters you added stay in).
    const narrating = new Set((st.script.narration || []).map(n => n[2]).filter(Boolean));
    const shown = (c) => c.lines > 0 || !c.from_series || c.user || narrating.has(c.id);
    const groups = TIERS.map(([key, label]) => {
      const all = st.script.characters.filter(c => tierOf(c) === key && shown(c));
      const members = all.filter(hit);
      if (!members.length) return null;
      const d = h("details", { class: "tier" }, h("summary", {}, `${label} (${all.length})`), ...members.map(castRow));
      d.open = q ? true : castOpen[key];
      d.addEventListener("toggle", () => { if (!q) castOpen[key] = d.open; });
      return d;
    });
    const list = nonNull(groups);
    // The book's narrator first (third-person narration, and the passages no character narrates): its voice, kept per
    // browser like the 👤 button's.
    const voice = st.narrator || st.defaultVoice;
    const narratorRow = !q || "narrator".includes(q) ? h("div", { class: "char", title: "The narrator's voice: click to change",
        onclick: (e) => narratorMenu(e.currentTarget) },
      h("span", { class: "sw", style: { background: "var(--muted)" } }),
      h("span", { class: "nm" }, "Narrator", h("span", { class: "small muted" }, " \u00b7 " + voiceName(voice))),
      voice ? h("button", { class: "iconbtn", title: "Play voice sample: " + voiceName(voice),
        onclick: (e) => { e.stopPropagation(); playSample(voice); } }, "\u25B6") : h("span", { class: "gap" })) : null;
    $("#cast").replaceChildren(...nonNull([narratorRow]),
      ...(list.length ? list : [h("p", { class: "small muted" }, q ? "Nobody matches." : "No characters yet.")]));
  }

  function castRow(c) {
    return h("div", { class: "char", onclick: () => openCharacter(c.id),
        title: [c.name, ...(c.aliases || [])].join(" / ") + "\nClick for details" },
      h("span", { class: "sw", style: { background: color(c.id) } }),
      h("span", { class: "nm" }, c.name), h("span", { class: "cnt" }, c.lines),
      c.voice ? h("button", { class: "iconbtn", title: "Play voice sample: " + voiceName(c.voice),
        onclick: (e) => { e.stopPropagation(); playSample(c.voice); } }, "\u25B6") : h("span", { class: "gap", title: "No voice yet" }));
  }

  /* Pronunciations for this book's series (or this book); the audio fetched ahead is dropped after a change. */
  function openPronunciations(term, sample, voice) {
    pronunciationsDialog({ book: st.id, term, sample, voice: voice || st.narrator || undefined, onChange: flushAudio })
      .catch(e => alert(e.message));
  }

  function bookMenu(anchor) {
    const hi = (value, text) => ({ text, on: st.tierHi === value,
      run: () => { st.tierHi = value; localStorage.setItem("tierHi", value); renderText(); } });
    popMenu(anchor, [
      { label: "Highlight lines of" },
      hi("", "Everyone"), hi("main", "Main characters only"), hi("main,supporting", "Main + supporting"),
      ...(st.script.can_edit === false ? [] : ["-", { text: "Book settings\u2026", title: "Title, series, pronunciations, cast and voices, analysis",
        run: () => { location.href = `/books/${st.id}/settings`; } }]),
    ]);
  }

  // The narrator's voice for this book (kept in this browser): the 👤 button's menu.
  const narratorVoices = () => st.voices.filter(v => v.source !== "character");
  function renderSelectors() {
    const narrators = narratorVoices();
    // A narrator picked for this book that no longer exists (deleted) falls back to the default.
    if (narrators.length && st.narrator && !narrators.some(v => v.id === st.narrator)) { st.narrator = ""; localStorage.removeItem("narrator:" + st.id); }
    const b = $("#narratorBtn");
    if (b) b.title = "Narrator voice: " + (st.narrator && st.narrator !== st.defaultVoice ? voiceName(st.narrator)
      : voiceName(st.defaultVoice) + " (default)");
  }
  // The voice names in the text's "Narrated by …" lines, once the voices are known or the narrator changes (in place:
  // rendering the text again would stop playback).
  function renderVoiceNames() {
    document.querySelectorAll("#text .vname").forEach(e => { e.textContent = voiceName(e.dataset.voice); });
    document.querySelectorAll("#text .nvoice").forEach(e => { e.textContent = voiceName(st.narrator || st.defaultVoice); });
  }

  /* A "Narrated by …" line's menu: who narrates from there to the next point-of-view heading or chapter (a
     correction, kept like a line's), and the voice. */
  function narrationMenu(anchor, pi, current) {
    const key = `${st.chapter}:${pi}`, fixed = key in (st.script.narration_fixed || {});
    const set = async (who) => {
      try {
        const { data } = await api("PATCH", `/api/books/${st.id}/narration`, { chapter: st.chapter, paragraph: pi, narrator: who });
        st.script = { ...st.script, ...data };
        renderAll();
      } catch (e) { alert(e.message); }
    };
    // Those who narrate somewhere in the book first, then the main and supporting cast by their number of lines.
    const narrating = new Set((st.script.narration || []).map(n => n[2]).filter(Boolean));
    const people = st.script.characters.filter(c => narrating.has(c.id) || ["main", "supporting"].includes(c.role))
      .sort((a, b) => narrating.has(b.id) - narrating.has(a.id) || b.lines - a.lines).slice(0, 14);
    const voice = current ? { text: `${current.name}'s voice\u2026`, run: () => openCharacter(current.id) }
      : { text: "Narrator voice\u2026", run: () => narratorMenu(anchor) };
    if (st.script.can_edit === false) { popMenu(anchor, [voice]); return; }
    popMenu(anchor, [
      { label: "Narrated from here by" },
      ...(fixed ? [{ text: "As the analysis found", title: "Undo your correction", run: () => set("auto") }] : []),
      { text: "The book's narrator voice", on: !current, run: () => set(null) },
      ...people.map(c => ({ text: c.name, on: !!current && current.id === c.id, run: () => set(c.id) })),
      "-", voice,
    ]);
  }
  function narratorMenu(anchor) {
    const pick = (vid) => {
      st.narrator = vid;
      if (vid) localStorage.setItem("narrator:" + st.id, vid); else localStorage.removeItem("narrator:" + st.id);
      flushAudio(); renderSelectors(); renderCast(); renderVoiceNames();
    };
    const current = st.narrator === st.defaultVoice ? "" : st.narrator;
    popMenu(anchor, [{ label: "Narrator voice" },
      { text: voiceName(st.defaultVoice) + " (default)", on: !current, run: () => pick("") },
      ...narratorVoices().filter(v => v.id !== st.defaultVoice)
        .map(v => ({ text: v.name, on: current === v.id, run: () => pick(v.id) }))]);
  }

  function gotoChapter(i) {
    st.chapter = i;
    history.replaceState(null, "", "#c=" + i);
    renderText();
    toTop();
  }

  /* Start a chapter at its top. Wide screens scroll the text panel, phones (and narrow tablets) the whole page.
     A scroll still moving when the chapter changes (playback's smooth follow, or the momentum of a swipe on
     iOS) would carry on and leave you at the bottom of the new chapter, so for a moment any scroll that isn't
     yours is undone. */
  function toTop() {
    const main = $("main");
    // Locking overflow for a frame stops an iOS momentum glide at once (scrollTo alone is ignored during one).
    const scrollers = [document.documentElement, document.body, main];
    const top = () => {
      scrollers.forEach(e => { e.style.overflow = "hidden"; });
      main.scrollTop = 0; window.scrollTo(0, 0);
      requestAnimationFrame(() => {
        scrollers.forEach(e => { e.style.overflow = ""; });
        main.scrollTop = 0; window.scrollTo(0, 0);
      });
    };
    top();
    requestAnimationFrame(top);
    let yours = false;
    const mine = () => { yours = true; };
    const undo = () => { if (!yours && (window.scrollY > 0 || main.scrollTop > 0)) top(); };
    const until = setTimeout(done, 4000);
    function done() {
      clearTimeout(until);
      ["touchstart", "wheel", "keydown", "mousedown"].forEach(ev => document.removeEventListener(ev, mine, true));
      window.removeEventListener("scroll", undo); main.removeEventListener("scroll", undo);
    }
    ["touchstart", "wheel", "keydown", "mousedown"].forEach(ev => document.addEventListener(ev, mine, { capture: true, passive: true }));
    window.addEventListener("scroll", undo, { passive: true }); main.addEventListener("scroll", undo, { passive: true });
    [200, 600, 1200, 2000, 3000, 3900].forEach(ms => setTimeout(undo, ms));  // iOS ignores scrollTo during momentum
    // Tell the server where the page ended up, to track down devices where it still goes wrong.
    const snap = (when) => {
      const t = $("#text");
      if (!t) return;
      const vis = [...t.querySelectorAll("p, h2, figure")].filter(e => { const b = e.getBoundingClientRect();
        return b.height > 0 && b.bottom > 0 && b.top < innerHeight; }).length;
      report("chapter", { when, book: st.id, chapter: st.chapter, scrollY: Math.round(scrollY), mainTop: Math.round(main.scrollTop),
        pageH: document.documentElement.scrollHeight, textChars: t.innerText.length, visible: vis, yours,
        reading: document.body.classList.contains("reading"), playing: !!st.session });
    };
    setTimeout(() => snap("0.3s"), 300);
    setTimeout(() => snap("4.5s"), 4500);
  }

  /* A paragraph as narration and quotation pieces. Quoted terms inside a sentence (line.mention) stay in
     the narration piece, as marks, so the sentence is read in one go. bookfile.py segments() splits books the
     same way (and voices them as renderParagraph() and unitRequest() do) to store their speech: keep them alike. */
  function pieces(ci, pi) {
    const ch = st.book.chapters[ci], text = ch.paragraphs[pi], lines = st.script.lines;
    const qs = ch.quotes.filter(q => q[1] === pi).sort((a, b) => a[2] - b[2]);
    const out = []; let pos = 0, marks = [];
    for (const [qid, , s, e] of qs) {
      const l = lines[qid];
      if (l && l.mention && !l.speaker) { marks.push({ qid, s, e }); continue; }
      if (s > pos) out.push({ kind: "n", text: text.slice(pos, s), start: pos, marks });
      marks = [];
      out.push({ kind: "q", qid, text: text.slice(s, e) });
      pos = e;
    }
    if (pos < text.length) out.push({ kind: "n", text: text.slice(pos), start: pos, marks });
    return out;
  }

  /* Display: a space after an ellipsis run straight into a word ("I…I" -> "I… I"), as the server does for speech.
     Only what's shown changes; quotation offsets refer to the stored text. */
  const ELLIPSIS_GAP = /(\.{2,}|[\u2026\u2025]+)(?=[\u2018\u2019\u201c"'(\[]?[\p{L}\p{N}])/gu;
  const spaced = (t) => t.replace(ELLIPSIS_GAP, "$1 ");
  // Where one piece ends with an ellipsis and the next starts a word or a quotation ("…" + "“Krrk”").
  const gapAfter = (left, right) => /(\.{2,}|[\u2026\u2025])$/.test(left) && /^[\u2018\u2019\u201c"'(\[]?[\p{L}\p{N}]/u.test(right);
  function highlight(t) { return [spaced(t)]; }

  function renderParagraph(ci, pi, units) {
    const lines = st.script.lines, chars = charById();
    const p = h("p", { class: pi === 0 && st.book.chapters[ci].paragraphs[0] === st.book.chapters[ci].title ? "heading" : null, "data-pi": pi });
    const ps = pieces(ci, pi);
    ps.forEach((piece, k) => {
      if (piece.kind === "n") {
        const kids = []; let at = 0;
        for (const m of piece.marks || []) {  // quoted terms: dotted underline, double-click to give to a speaker
          const a = m.s - piece.start, b = m.e - piece.start;
          kids.push(...highlight(piece.text.slice(at, a)));
          if (gapAfter(piece.text.slice(at, a), piece.text.slice(a, b))) kids.push(" ");
          const ms = h("span", { class: "mention", title: "Quoted term, read as narration. Double-click to change." },
            ...highlight(piece.text.slice(a, b)));
          ms.addEventListener("dblclick", (e) => { e.stopPropagation(); editLine(m.qid, piece.text.slice(a, b)); });
          kids.push(ms); at = b;
        }
        kids.push(...highlight(piece.text.slice(at)));
        const span = h("span", { class: "nar" }, ...kids);
        if (/[\p{L}\p{N}]/u.test(piece.text)) {
          const idx = units.length;
          const narrator = chars[narratorAt(ci, pi)];
          units.push({ text: piece.text.trim(), voice: narrator ? narrator.voice : null, delivery: null, el: span, ci, pi,
            narration: true });
          span.title = "Click to play from here";
          span.addEventListener("click", () => { if (getSelection().isCollapsed) playFrom(idx); });  // not while selecting text
        }
        p.append(span);
        if (ps[k + 1] && gapAfter(piece.text, ps[k + 1].text)) p.append(" ");
        return;
      }
      const line = lines[piece.qid];
      const c = line && line.speaker ? chars[line.speaker] : null;
      const col = line ? color(c ? c.id : null) : "transparent";
      const dim = st.tierHi && line && !st.tierHi.split(",").includes(c ? tierOf(c) : "main");
      const span = h("span", { class: "q" + (dim ? " dim" : ""), "data-qid": piece.qid,
        title: line && line.say ? `Read aloud as: ${line.say.replace(/\{([a-z]+)\|([^{}|]*)\}/g, "$2 [$1]")}\nClick to play from here` : "Click to play from here",
        style: { background: line ? col + "22" : "transparent", boxShadow: `inset 0 -2px 0 ${col}` } }, ...highlight(piece.text));
      const idx = units.length;
      // Quotations given to the narrator (signs, titles) are read in the narration's voice.
      const nv = line && !c ? chars[narratorAt(ci, pi)] : null;
      // `say`: how a quotation spelled the way it sounds ("Whaaaaat?!") is read; must match bookfile.segments().
      units.push({ text: (line && line.say) || piece.text, voice: c ? c.voice : nv ? nv.voice : null, delivery: line ? line.delivery : null,
        guidance: line && line.guidance != null ? line.guidance : null,
        temperature: line && line.temperature != null ? line.temperature : null, el: span, ci, pi, qid: piece.qid });
      span.addEventListener("click", () => { if (getSelection().isCollapsed) playFrom(idx); });  // not while selecting text
      p.append(span);
      // One tag per speaker turn: skip it when the next piece continues the same quotation ("Yes," he said, "I will.");
      // must match dramatize.interrupts(): a sentence ending in between ("…now?” Asuna whispered. Right behind
      // her ear, Kirito said, “…”) or someone else brought in by name ("and the Dormouse remarked,") makes two turns.
      const between = ps[k + 1], next = ps[k + 2];
      const sameTurn = next && next.kind === "q" && between.text.length <= 80 && /[,;:\u2014\u2013-]\s*$/.test(between.text) &&
        !SENTENCE_BREAK.test(between.text) && !newSpeaker(between.text) &&
        JSON.stringify(lines[next.qid] || null) === JSON.stringify(line || null);
      if (!sameTurn) {
        const sure = line && !line.corrected && line.conf != null ? line.conf : null;
        const unsure = sure != null && sure < UNSURE;
        // How sure the analysis was, as a height meter after the speaker and after each delivery tag it kept.
        const odds = new Map(line && !line.corrected ? (line.dodds || []) : []);
        const tags = line && line.delivery ? line.delivery.split(",").map(t => t.trim()).filter(Boolean) : [];
        p.append(h("span", { class: "tag" + (line && line.corrected ? " fix" : "") + (unsure ? " unsure" : ""),
          style: line ? { background: col + "40", borderColor: col, boxShadow: `inset 3px 0 0 ${col}` } : { color: "var(--muted)" },
          title: line && line.corrected ? "Corrected by you. Click to change." : unsure ? "The analysis isn't sure about this one. Click to check." : "Change speaker or delivery",
          onclick: (e) => { e.stopPropagation(); editLine(piece.qid, piece.text); } },
          line ? (c ? c.name : "narrator") : "not analysed yet",
          sure != null ? meter(sure, `Speaker: ${pct(sure)} sure`) : null,
          tags.length ? h("i", {}, " \u00b7 ", ...tags.flatMap((t, i) => [i ? ", " : "", t,
            odds.has(t) ? meter(odds.get(t), `\u201c${t}\u201d: ${pct(odds.get(t))} sure`) : null])) : null));
      }
    });
    return p;
  }

  // `ornament`: a picture at a scene break, shown small however small it is (an illustration there stays as it is).
  function picture(path, ornament = false) {
    const img = h("img", { class: ornament ? "orn" : "pic", alt: ornament ? "" : "Illustration" });
    const fig = h("figure", { class: "pic" }, img);
    const cached = st.pictures[path];
    (cached || (st.pictures[path] = authBlobUrl(`/api/books/${id}/picture?path=${encodeURIComponent(path)}`))).then(url => {
      if (!url) { fig.remove(); return; }
      img.onload = () => {
        if (ornament) { if (img.naturalHeight > 120) img.className = "pic"; return; }
        if (img.naturalWidth < 64 || img.naturalHeight < 64) fig.remove();  // decorations outside a scene break
      };
      img.src = url;
      if (!ornament) img.onclick = () => window.open(url, "_blank");
    });
    return fig;
  }

  // The EPUB's scene break before paragraph `pi`: its ornament, or ⁂.
  function sceneBreak(ch, pi) {
    const imgs = (ch.images || {})[pi] || [];
    return h("div", { class: "scenebreak", role: "separator", "aria-label": "Scene break", title: "A new scene starts" },
      ...(imgs.length ? imgs.map(p => picture(p, true)) : ["\u2042"]));
  }

  function renderText() {
    stopPlayback();
    const text = $("#text"), units = [];
    const ch = st.book.chapters[st.chapter], chars = charById();
    const breaks = new Set(ch.breaks || []);
    const marker = (pi) => {
      const here = narratorAt(st.chapter, pi), before = pi === 0 ? Symbol() : narratorAt(st.chapter, pi - 1);
      // Where the narrator changes, and at each chapter, point-of-view heading and scene break (where a correction can start).
      if ((here === before && !isPovMarker(ch.paragraphs[pi]) && !breaks.has(pi)) || !(st.script.narration || []).length) return null;
      const c = chars[here];
      const fixed = `${st.chapter}:${pi}` in (st.script.narration_fixed || {});
      return h("p", { class: "small muted narrated", title: "Click to change who narrates this part, or the voice",
          onclick: (e) => narrationMenu(e.currentTarget, pi, c) },
        c ? h("span", {}, "Narrated by ", h("b", { style: { color: color(c.id) } }, c.name),
          c.voice ? h("span", {}, " (", h("span", { class: "vname", "data-voice": c.voice }, voiceName(c.voice)), ")") : " (no voice yet)")
          : h("span", {}, "Narrated in the book's narrator voice (", h("span", { class: "nvoice" }, voiceName(st.narrator || st.defaultVoice)), ")"),
        fixed ? h("i", {}, " \u00b7 set by you") : null);
    };
    const pics = (paths) => (paths || []).map(picture);
    text.replaceChildren(...nonNull([h("h2", {}, ch.title),
      ...ch.paragraphs.flatMap((_, pi) => [breaks.has(pi) ? sceneBreak(ch, pi) : null, marker(pi),
        ...(breaks.has(pi) ? [] : pics((ch.images || {})[pi])),
        // Wordless lines ("…?") the book has here: shown, not read aloud (nothing to say).
        ...((ch.silent || {})[pi] || []).map(t => h("p", { class: "silent", title: "A wordless line: nothing to read aloud" }, t)),
        renderParagraph(st.chapter, pi, units)]),
      ...pics(ch.end_images),
      st.chapter + 1 < st.book.chapters.length
        ? h("p", {}, h("button", { onclick: () => gotoChapter(st.chapter + 1) }, "Next: " + st.book.chapters[st.chapter + 1].title)) : null]));
    st.units = units; st.playing = -1; flushAudio();
    renderChapters();
  }

  /* -------------------------------------------------------------- playback */

  // This page as a reader: with each passage it asks for, it says where it is playing, so the PC makes the passage
  // someone needs next first when several people are reading (app._urgency).
  const reader = Math.random().toString(36).slice(2, 12);
  // `units`: the passages to read from (the next chapter's, while this one ends); `seq` where they come in the order
  // of listening.
  function unitRequest(i, playing, units = st.units, seq = i) {
    const u = units[i], next = units[i + 1];
    // A longer pause before a new scene (bookfile.SCENE_BREAK_PAUSE_MS).
    const scene = next && (next.pi !== u.pi || next.ci !== u.ci) && (st.book.chapters[next.ci].breaks || []).includes(next.pi);
    const req = { text: u.text, book: st.id,
      sentence_pause_ms: next && next.pi === u.pi && next.ci === u.ci ? 120 : scene ? 1200 : 450,
      reader, seq, playing };
    if (u.narration) req.kind = "narration";  // read by the narration model, when Settings has one
    if (st.language) req.language = st.language;
    if (TTS_FORMAT) req.format = TTS_FORMAT;
    if (u.voice || st.narrator) req.voice = u.voice || st.narrator;
    if (u.delivery) req.delivery = u.delivery;
    if (u.guidance != null) req.guidance = u.guidance;
    if (u.temperature != null) req.temperature = u.temperature;
    return req;
  }

  const AHEAD = 10;  // passages synthesized ahead of the one playing
  function fetchUnit(i, playing) {
    if (!st.units[i]) return null;
    if (!st.fetches.has(i)) {
      const ctrl = new AbortController();
      const promise = api("POST", "/api/tts", unitRequest(i, playing), ctrl.signal).then(speechUrl);
      promise.catch(() => {});  // a cancelled look-ahead isn't an error
      st.fetches.set(i, { promise, ctrl });
    }
    return st.fetches.get(i).promise;
  }

  /* Keep only the passages from `from` to `from + AHEAD`: the others are cancelled, and the server stops making
     their audio, so jumping elsewhere doesn't wait behind ten passages nobody will hear. */
  function keepFetches(from) {
    for (const [i, f] of st.fetches) {
      if (i >= from && i <= from + AHEAD) continue;
      f.ctrl.abort();
      f.promise.then(u => URL.revokeObjectURL(u)).catch(() => {});
      st.fetches.delete(i);
    }
  }

  function flushAudio() {
    keepFetches(Infinity);
    if (st.warm) {
      for (const f of st.warm.fetches.values()) { f.ctrl.abort(); f.promise.then(u => URL.revokeObjectURL(u)).catch(() => {}); }
      st.warm = null;
    }
  }

  /* While a chapter's last passages play, the look-ahead runs on into the next chapter, so playback carries on
     there without a wait. Its passages are laid out as renderText() will show them (they ask for the same audio),
     and requested through the same /api/tts; continuing takes those requests over. */
  function warmNextChapter(playing) {
    const ci = st.chapter + 1, want = playing + AHEAD + 1 - st.units.length;
    if (ci >= st.book.chapters.length || want <= 0) return;
    if (!st.warm || st.warm.chapter !== ci) {
      const units = [];
      st.book.chapters[ci].paragraphs.forEach((_, pi) => renderParagraph(ci, pi, units));
      st.warm = { chapter: ci, units, fetches: new Map() };
    }
    const w = st.warm;
    for (let i = 0; i < Math.min(want, w.units.length); i++) {
      if (w.fetches.has(i)) continue;
      const ctrl = new AbortController();
      const promise = api("POST", "/api/tts", unitRequest(i, playing, w.units, st.units.length + i), ctrl.signal).then(speechUrl);
      promise.catch(() => {});
      w.fetches.set(i, { promise, ctrl });
    }
  }

  // At the end of a chapter, playback goes on at the top of the next one (with the passages already asked for).
  function continueToNextChapter() {
    const ci = st.chapter + 1;
    if (ci >= st.book.chapters.length) return false;
    const warm = st.warm && st.warm.chapter === ci ? st.warm : null;
    st.warm = null;  // not cancelled by the chapter change below
    st.continuing = true;  // the keep-alive plays on through it (a phone may not let it start again unattended)
    try {
      gotoChapter(ci);
      if (warm) for (const [i, f] of warm.fetches) st.fetches.set(i, f);
      playFrom(0);  // its stopPlayback() runs before this returns
    } finally { st.continuing = false; }
    return true;
  }

  /* The lock screen and notification show the book and chapter, with play/pause and next/previous chapter. */
  const mediaSession = "mediaSession" in navigator ? navigator.mediaSession : null;
  function showMediaSession(playing) {
    if (!mediaSession) return;
    if (playing) {
      mediaSession.metadata = new MediaMetadata({ title: st.book.chapters[st.chapter].title || st.book.title,
        artist: st.book.author || "", album: st.book.title,
        artwork: st.coverUrl ? [{ src: st.coverUrl, sizes: "512x512", type: "image/jpeg" }] : [] });
    }
    mediaSession.playbackState = playing ? "playing" : "paused";
  }
  if (mediaSession) {
    const handle = (action, run) => { try { mediaSession.setActionHandler(action, run); } catch (_) { /* not supported */ } };
    handle("play", () => playFrom(Math.max(0, st.playing)));
    handle("pause", () => stopPlayback());
    handle("stop", () => stopPlayback());
    handle("nexttrack", () => { if (st.chapter + 1 < st.book.chapters.length) { gotoChapter(st.chapter + 1); playFrom(0); } });
    // The chapter's start, or the chapter before when already at the start.
    handle("previoustrack", () => {
      const back = st.playing < 3 && st.chapter > 0;
      if (back) gotoChapter(st.chapter - 1);
      playFrom(0);
    });
    authBlobUrl(`/api/books/${id}/cover?w=512`).then(u => { st.coverUrl = u; }).catch(() => {});
  }

  async function playFrom(i) {
    stopPlayback();
    const session = (st.session = Symbol("play"));
    playLabel(true);
    keepAlive().play().catch(() => {});
    if (keepScreenOn()) screenAwake(true);
    showMediaSession(true);
    for (let k = i; k < st.units.length; k++) {
      if (st.session !== session) return;
      const u = st.units[k];
      st.playing = k;
      noteBookmark(u.ci, u.pi);
      document.querySelectorAll(".cur").forEach(e => e.classList.remove("cur"));
      u.el.classList.add("cur");
      u.el.scrollIntoView({ block: "center", behavior: "smooth" });
      $("#playStatus").textContent = "";
      playLoading(true);
      let url;
      try {
        keepFetches(k);
        const current = fetchUnit(k, k);
        for (let j = 1; j <= AHEAD; j++) fetchUnit(k + j, k);  // made on the PC after this one (and others' next ones)
        warmNextChapter(k);
        url = await current;
      } catch (e) {
        if (st.session !== session) return;  // stopped or moved elsewhere meanwhile
        if (e.name === "AbortError") { k--; continue; }  // its audio was dropped (e.g. new narrator): fetch again
        stopPlayback(); $("#playStatus").textContent = "Error: " + e.message; return;
      }
      if (st.session !== session) return;
      playLoading(false);
      st.audio.src = url;
      try {
        await st.audio.play();
      } catch (e) {
        if (st.session !== session) return;
        if (e.name === "NotAllowedError") {  // the browser wouldn't start it (it was asleep): say so, don't hang
          stopPlayback(); $("#playStatus").textContent = "The browser paused reading \u2014 tap \u25B6 to go on"; return;
        }
        continue;  // a clip it can't play: on to the next
      }
      await new Promise(res => { st.audio.onended = res; st.audio.onpause = res; st.audio.onerror = res; });
    }
    if (st.session !== session) return;
    if (!st.audio.ended && st.units.length) { stopPlayback(); return; }  // paused on the last passage
    if (sleepAtChapterEnd()) { stopPlayback(); return; }
    if (!continueToNextChapter()) stopPlayback();
  }

  function stopPlayback() {
    st.session = null;
    st.audio.pause();
    if (!st.continuing && keepAliveAudio) keepAliveAudio.pause();
    if (!st.continuing) screenAwake(false);
    showMediaSession(false);
    playLabel(false);
    const s = $("#playStatus"); if (s) s.textContent = "";
  }

  async function playSample(voiceId) {
    stopPlayback();
    const url = await authBlobUrl(`/api/voices/${voiceId}/audio`);
    if (url) { st.audio.src = url; st.audio.play(); }
  }

  /* -------------------------------------------------------------- editing */

  async function reloadScript() {
    st.script = await get(`/api/books/${st.id}/script`);
    renderAll();
  }


  /* A text box that is also a drop-down: clicking it lists every option, typing filters them, and a name that
     isn't one of them is someone new. value(): the chosen option's id, the typed name, or null (the narrator). */
  function speakerCombo(options, selected) {
    const norm = (s) => s.trim().toLowerCase();
    const input = h("input", { autocomplete: "off", spellcheck: "false", placeholder: "Pick a character, or type a new name" });
    const list = h("div", { class: "combo-list", style: { display: "none" } });
    const hint = h("div", { class: "small muted combo-hint" });
    let shown = [], active = -1;
    const match = () => {
      const v = norm(input.value);
      return !v || v === "narrator" ? options[0] : options.find(o => norm(o.name) === v);
    };
    const update = () => {
      const v = input.value.trim();
      hint.textContent = !v ? "Empty: the narrator reads it" : match() ? "" : `New character: \u201c${v}\u201d`;
    };
    const close = () => { list.style.display = "none"; active = -1; };
    const choose = (o) => { input.value = o.id ? o.name : "Narrator"; close(); update(); };
    const mark = () => [...list.children].forEach((c, i) => c.classList.toggle("active", i === active));
    const open = (all) => {
      const q = all ? "" : norm(input.value);
      shown = options.filter(o => !q || norm(o.name).includes(q));
      active = -1;
      list.replaceChildren(...shown.map(o => h("div", { class: "combo-item",
        onmousedown: (e) => { e.preventDefault(); choose(o); } }, o.name, o.note ? h("span", { class: "muted" }, ` \u00b7 ${o.note}`) : null)));
      list.style.display = shown.length ? "" : "none";
    };
    // Not opened on focus: the dialog focuses this box as it opens. Typing replaces the selected name.
    input.addEventListener("focus", () => input.select());
    input.addEventListener("click", () => { if (list.style.display === "none") open(true); });
    input.addEventListener("input", () => { open(false); update(); });
    input.addEventListener("blur", close);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (list.style.display === "none") open(true);
        if (!shown.length) return;
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length;
        mark();
        list.children[active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();  // the form's first button is Cancel: Enter would close the dialog
        if (active >= 0 && list.style.display !== "none") choose(shown[active]); else close();
      } else if (e.key === "Escape" && list.style.display !== "none") {
        e.preventDefault(); e.stopPropagation(); close();  // closes the list, not the dialog
      }
    });
    const set = (id) => { const o = options.find(x => x.id === (id || "")); input.value = o && o.id ? o.name : "Narrator"; update(); };
    set(selected);
    return { el: h("div", {}, h("div", { class: "combo" }, input, list), hint), input, set,
      value: () => { const m = match(); return m ? m.id || null : input.value.trim(); } };
  }

  /* Comma-separated words as tags ("shouting, urgent"): each a chip with × to remove it; what is typed becomes a
     tag at a comma or Enter; Backspace in the empty box takes the last one back to edit, as does clicking a tag.
     value(): the tags joined as "a, b", with what is still typed. */
  function tagInput(text, placeholder, approved) {
    const split = (s) => s.split(",").map(t => t.trim().replace(/\s+/g, " ")).filter(Boolean);
    let tags = split(text);
    const known = approved || {};
    const listId = "tags-" + Math.random().toString(36).slice(2);
    const input = h("input", { autocomplete: "off", spellcheck: "false", placeholder, list: listId });
    const options = h("datalist", { id: listId }, ...Object.entries(known).map(([t, covers]) => h("option", { value: t, label: covers })));
    const box = h("div", { class: "tagbox", onclick: (e) => { if (e.target === box) input.focus(); } });
    const add = (s) => { for (const t of split(s)) if (!tags.some(x => x.toLowerCase() === t.toLowerCase())) tags.push(t); };
    const render = () => {
      box.replaceChildren(...tags.map((t, i) => {
        const ok = !approved || t.toLowerCase() in known;
        return h("span", { class: ok ? "dchip" : "dchip unapproved", onmousedown: (e) => e.preventDefault() },  // keep the box focused
          h("span", { class: "dtext", title: ok ? (known[t.toLowerCase()] ? `${known[t.toLowerCase()]}\nClick to edit` : "Edit")
            : "Not an approved tag: the speech model gets it as written\nClick to edit",
            onclick: () => { commit(); tags.splice(i, 1); input.value = t; render(); input.focus(); } }, t),
          h("button", { type: "button", title: `Remove \u201c${t}\u201d`, onclick: () => { tags.splice(i, 1); render(); input.focus(); } }, "\u00d7"));
      }), input, options);
      input.placeholder = tags.length ? "" : placeholder;
    };
    const commit = () => { if (input.value.trim()) { add(input.value); input.value = ""; render(); } };
    input.addEventListener("input", (e) => {
      if (input.value.includes(",")) {  // typed or pasted: everything before the last comma becomes tags
        const parts = input.value.split(",");
        input.value = parts.pop().trimStart();
        add(parts.join(","));
        render();
        input.focus();
      } else if ((!e.inputType || e.inputType === "insertReplacementText") && input.value.toLowerCase() in known) {
        add(input.value); input.value = ""; render(); input.focus();  // picked from the suggestions
      }
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }  // (the form's first button is Cancel)
      else if (e.key === "Backspace" && !input.value && tags.length) { e.preventDefault(); input.value = tags.pop(); render(); input.focus(); }
    });
    // Not made a tag when the box loses focus: that happened as Save was pressed, the box could grow a line, the
    // dialog (centred) moved, and the click missed Save. What is typed is saved as it is (value()).
    render();
    return { el: box, value: () => [...tags, ...split(input.value)].join(", "), initial: split(text).join(", "),
      add: (t) => { add(t); render(); } };
  }

  function editLine(qid, text) {
    const line = st.script.lines[qid] || {}, chars = charById();
    const nameOf = (w) => w == null ? "Narrator" : (chars[w] || {}).name || w;
    const speaker = speakerCombo([{ id: "", name: "Narrator", note: "nobody speaks" },
      ...st.script.characters.map(c => ({ id: c.id, name: c.name, note: c.lines ? `${c.lines} lines` : "" }))], line.speaker);
    const del = tagInput(line.delivery || "", "e.g. angry, shout", st.script.delivery_tags);
    // What the analysis said and how sure it was; its other likely speakers are one tap away.
    const said = line.corrected ? line.analysis : line;
    const odds = [];
    if (said && said.conf != null) {
      odds.push(h("p", { class: "small muted" }, `Analysis: ${nameOf(said.speaker)}, ${pct(said.conf)} sure` +
        (line.corrected ? " (you changed it)" : "")));
      const alts = (said.alts || []).filter(([w]) => w === null || chars[w]);
      if (alts.length) odds.push(h("div", { class: "odds" }, h("span", { class: "small muted" }, "Also possible:"),
        ...alts.map(([w, p]) => h("button", { type: "button", title: "Pick this speaker (then Save)",
          onclick: () => speaker.set(w) }, `${nameOf(w)} ${pct(p)}`))));
    } else if (line.corrected && said) {
      odds.push(h("p", { class: "small muted" }, `Analysis said: ${nameOf(said.speaker)}`));
    }
    // How sure it was of each delivery tag; the ones it wasn't sure enough of were left out, one tap away.
    const dodds = [];
    if (said && said.dodds && said.dodds.length) {
      const kept = new Set((said.delivery || "").split(",").map(t => t.trim()).filter(Boolean));
      const sure = said.dodds.filter(([t]) => kept.has(t)), unsure = said.dodds.filter(([t]) => !kept.has(t));
      if (sure.length) dodds.push(h("p", { class: "small muted" }, "Delivery: " + sure.map(([t, p]) => `${t} ${pct(p)}`).join(", ")));
      if (unsure.length) dodds.push(h("div", { class: "odds" }, h("span", { class: "small muted",
        title: `Tags the analysis wasn't sure enough of (under ${pct(st.script.delivery_min_conf || 0.7)}) are left out` }, "Left out, unsure:"),
        ...unsure.map(([t, p]) => h("button", { type: "button", title: "Add this tag (then Save)", onclick: () => del.add(t) }, `${t} ${pct(p)}`))));
    }
    const report = reportBox({ line: qid });
    // The speech model's per-line settings (VoxCPM2: guidance, temperature): a slider each, default from the server.
    const TUNE_TEXT = {
      guidance: { label: "Guidance", lower: "calmer, closer to the voice", higher: "follows the delivery more",
        help: "Lower if the line is overacted or the voice sounds unlike itself; higher if the delivery doesn\u2019t come through." },
      temperature: { label: "Temperature", lower: "quieter, clearer", higher: "louder, breathier",
        help: "Lower is a little quieter and clearer, higher louder and breathier; below 0.7 it can go silent." },
    };
    const tunes = Object.entries(st.script.tuning || {}).map(([name, t]) => {
      const txt = TUNE_TEXT[name] || { label: name, lower: "lower", higher: "higher", help: "" };
      const label = h("label", {});
      const slider = h("input", { type: "range", min: t.min, max: t.max, step: t.step,
        value: line[name] != null ? line[name] : t.default, style: { padding: 0 } });
      const show = () => { const v = Number(slider.value);
        label.textContent = `${txt.label}: ${v.toFixed(2)}` + (v === t.default ? " (default)" : v < t.default ? ` (${txt.lower})` : ` (${txt.higher})`); };
      slider.addEventListener("input", show);
      show();
      return { name, t, el: [label, slider, h("div", { class: "small muted" }, txt.help)], value: () => Number(slider.value) };
    });
    // Not dialogue: a quoted word or term the narration says ("how to say “paper” in this place's language"), read in
    // the flow of its sentence instead of as a line of its own.
    const asNarration = h("input", { type: "checkbox", checked: !!line.mention });
    const speechFields = h("div", {}, h("label", {}, "Speaker"), speaker.el, h("label", {}, "Delivery"), del.el, ...dodds,
      ...tunes.flatMap(x => x.el));
    const showFields = () => {
      speechFields.style.opacity = asNarration.checked ? ".4" : "";
      speechFields.style.pointerEvents = asNarration.checked ? "none" : "";
      speechFields.inert = asNarration.checked;
    };
    asNarration.addEventListener("change", showFields);
    showFields();
    const narrationBox = h("label", { class: "check", title: "A quoted word or term inside the narration, not someone speaking: " +
      "read with the rest of its sentence by the narrator, without a pause or a voice of its own" },
      asNarration, " Not dialogue: read as part of the narration");
    const ro = st.script.can_edit === false;
    if (ro) { speechFields.inert = narrationBox.inert = true; asNarration.disabled = true; }
    dialog("Who says this?", [h("p", {}, text), ...odds, narrationBox, speechFields, report.note], ro ? null : async () => {
      // Only what changed: saving the dialog as it was isn't a correction.
      const body = {}, sp = speaker.value(), dv = del.value();
      if (asNarration.checked !== !!line.mention) body.mention = asNarration.checked;
      if (!asNarration.checked) {
        if ((sp || null) !== (line.speaker || null) || body.mention === false) body.speaker = sp;
        if (dv !== del.initial) body.delivery = dv;
        for (const x of tunes)
          if (x.value() !== (line[x.name] != null ? line[x.name] : x.t.default)) body[x.name] = x.value() === x.t.default ? null : x.value();
      }
      if (!Object.keys(body).length) return;
      // The answer is the book's lines and cast as they are now: shown at once, without fetching the script again.
      const { data } = await api("PATCH", `/api/books/${st.id}/lines/${qid}`, body);
      st.script = { ...st.script, ...data };
      renderAll();
    }, report.btn);
  }

  /* "Incorrect analysis": flags a line to be looked at later, without fixing it (fixes are reported by
     themselves). The first click asks what's wrong, the second sends it. The box's .btn and .note
     can also be placed apart (the line dialog puts the button on its Cancel/Save row). */
  function reportBox(target) {
    const note = h("textarea", { rows: 2, class: "reportnote", placeholder: "What's wrong? (optional)", style: { display: "none" } });
    const btn = h("button", { type: "button", class: "flagbtn", title: "Report this as analysed wrong, to be cleaned up later" },
      "\u2691 Incorrect analysis");
    btn.onclick = async () => {
      if (note.style.display === "none") { note.style.display = ""; note.focus(); btn.textContent = "\u2691 Send report"; return; }
      try {
        await api("POST", `/api/books/${st.id}/reports`, { ...target, note: note.value.trim() });
        btn.textContent = "Reported \u2713"; btn.disabled = true; note.disabled = true;
      } catch (e) { alert(e.message); }
    };
    const box = h("div", { class: "report" }, btn, note);
    return Object.assign(box, { btn, note });
  }

  // A character's panel (openCharacterEditor): changes reload the book's script and voices, and drop speech made
  // with the old ones.
  function openCharacter(cid) {
    openCharacterEditor(st.id, cid, { script: st.script, voices: st.voices, color, play: playSample, state: st,
      pronounce: (name, voice) => openPronunciations(name, null, voice),
      onChange: async () => {
        flushAudio(); st.voices = (await get("/api/voices?all=1")).voices; await reloadScript();
        return { script: st.script, voices: st.voices };
      } });
  }

  /* Keep following an analysis that is still running. */
  function follow() {
    if (!BUSY.includes(st.script.status)) return;
    setTimeout(async () => {
      const before = Object.keys(st.script.lines).length;
      st.script = await get(`/api/books/${st.id}/script`);
      renderStatus(); renderCast();
      if (Object.keys(st.script.lines).length !== before && !st.session && !$("#dlg").open) renderText();
      if (!BUSY.includes(st.script.status)) { st.voices = (await get("/api/voices?all=1")).voices; renderAll(); }
      follow();
    }, 10000);
  }

  renderAll();
  get("/api/voices?all=1").then(v => {
    st.voices = v.voices; st.defaultVoice = v.default; renderSelectors(); renderCast(); renderVoiceNames();
  }).catch(() => {});
  follow();
  const toLine = new URLSearchParams(location.hash.slice(1)).get("q");  // a link to a line (#c=3&q=...): to it, marked
  if (toLine) {
    const go = () => {
      const q = document.querySelector(`#text [data-qid="${CSS.escape(toLine)}"]`);
      if (q) { q.scrollIntoView({ block: "center" }); q.classList.add("resumed"); setTimeout(() => q.classList.remove("resumed"), 3000); }
    };
    requestAnimationFrame(go);
    setTimeout(go, 400);  // again once pictures above it have taken their space
  } else if (resume) {  // back to the paragraph this profile was at, briefly marked
    const go = () => {
      const p = document.querySelector(`#text p[data-pi="${resume.paragraph}"]`);
      if (p) { p.scrollIntoView({ block: "start" }); p.classList.add("resumed"); setTimeout(() => p.classList.remove("resumed"), 2500); }
    };
    requestAnimationFrame(go);
    setTimeout(go, 400);  // again once pictures above it have taken their space
  }

  /* -------------------------------------------------------------- bookmark */

  /* This profile's place (bookmark.py) follows the passage playing, or the paragraph at the top of the text when
     scrolling stops; saved a few seconds after it settles, and when the page is left. */
  function noteBookmark(ci, pi) {
    const key = `${ci}:${pi}`;
    if (bookmarkAt.last === key) return;
    bookmarkAt.pending = { chapter: ci, paragraph: pi };
    clearTimeout(bookmarkAt.timer);
    bookmarkAt.timer = setTimeout(saveBookmark, 3000);
  }
  function saveBookmark(leaving) {
    clearTimeout(bookmarkAt.timer);
    const body = bookmarkAt.pending;
    if (!body || !ME.id) return;
    bookmarkAt.pending = null;
    bookmarkAt.last = `${body.chapter}:${body.paragraph}`;
    fetch(`/api/books/${st.id}/bookmark`, { method: "PUT", keepalive: !!leaving,
      headers: { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(body) }).catch(() => {});
  }
  let scrollTimer = null;
  const onScroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      if (st.session) return;  // playing: the passage playing is the place
      const top = Math.max(0, $("main").getBoundingClientRect().top) + 8;
      const p = [...document.querySelectorAll("#text p[data-pi]")].find(e => e.getBoundingClientRect().bottom > top);
      if (p) noteBookmark(st.chapter, Number(p.dataset.pi));
    }, 1000);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  $("main").addEventListener("scroll", onScroll, { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveBookmark(true); });
  window.addEventListener("pagehide", () => saveBookmark(true));

  // Select a word or name in the text to fix how it is said.
  const selBtn = h("button", { class: "selbtn", type: "button", title: "Fix how this is said (for the series)" }, "\uD83D\uDDE3 Pronunciation\u2026");
  selBtn.style.display = "none";
  document.body.append(selBtn);
  const hideSel = () => { selBtn.style.display = "none"; };
  const checkSel = () => {
    if (st.script.can_edit === false) return hideSel();
    const sel = getSelection();
    if (!sel.rangeCount || !$("#text") || !$("#text").contains(sel.anchorNode)) return hideSel();
    const word = sel.toString().replace(/[\u201c\u201d"\u2018.,;:!?()]+/g, " ").replace(/[\u2019']s?\s*$/, "").trim();
    if (!word || word.length > 40 || word.split(/\s+/).length > 4 || !/\p{L}/u.test(word)) return hideSel();
    const r = sel.getRangeAt(0).getBoundingClientRect();
    const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const para = node && node.closest("p");
    if (matchMedia("(pointer: coarse)").matches) {
      // Touch screens: the system's copy/look-up toolbar sits right by the selection, so the button goes to
      // the bottom of the screen instead, above the player.
      const below = Math.max(0, ...["#readctl .rcbtns"].map(s => $(s) && $(s).getBoundingClientRect())
        .filter(r => r && r.height).map(r => innerHeight - r.top));
      selBtn.classList.add("touch");
      selBtn.textContent = `\uD83D\uDDE3 How \u201c${word.length > 24 ? word.slice(0, 22) + "\u2026" : word}\u201d is said\u2026`;
      Object.assign(selBtn.style, { left: "50%", top: "auto", bottom: `calc(${below + 12}px + env(safe-area-inset-bottom))` });
    } else {
      selBtn.style.bottom = "";
      selBtn.style.left = Math.max(8, Math.min(r.left, innerWidth - 180)) + "px";
      selBtn.style.top = (r.top > 50 ? r.top - 38 : r.bottom + 8) + "px";
    }
    selBtn.style.display = "";
    selBtn.onclick = () => {
      hideSel();
      const text = para ? [...para.childNodes].filter(n => !(n.classList && n.classList.contains("tag"))).map(n => n.textContent).join("") : "";
      openPronunciations(word, text);
    };
  };
  $("#text").addEventListener("mouseup", () => setTimeout(checkSel));
  let selTimer = null;  // phones select by long-press: no mouseup
  document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(checkSel, 500); });
  document.addEventListener("mousedown", (e) => { if (e.target !== selBtn) hideSel(); });
  $("main").addEventListener("scroll", hideSel);
}
</script>
</body>
</html>
