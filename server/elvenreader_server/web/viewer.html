<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ElvenReader books</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6; --accent:#3557d6; --card:#fff; --hl:#fff3b0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#e7e7ea; --muted:#9a9aa2; --line:#2c2c31; --accent:#7d9bff; --card:#1d1d21; --hl:#4a4320; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  a { color:var(--accent); text-decoration:none; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } header .grow { flex:1; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; padding:18px; }
  .grid .serieshead { grid-column:1/-1; font-size:15px; margin:6px 0 -8px; display:flex; gap:8px; align-items:baseline; }
  .grid .serieshead:not(:first-child) { margin-top:14px; }
  .seriessel { max-width:18em; font-size:12.5px; padding:2px 4px; } dialog .seriessel { max-width:none; width:100%; }
  .selbtn { position:fixed; z-index:30; font-size:12.5px; box-shadow:0 2px 8px #0003; }
  #gpubanner { position:fixed; inset:auto; top:64px; left:50%; transform:translateX(-50%); margin:0; max-width:min(560px, 92vw);
    background:var(--card); color:var(--fg); border:1px solid var(--accent); border-radius:10px; padding:8px 14px; box-shadow:0 4px 16px #0003;
    font-size:13px; }
  #gpubanner .bar { margin:6px 0 2px; } #gpubanner.ok { border-color:#3cb44b; }
  /* Reading mode: just the text; header, sidebar and player go away. */
  .readctl { display:none; }
  body.reading header, body.reading aside, body.reading .player { display:none !important; }
  body.reading .layout { grid-template-columns:1fr; height:100vh; }
  body.reading main { padding:48px 24px 96px; }
  body.reading .readctl { display:flex; gap:8px; position:fixed; right:18px; bottom:18px; z-index:35; transition:opacity .5s; }
  body.reading .readctl button { box-shadow:0 2px 10px #0003; padding:6px 12px; }
  body.reading .readctl.faded { opacity:0; pointer-events:none; }
  .serieslist { padding:12px 18px; max-width:900px; }
  .serieslist .sr { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .serieslist .sr h3 { margin:0 0 4px; font-size:16px; display:flex; gap:8px; align-items:center; }
  .serieslist ol { margin:6px 0 0; padding-left:22px; }
  .qrow { display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; margin-bottom:6px; }
  .qrow.drag { opacity:.4; } .qrow.over { border-top:3px solid var(--accent); }
  .qrow .qhandle { cursor:grab; color:var(--muted); font-size:18px; user-select:none; }
  .qrow .qpos { width:1.6em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .qrow .qcover { width:34px; height:50px; flex:none; background:#8883; border-radius:3px; overflow:hidden; }
  .qrow .qcover img { width:100%; height:100%; object-fit:cover; }
  .qrow .qinfo { min-width:0; flex:1 1 auto; } .qrow .qtitle { font-weight:600; color:inherit; }
  .qrow.now { border-color:var(--accent); }
  .qrow .qbtns { display:flex; gap:10px; flex:none; } .qrow .qbtns .iconbtn { font-size:16px; padding:4px 8px; }
  .book { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; color:inherit; }
  .book .cover { aspect-ratio:2/3; background:#8883; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font-weight:600; }
  .book .cover img { width:100%; height:100%; object-fit:cover; }
  .book .info { padding:10px; } .book .title { font-weight:600; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0; } .bar > div { height:100%; background:var(--accent); }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 55px); }
  aside { border-right:1px solid var(--line); overflow:auto; padding:12px 12px 80px; background:var(--card); }
  aside h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  .chap { display:block; width:100%; text-align:left; border:0; border-radius:4px; padding:3px 6px; background:none; }
  .chap.on { background:var(--accent); color:#fff; } .chap .cnt { float:right; font-size:12px; opacity:.7; }
  .char { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:6px; cursor:pointer; min-height:28px; }
  .char:hover { background:var(--line); } .char.on { box-shadow:inset 0 0 0 1px var(--accent); }
  .char .sw { width:9px; height:9px; border-radius:50%; flex:none; }
  .char .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .char .cnt { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .char .gap { width:22px; flex:none; }
  .iconbtn { border:0; background:none; padding:2px 5px; color:var(--muted); line-height:1; border-radius:5px; flex:none; }
  .iconbtn:hover { color:var(--accent); background:var(--line); }
  .casthead { display:flex; align-items:center; gap:6px; margin:16px 0 6px; } .casthead h3 { margin:0; flex:1; }
  #castSearch { width:100%; margin-bottom:4px; }
  details.tier > summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--muted); margin:10px 0 2px; list-style-position:inside; }
  .menu { position:fixed; z-index:50; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px;
    min-width:250px; max-width:92vw; box-shadow:0 8px 24px #0005; }
  .menu button { display:block; width:100%; text-align:left; border:0; background:none; padding:6px 10px; border-radius:5px; }
  .menu button:hover { background:var(--line); } .menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  .menu .lbl { font-size:12px; color:var(--muted); padding:4px 10px 0; }
  dialog.drawer { margin:0 0 0 auto; height:100vh; max-height:100vh; width:min(460px,100vw); max-width:100vw; min-width:0;
    border-radius:0; border:0; border-left:1px solid var(--line); padding:0; }
  .drawer .dh { position:sticky; top:0; z-index:2; background:var(--card); display:flex; align-items:center; gap:8px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  .drawer .dh h2 { margin:0; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drawer .dh .sw { width:12px; height:12px; border-radius:50%; flex:none; }
  .drawer section { padding:10px 16px 14px; border-bottom:1px solid var(--line); }
  .drawer section h4 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .drawer .rowx { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .drawer .rowx select { width:auto; flex:1; min-width:0; }
  .drawer details.profile > summary { cursor:pointer; list-style-position:inside; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:4px 12px; background:var(--card); }
  .seg button + button { border-left:1px solid var(--line); } .seg button.on { background:var(--accent); color:#fff; }
  .q.dim { opacity:.35; background:none !important; box-shadow:none !important; }
  main { overflow:auto; padding:20px 40px 120px; }
  main .text { max-width:780px; margin:auto; font-size:17px; line-height:1.75; }
  .text h2 { font-size:22px; } .text h4 { margin:26px 0 6px; color:var(--muted); font-size:13px; }
  .text p { margin:0 0 .9em; } .text p.heading { font-weight:600; font-size:1.1em; }
  .q { border-radius:4px; padding:1px 2px; cursor:pointer; }
  .nar { cursor:pointer; border-radius:4px; }
  .cur { outline:2px solid var(--accent); background:var(--hl); }
  .tag { font-size:12px; border-radius:10px; padding:0 7px; margin:0 3px; white-space:nowrap; vertical-align:1px; cursor:pointer; color:var(--fg); border:1px solid var(--line); }
  .tag i { color:var(--muted); }
  .tag.fix::after { content:" \270E"; }
  .mention { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
  figure.pic { margin: 1.2em 0; text-align: center; }
  img.pic { max-width: 100%; max-height: 85vh; cursor: zoom-in; border-radius: 4px; }
  .player { position:fixed; bottom:0; left:300px; right:0; background:var(--card); border-top:1px solid var(--line); padding:8px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); min-width:380px; max-width:560px; }
  dialog label { display:block; margin:8px 0 2px; font-size:13px; color:var(--muted); }
  dialog select, dialog input { width:100%; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  mark { background:var(--hl); color:inherit; }
  dialog.wide { max-width:820px; width:94vw; padding:18px 22px; }
  dialog.wide textarea, dialog.wide input:not([type=file]):not([type=number]) { width:100%; }
  textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .sec { border-top:1px solid var(--line); margin-top:14px; padding-top:6px; }
  .sec h4 { margin:6px 0; }
  .line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .line input[type=number] { width:6.5em; }
  .banner { background:var(--hl); border-radius:8px; padding:8px 12px; margin:8px 0; }
  table.vt { border-collapse:collapse; width:100%; } table.vt td, table.vt th { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  .narrowonly, .scrim, aside .sidehead { display:none; }
  @media (max-width: 760px) {
    .narrowonly { display:inline-block; }
    header { gap:8px; padding:8px 10px; } header h1 { font-size:15px; } #status, header .grow { display:none; }
    header #search, header #charFilter { flex:1 1 140px; min-width:0; }
    #seriesInfo .seriessel { max-width:12em; }
    .layout { grid-template-columns:1fr; height:auto; }
    aside { position:fixed; top:0; bottom:0; left:0; width:min(340px,86vw); z-index:40; border-right:1px solid var(--line);
      padding:0 12px 24px; transform:translateX(-105%); visibility:hidden; transition:transform .2s, visibility .2s;
      overscroll-behavior:contain; box-shadow:4px 0 24px #0005; }
    aside.open { transform:none; visibility:visible; }
    aside .sidehead { position:sticky; top:0; z-index:1; background:var(--card); display:flex; align-items:center;
      padding:10px 0 4px; border-bottom:1px solid var(--line); }
    aside .sidehead strong { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    body.sideopen .scrim { display:block; position:fixed; inset:0; z-index:39; background:#0006; }
    body.sideopen { overflow:hidden; }
    main { padding:16px 16px 160px; overflow:visible; min-width:0; } body { overflow-x:hidden; } main .text { font-size:16px; }
    body.reading .layout { height:auto; } body.reading main { padding:28px 16px 96px; }
    .player { left:0; }
    .qrow { flex-wrap:wrap; gap:8px; } .qrow .qhandle, .qrow .grow { display:none; }
    .qrow .qinfo { flex:1 1 calc(100% - 90px); }
    .qrow .qbtns { flex:1 1 100%; display:flex; justify-content:flex-end; gap:14px; margin-top:-4px; }
    .qrow .qbtns .iconbtn { font-size:17px; padding:4px 8px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="vdlg" class="wide"></dialog>
<dialog id="cdlg" class="drawer"></dialog>
<script>
"use strict";
const EMBEDDED_TOKEN = __TOKEN__;  // only filled in for requests from the PC itself
const TOKEN_KEY = "elvenreader-token";
const TOKEN = (() => {
  const m = location.hash.match(/(?:^#|&)token=([^&]+)/);
  if (m) {
    const t = decodeURIComponent(m[1]);
    localStorage.setItem(TOKEN_KEY, t);
    history.replaceState(null, "", location.pathname + location.search);  // keep it out of the address bar
    return t;
  }
  return EMBEDDED_TOKEN || localStorage.getItem(TOKEN_KEY) || localStorage.getItem("androidreader-token") || "";  // the old name's key
})();
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const nonNull = (xs) => xs.filter(x => x != null);

function tokenScreen(message) {
  if (tokenScreen.shown) return;
  tokenScreen.shown = true;
  const input = h("input", { type: "password", placeholder: "Token", autocomplete: "off", style: { width: "16em" } });
  const save = (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    location.reload();
  };
  $("#app").replaceChildren(h("form", { onsubmit: save, style: { maxWidth: "32em", margin: "3em auto" } },
    h("h2", {}, "Enter the server token"),
    h("p", {}, message),
    h("div", { style: { display: "flex", gap: "8px" } }, input, h("button", { class: "primary" }, "Open")),
    h("p", { class: "muted small" }, "The token is shown on the server's page on the PC (http://127.0.0.1:3950/). " +
      "Easier: open the viewer link or scan its QR code from that page; this browser then remembers the token.")));
  input.focus();
}

async function api(method, path, body, signal) {
  const r = await fetch(path, {
    method, cache: "no-cache", headers: { Authorization: "Bearer " + TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined, signal,
  });
  if (r.status === 401) { tokenScreen("The token was not accepted. Enter the current one."); throw new Error("Wrong token"); }
  const ct = r.headers.get("Content-Type") || "";
  const data = ct.includes("json") ? await r.json() : await r.arrayBuffer();
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return { data, headers: r.headers };
}
const get = (p) => api("GET", p).then(r => r.data);

async function authBlobUrl(path) {
  const r = await fetch(path, { cache: "no-cache", headers: { Authorization: "Bearer " + TOKEN } });
  if (r.status === 401) tokenScreen("The token was not accepted. Enter the current one.");
  if (!r.ok) return null;
  return URL.createObjectURL(await r.blob());
}

function wav(pcm, rate) {
  const b = new ArrayBuffer(44), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.byteLength, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.byteLength, true);
  return new Blob([b, pcm], { type: "audio/wav" });
}

/* Speech comes compressed (Ogg Opus, or MP3 where the browser can't play Opus), about a sixth of raw PCM. */
const TTS_FORMAT = (() => {
  const a = document.createElement("audio");
  return a.canPlayType('audio/ogg; codecs="opus"') ? "opus" : a.canPlayType("audio/mpeg") ? "mp3" : "";
})();
/* A playable URL for a /api/tts response, whichever way it came (compressed, or raw PCM as a fallback). */
function speechUrl(r) {
  const type = r.headers.get("Content-Type") || "";
  return URL.createObjectURL(type.startsWith("audio/L16") || !type.startsWith("audio/")
    ? wav(r.data, Number(r.headers.get("X-Sample-Rate") || 24000)) : new Blob([r.data], { type }));
}

// Mid-lightness colours: readable as tints and underlines on both the light and the dark theme.
const PALETTE = ["#e6194b","#3cb44b","#4f7cff","#f58231","#b05ce6","#2bb5d8","#f032e6","#c08a3e","#3fae9f","#a8a820","#9b8cff","#5aa0ff","#a9a9a9","#7fb800","#d6608a","#d98c3a","#2fae6a","#8a5cf6","#e0605a","#c9a500"];
const LANGS = { en:"English", de:"German", fr:"French", es:"Spanish", it:"Italian", pt:"Portuguese", ja:"Japanese", zh:"Chinese", ko:"Korean", ru:"Russian", nl:"Dutch", pl:"Polish" };
const BUSY = ["queued", "running", "casting"];

function statusText(s) {
  return ({ none: "Not analysed", queued: "Waiting to be analysed", running: `Analysing ${Math.round(s.progress * 100)}%`,
    casting: "Creating voices\u2026", done: "Analysed", error: "Error" })[s.status] + (s.detail ? " \u2014 " + s.detail : "");
}

let SERIES_NAMES = null;  // cached for the series pickers (declared before the routing below runs a view)
const PLAYERS = new Set();  // audio elements, to tell the server someone is listening

/* ------------------------------------------------------------------ activity and GPU banner */

/* The server keeps the GPU on what the site is used for (reading, designing voices, idle). Open pages say
   when someone uses them: interacting with the page, or audio playing. */
let lastInteract = 0, lastBeat = 0;
const beat = () => { lastBeat = Date.now(); api("POST", "/api/activity").catch(() => {}); pollGpu(true); };
["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => {
  const quiet = Date.now() - lastInteract > 30000;
  lastInteract = Date.now();
  if (quiet && TOKEN) beat();  // coming back: tell the server at once so it can get the speech model ready
}, { passive: true, capture: true }));
setInterval(() => {
  const playing = [...PLAYERS].some(a => !a.paused);
  if (TOKEN && (playing || (document.visibilityState === "visible" && Date.now() - lastInteract < 60000))) beat();
}, 30000);

/* A banner while models load or analysis makes room, with progress from how long the load took before. */
let gpuTimer = null, gpuShown = null;
async function pollGpu(soon) {
  clearTimeout(gpuTimer);
  if (!TOKEN || document.visibilityState !== "visible") { gpuTimer = setTimeout(pollGpu, 5000); return; }
  let g = null;
  try { g = (await api("GET", "/api/gpu")).data; } catch (_) {}
  const msg = g ? gpuMessage(g) : null;
  // A popover sits in the top layer, so the banner shows above open dialogs (the voice editor) too.
  const el = $("#gpubanner") || document.body.appendChild(h("div", { id: "gpubanner", role: "status", popover: "manual" }));
  const show = () => { if (el.matches(":popover-open")) el.hidePopover(); el.showPopover(); };
  const hide = () => { if (el.matches(":popover-open")) el.hidePopover(); };
  if (msg) {
    el.className = "";
    el.replaceChildren(...nonNull([h("div", {}, msg.text), msg.p != null ? h("div", { class: "bar" }, h("div", { style: { width: Math.round(msg.p * 100) + "%" } })) : null]));
    show();
    gpuShown = msg.done;
  } else if (gpuShown) {
    el.className = "ok"; el.replaceChildren(h("div", {}, "\u2713 " + gpuShown)); show();
    gpuShown = null;
    setTimeout(() => { if (!gpuShown) hide(); }, 3000);
  } else if (el.className !== "ok") hide();
  gpuTimer = setTimeout(pollGpu, msg ? 1000 : soon ? 1500 : 4000);
}
function gpuMessage(g) {
  const sp = g.engines.speech || {}, dz = g.engines.voice_designer || {}, act = g.activity || {}, llm = g.llm || {};
  const left = (x) => {
    const s = Math.round((x.expected_s || 30) - (x.loading_s || 0));
    return s > 1 ? `about ${s} s` : "nearly there";
  };
  const prog = (x) => Math.min(0.95, (x.loading_s || 0) / Math.max(1, x.expected_s || 30));
  if (sp.state === "loading")
    return { text: `Loading the reading voice (${sp.label})\u2026 ${left(sp)}`, p: prog(sp), done: "The reading voice is ready" };
  if (dz.state === "loading")
    return { text: `Loading the voice designer (${dz.label})\u2026 ${left(dz)}. Book analysis is paused while you design voices.`,
      p: prog(dz), done: "The voice designer is ready" };
  if (act.designing && llm.state !== "stopped")
    return { text: "Pausing book analysis to make room for designing voices\u2026", p: null, done: "Ready to design voices" };
  if (act.in_use && llm.where === "whole_gpu")
    return { text: "Moving book analysis aside so you can read and listen\u2026", p: null, done: "Ready to read" };
  return null;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pollGpu(true); });
const route = location.pathname.replace(/\/+$/, "");
const routeMatch = route.match(/^\/books\/([A-Za-z0-9_-]+)$/);
if (!TOKEN) tokenScreen("This browser doesn't have the server token yet.");
else if (routeMatch && routeMatch[1] === "voices") voicesView();
else if (routeMatch && routeMatch[1] === "series") seriesView();
else if (routeMatch && routeMatch[1] === "settings") settingsView();
else if (routeMatch && routeMatch[1] === "queue") queueView();
else if (routeMatch) bookView(routeMatch[1]); else libraryView();
if (TOKEN) { pollGpu(true); beat(); }  // opening a page is using the site

/* ------------------------------------------------------------------ series */

async function seriesNames() {
  if (!SERIES_NAMES) SERIES_NAMES = (await get("/api/series")).series.map(g => g.name);
  return SERIES_NAMES;
}

/* A series chooser: "Detect from title", the series known so far and "New series…". `onPick(name)` gets ""
   for "detect from the title"; returning false puts the old choice back. */
function seriesSelect(names, current, auto, detected, onPick) {
  const AUTO = "__auto__", NEW = "__new__";
  // The detected name is the "Detect from title" entry; it is only listed on its own when set by hand.
  const list = [...new Set([...names, current].filter(n => n && (n !== detected || (!auto && n === current))))]
    .sort((a, b) => a.localeCompare(b));
  const sel = h("select", { class: "seriessel", title: "Books in a series share their cast and voices" },
    h("option", { value: AUTO }, detected ? `Detect from title (${detected})` : "Detect from title"),
    ...list.map(n => h("option", { value: n }, n)),
    h("option", { value: NEW }, "New series\u2026"));
  sel.value = auto ? AUTO : current;
  let last = sel.value;
  sel.onchange = async () => {
    let v = sel.value;
    if (v === NEW) {
      const name = (prompt("Name of the new series") || "").trim();
      if (!name) { sel.value = last; return; }
      if (!list.includes(name)) sel.insertBefore(h("option", { value: name }, name), sel.lastChild);
      sel.value = v = name;
    }
    sel.disabled = true;
    const ok = await onPick(v === AUTO ? "" : v);
    sel.disabled = false;
    if (ok === false) sel.value = last; else { last = sel.value; SERIES_NAMES = null; }
  };
  return sel;
}

/* Volume order inside a series ("Part 2 Volume 3" -> [2, 3]); books without a number go last. */
function byVolume(a, b) {
  const x = a.volume || [], y = b.volume || [];
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if (x[i] === undefined || y[i] === undefined) return x[i] === undefined ? 1 : -1;
    if (x[i] !== y[i]) return x[i] - y[i];
  }
  return (a.title || "").localeCompare(b.title || "");
}

/* Rename a book; resolves to the new title (null if cancelled). The volume order in a series follows the title. */
async function renameBook(id, title) {
  const to = (prompt("Book title. Volumes of a series are ordered by the number after \u201cVol.\u201d, \u201cVolume\u201d, " +
    "\u201cBook\u201d or \u201cPart\u201d, e.g. \u201cSword Art Online, Vol. 19: Moon Cradle\u201d.", title) || "").trim();
  if (!to || to === title) return null;
  try { await api("PATCH", `/api/books/${id}`, { title: to }); } catch (e) { alert(e.message); return null; }
  return to;
}

/* Shared popup menu below `anchor`: items are {text, run, title, on}, "-" or {label}. */
function popMenu(anchor, items) {
  document.querySelectorAll(".menu").forEach(m => m.remove());
  const m = h("div", { class: "menu", role: "menu" }, ...items.map(it => it === "-" ? h("hr")
    : it.label ? h("div", { class: "lbl" }, it.label)
    : h("button", { type: "button", title: it.title || "", onclick: () => { m.remove(); it.run(); } },
        it.on === undefined ? "" : (it.on ? "\u2713 " : "\u2003 "), it.text)));
  (anchor.closest("dialog") || document.body).append(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth;
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  const off = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", off, true); } };
  setTimeout(() => document.addEventListener("mousedown", off, true));
}

/* Add a book: upload EPUB files from this device. The server parses the book, analyses who says what, sorts
   the cast and creates voices. Its series (detected from the title) can be set before or right after. */
async function addBook(onDone) {
  const d = $("#dlg");
  d.onclose = null;
  const names = await seriesNames().catch(() => []);
  const files = h("input", { type: "file", accept: ".epub,application/epub+zip", multiple: true });
  let chosen = "";  // "" = detect from the title
  const series = seriesSelect(names, "", true, null, async (name) => { chosen = name; });
  const cast = h("input", { type: "checkbox", checked: true, style: { width: "auto" } });
  const bar = h("div", { style: { width: "0%" } }), status = h("p", { class: "small" });
  const go = h("button", { class: "primary", type: "button" }, "Add");
  const upload = (file) => new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("epub", file); form.append("cast", cast.checked ? "1" : "0");
    if (chosen) form.append("series", chosen);
    const x = new XMLHttpRequest();
    x.open("POST", "/api/library/import"); x.setRequestHeader("Authorization", "Bearer " + TOKEN);
    x.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = Math.round(e.loaded / e.total * 100) + "%"; };
    x.onload = () => {
      let data = {}; try { data = JSON.parse(x.responseText); } catch (_) {}
      x.status === 200 ? resolve(data) : reject(new Error(data.error || "HTTP " + x.status));
    };
    x.onerror = () => reject(new Error("Upload failed"));
    x.send(form);
  });
  go.onclick = async () => {
    if (!files.files.length) { status.textContent = "Choose an EPUB file."; return; }
    go.disabled = true;
    const added = [];
    try {
      for (const f of files.files) {
        status.textContent = `Uploading ${f.name}\u2026`; bar.style.width = "0%";
        added.push(await upload(f));
      }
    } catch (e) { status.textContent = "\u26A0 " + e.message; go.disabled = false; if (!added.length) return; }
    onDone && onDone();
    confirmSeries(added);
  };
  /* After the upload: each book's series, which can still be fixed before its cast is created. */
  async function confirmSeries(added) {
    SERIES_NAMES = null;
    const known = await seriesNames().catch(() => names);
    const rows = added.map(b => {
      const note = h("span", { class: "small muted" });
      return h("div", { style: { margin: "10px 0" } },
        h("div", {}, h("b", {}, b.title)),
        h("div", { style: { display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap", marginTop: "4px" } },
          h("span", { class: "small" }, "Series"),
          seriesSelect(known, b.series, b.series_auto, b.series_detected, async (name) => {
            try {
              const r = (await api("POST", `/api/books/${b.id}/series`, { series: name, apply: true })).data;
              note.textContent = r.applied ? `\u2713 ${r.applied} characters and their voices from the series` : "\u2713 saved";
              onDone && onDone();
            } catch (e) { alert(e.message); return false; }
          }), note));
    });
    const started = added.some(b => BUSY.includes(b.status));
    d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, added.length === 1 ? "Book added" : `${added.length} books added`),
      h("p", { class: "small muted" }, (started ? "The analysis has started. " : "Already analysed. ") +
        "Books in a series share their cast and voices: if a series below is wrong, " +
        "change it now, before the cast is created (later it can be changed on the book\u2019s page)."),
      ...rows,
      h("div", { class: "row" }, h("button", { class: "primary", value: "ok" }, "Done"))));
  }
  d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, "Add a book"),
    h("label", {}, "EPUB file(s) from this device"), files,
    h("label", {}, "Series"), h("div", {}, series),
    h("p", { class: "small muted", style: { marginTop: "4px" } }, "Books in a series share their cast and voices. Usually detected from the title."),
    h("label", { style: { display: "flex", gap: "8px", alignItems: "center" } }, cast, "Create the cast's voices when the analysis is done"),
    h("p", { class: "small muted" }, "The book is parsed on the server, then analysed (who says what, the cast's tiers and profiles), " +
      "which takes about an hour for a long novel; you can read along as lines come in."),
    h("div", { class: "bar" }, bar), status,
    h("div", { class: "row" }, h("button", { value: "cancel" }, "Cancel"), go)));
  d.showModal();
}

/* The books waiting for analysis, in order: drag them (or use the buttons) to change it. */
async function queueView() {
  $("#app").replaceChildren(
    h("header", {}, h("a", { href: "/books" }, "\u2190 Books"), h("h1", {}, "Analysis queue"), h("span", { class: "grow" })),
    h("div", { class: "serieslist", id: "queue" }, h("p", { class: "muted" }, "Loading\u2026")));
  const covers = {};
  let timer = null, dragging = null;
  const minutes = (words) => Math.max(1, Math.round((words || 0) / 1800));  // ~1,800 words a minute with the whole GPU
  const cover = (b) => {
    const el = h("div", { class: "qcover" });
    if (b.cover) {
      covers[b.id] = covers[b.id] || authBlobUrl(`/api/books/${b.id}/cover`);
      covers[b.id].then(u => u && el.replaceChildren(h("img", { src: u, alt: "" })));
    }
    return el;
  };
  async function send(order) {
    clearTimeout(timer);
    try { render((await api("PUT", "/api/queue", { order })).data); } catch (e) { alert(e.message); refresh(); }
  }
  async function post(path) {
    clearTimeout(timer);
    try { render((await api("POST", path)).data); } catch (e) { alert(e.message); refresh(); }
  }
  const toBottom = (b, current) => h("button", { class: "iconbtn", title: "Send to the bottom of the queue" +
    (current ? " (it stops now and continues where it stopped when its turn comes)" : ""),
    onclick: () => post(`/api/queue/${b.id}/bottom`) }, "\u2913");
  function render(q) {
    const el = $("#queue");
    const ids = q.queued.map(b => b.id);
    const move = (from, to) => { const o = ids.slice(); o.splice(to, 0, o.splice(from, 1)[0]); send(o); };
    const row = (b, i) => {
      const r = h("div", { class: "qrow", draggable: "true", "data-id": b.id },
        h("span", { class: "qhandle", title: "Drag to reorder" }, "\u2817"),
        h("span", { class: "qpos" }, String(i + 1)), cover(b),
        h("div", { class: "qinfo" },
          h("a", { href: `/books/${b.id}`, class: "qtitle" }, b.title),
          h("div", { class: "small muted" }, [b.series && b.series !== b.title ? b.series : null, `${(b.words || 0).toLocaleString()} words`,
            `about ${minutes(b.words)} min`, b.lines ? `${b.lines} lines done` : null].filter(Boolean).join(" \u00b7 "))),
        h("span", { class: "grow" }),
        h("span", { class: "qbtns" },
        h("button", { class: "iconbtn", title: q.current
            ? `Analyse it now: \u201c${q.current.title}\u201d stops, keeps its progress and goes next`
            : "Analyse it now", onclick: () => post(`/api/queue/${b.id}/now`) }, "\u25B6\uFE0E"),
        h("button", { class: "iconbtn", title: "Analyse it next", disabled: i === 0, onclick: () => move(i, 0) }, "\u2912"),
        h("button", { class: "iconbtn", title: "Move up", disabled: i === 0, onclick: () => move(i, i - 1) }, "\u2191"),
        h("button", { class: "iconbtn", title: "Move down", disabled: i === ids.length - 1, onclick: () => move(i, i + 1) }, "\u2193"),
        toBottom(b),
        h("button", { class: "iconbtn", title: "Take it out of the queue (what's done is kept; \u201cContinue analysis\u201d in the library puts it back)",
          onclick: async () => {
            if (!confirm(`Take \u201c${b.title}\u201d out of the analysis queue?`)) return;
            try { render((await api("DELETE", `/api/queue/${b.id}`)).data); } catch (e) { alert(e.message); }
          } }, "\u2715")));
      r.addEventListener("dragstart", (e) => { dragging = b.id; r.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
      r.addEventListener("dragend", () => { dragging = null; r.classList.remove("drag"); refreshSoon(); });
      r.addEventListener("dragover", (e) => { if (dragging && dragging !== b.id) { e.preventDefault(); r.classList.add("over"); } });
      r.addEventListener("dragleave", () => r.classList.remove("over"));
      r.addEventListener("drop", (e) => {
        e.preventDefault(); r.classList.remove("over");
        if (!dragging || dragging === b.id) return;
        move(ids.indexOf(dragging), ids.indexOf(b.id));
      });
      return r;
    };
    const cur = q.current;
    el.replaceChildren(...[
      h("h3", {}, "Analysing now"),
      cur ? h("div", { class: "qrow now" }, cover(cur),
        h("div", { class: "qinfo" }, h("a", { href: `/books/${cur.id}`, class: "qtitle" }, cur.title),
          h("div", { class: "bar" }, h("div", { style: { width: Math.round((cur.progress || 0) * 100) + "%" } })),
          h("div", { class: "small muted" }, `${Math.round((cur.progress || 0) * 100)}% \u00b7 ${cur.detail || ""}`)),
        q.queued.length ? h("span", { class: "qbtns" }, toBottom(cur, true)) : null)
        : h("p", { class: "small muted" }, "Nothing."),
      h("h3", {}, `Next up (${q.queued.length})`),
      q.queued.length ? h("div", {}, ...q.queued.map(row)) : h("p", { class: "small muted" }, "Nothing is waiting. Add books from the library."),
      q.queued.length ? h("p", { class: "small muted" }, "\u25B6\uFE0E analyses a book now (the current one keeps its progress and goes next). " +
        "Drag a book, or use \u2912 \u2191 \u2193 \u2913, to change the order. " +
        `Together about ${minutes(q.queued.reduce((a, b) => a + (b.words || 0), 0))} min with the whole GPU; longer while you read, ` +
        "and analysis pauses while you design voices.") : null,
      q.casting.length ? h("h3", {}, `Voices still to create (${q.casting.length})`) : null,
      ...q.casting.map(b => h("div", { class: "qrow" }, cover(b), h("div", { class: "qinfo" },
        h("a", { href: `/books/${b.id}`, class: "qtitle" }, b.title), h("div", { class: "small muted" }, b.detail || ""))))].filter(Boolean));
    refreshSoon();
  }
  function refreshSoon() { clearTimeout(timer); timer = setTimeout(refresh, 5000); }

    if (dragging) return refreshSoon();
    try { render(await get("/api/queue")); } catch (e) { if (!tokenScreen.shown) $("#queue").replaceChildren(h("p", {}, "Error: " + e.message)); }
  }

/* Fix how words and names are said, for a series (every book of it), one book or all books. Each fix is a
   respelling ("MY-nuh") applied before synthesis, so it works with any speech model; listen before saving.
   opts: {book?, series?, term?, sample?, voice?, names?: [..], onChange?} */
async function pronunciationsDialog(opts = {}) {
  const d = $("#dlg");
  d.onclose = null;
  const q = opts.book ? `book=${encodeURIComponent(opts.book)}` : `series=${encodeURIComponent(opts.series || "")}`;
  let list = await get(`/api/pronunciations?${q}`);
  const series = list.series_name || opts.series || "";
  let names = opts.names;
  if (!names && series) {
    const g = (await get("/api/series").catch(() => ({ series: [] }))).series.find(x => x.name.toLowerCase() === series.toLowerCase());
    names = g ? Object.values(g.characters || {}).filter(e => !e.unnamed).map(e => e.name) : [];
  }
  const term = h("input", { placeholder: "Word or name as written, e.g. Myne", value: opts.term || "" });
  const resp = h("input", { placeholder: "How it sounds, e.g. MY-nuh" });
  const phon = h("input", { placeholder: "e.g. M AY1 N AH0 (optional, ARPAbet)" });
  const cased = h("input", { type: "checkbox", style: { width: "auto" } });
  const scope = h("select", {},
    series ? h("option", { value: "series" }, `Every book of ${series}`) : null,
    opts.book ? h("option", { value: "book" }, "Only this book") : null,
    h("option", { value: "global" }, "All books"));
  const note = h("span", { class: "small" });
  let editing = null;  // the entry being changed
  const sampleFor = (t) => {
    // The sentence of the passage the word came from (short to synthesize), else a stock line.
    const sentences = (opts.sample || "").match(/[^.!?\u2026]+[.!?\u2026]*["\u201d\u2019]?/g) || [];
    const hit = t && sentences.find(s => s.toLowerCase().includes(t.toLowerCase()));
    return hit && hit.length < 400 ? hit.trim() : `${t}. I said ${t}, didn't I?`;
  };
  async function say(text, extra) {
    const body = { text, format: TTS_FORMAT || undefined };
    if (opts.book) body.book = opts.book;
    if (opts.voice) body.voice = opts.voice;
    if (extra) body.extra_pronunciations = extra;
    try { playUrl(speechUrl(await api("POST", "/api/tts", body))); } catch (e) { alert(e.message); }
  }
  const fix = () => [{ term: term.value.trim(), respelling: resp.value.trim(), phonemes: phon.value.trim(), case_sensitive: cased.checked }];
  const reset = () => { editing = null; term.value = ""; resp.value = ""; phon.value = ""; cased.checked = false; save.textContent = "Save"; };
  const save = h("button", { class: "primary", type: "button", onclick: async () => {
    if (!term.value.trim() || (!resp.value.trim() && !phon.value.trim())) { note.textContent = "Type the word and how it sounds."; return; }
    try {
      if (editing && editing.scope === scope.value) {
        await api("PATCH", `/api/pronunciations/${editing.id}`, { term: term.value.trim(), respelling: resp.value.trim(),
          phonemes: phon.value.trim(), case_sensitive: cased.checked });
      } else {
        if (editing) await api("DELETE", `/api/pronunciations/${editing.id}`);
        await api("POST", "/api/pronunciations", { ...fix()[0], scope: scope.value, book: opts.book, series: series || undefined });
      }
      note.textContent = `\u2713 Saved: ${term.value.trim()} \u2192 ${resp.value.trim() || phon.value.trim()}`;
      reset(); await reload(); opts.onChange && opts.onChange();
    } catch (e) { alert(e.message); }
  } }, "Save");
  async function reload() { list = await get(`/api/pronunciations?${q}`); render(); }
  const row = (e) => h("div", { class: "line", style: { gap: "6px" } },
    h("b", {}, e.term), h("span", { class: "muted" }, "\u2192"), h("span", {}, e.respelling || e.phonemes),
    e.case_sensitive ? h("span", { class: "small muted" }, "(match case)") : null, h("span", { class: "grow" }),
    h("button", { class: "iconbtn", type: "button", title: "Listen", onclick: () => say(sampleFor(e.term)) }, "\u25B6"),
    h("button", { class: "iconbtn", type: "button", title: "Change", onclick: () => {
      editing = e; term.value = e.term; resp.value = e.respelling; phon.value = e.phonemes || ""; cased.checked = e.case_sensitive;
      scope.value = e.scope; save.textContent = "Save changes"; resp.focus();
    } }, "\u270E"),
    h("button", { class: "iconbtn", type: "button", title: "Delete", onclick: async () => {
      if (!confirm(`Delete the pronunciation of \u201c${e.term}\u201d?`)) return;
      await api("DELETE", `/api/pronunciations/${e.id}`); await reload(); opts.onChange && opts.onChange();
    } }, "\uD83D\uDDD1"));
  const group = (title, entries) => entries.length ? [h("h4", { style: { margin: "12px 0 4px" } }, `${title} (${entries.length})`),
    ...entries.slice().sort((a, b) => a.term.localeCompare(b.term)).map(row)] : [];
  function render() {
    const known = new Set([...list.series, ...list.book, ...list.global].map(e => e.term.toLowerCase()));
    const chips = (names || []).filter(n => n && !known.has(n.toLowerCase())).slice(0, 24);
    d.replaceChildren(h("form", { method: "dialog",
        // Enter in a field saves instead of closing the dialog.
        onsubmit: (e) => { if (!e.submitter || e.submitter.value !== "close") { e.preventDefault(); save.click(); } } },
      h("div", { class: "line" }, h("h3", { style: { margin: 0, flex: 1 } }, "Pronunciations" + (series ? ` \u2014 ${series}` : "")),
        h("button", { value: "close" }, "Close")),
      h("p", { class: "small muted", style: { margin: "4px 0 8px" } }, "Fix how a word or name is said: type it the way it sounds (CAPITALS for the " +
        "stressed part, e.g. MY-nuh, BEN-oh), listen, save. Every voice and model uses it."),
      h("label", {}, "Word or name"), term,
      chips.length ? h("div", { class: "small", style: { margin: "4px 0", display: "flex", flexWrap: "wrap", gap: "4px" } },
        h("span", { class: "muted" }, "Names:"), ...chips.map(n => h("button", { type: "button", class: "small",
          onclick: () => { term.value = n; resp.focus(); } }, n))) : null,
      h("label", {}, "Say it like"), resp,
      h("div", { class: "line", style: { marginTop: "6px" } },
        h("button", { type: "button", title: "Hear how it is said now", onclick: () => term.value.trim() && say(sampleFor(term.value.trim())) }, "\u25B6 Now"),
        h("button", { type: "button", title: "Hear it with this fix (not saved yet)", onclick: () => {
          if (term.value.trim() && (resp.value.trim() || phon.value.trim())) say(sampleFor(term.value.trim()), fix());
        } }, "\u25B6 With the fix"),
        h("span", { class: "grow" }), scope, save),
      h("details", {}, h("summary", { class: "small" }, "Advanced"),
        h("label", {}, "Phonemes (used by models that read them, like OmniVoice; the respelling otherwise)"), phon,
        h("label", { class: "small", style: { display: "flex", gap: "6px", alignItems: "center" } }, cased, "Match case (e.g. \u201cMay\u201d the name, not \u201cmay\u201d)")),
      note,
      ...group(series ? `Every book of ${series}` : "Series", list.series),
      ...group("Only this book", list.book),
      ...group("All books", list.global),
      !list.series.length && !list.book.length && !list.global.length ? h("p", { class: "small muted" }, "No pronunciations yet.") : null));
    if (!d.open) d.showModal();
  }
  render();
  if (opts.term) resp.focus(); else term.focus();
}

const sharedPlayer = new Audio();
PLAYERS.add(sharedPlayer);

/* The voice editor: describe the voice, pick one of three takes. Everything else is under Advanced.
   ctx: { book, character, characterName, onChange(voice) }. */
async function openVoiceEditor(voiceId, ctx = {}) {
  const d = $("#vdlg");
  let v = await get(`/api/voices/${voiceId}`);
  const engines = await installedEngines().catch(() => []);
  const designers = engines.filter(e => e.voice_design);
  let takes = [];                // generated options to choose from
  let message = "";              // short status line ("Saved.")
  let clip = null;               // advanced: { blob, url, duration } for a recorded or uploaded reference
  let recorder = null;
  const ui = {};                 // inputs that survive re-rendering

  // A voice shared with other characters is copied for this one, unless the user says otherwise. The same
  // character in other volumes of the series is this character, not another one: it keeps the voice too.
  const isSelf = (u) => u.book === ctx.book && u.character === ctx.character;
  const sameCharacter = (u) => {
    const me = v.used_by.find(isSelf);
    if (!me || isSelf(u) || u.default || u.series !== me.series) return false;
    const names = new Set([me.name, ...(me.aliases || [])].map(n => n.toLowerCase()));
    return u.character === me.character || [u.name, ...(u.aliases || [])].some(n => names.has(n.toLowerCase()));
  };
  const otherVolumes = () => v.used_by.filter(sameCharacter);
  const others = () => v.used_by.filter(u => !isSelf(u) && !sameCharacter(u));
  const forThisOnly = () => ctx.character && others().length > 0 && !(ui.everyone && ui.everyone.checked);
  async function target() {
    if (!forThisOnly()) return v.id;
    const copy = (await api("POST", `/api/voices/${v.id}/duplicate`, { book: ctx.book, character: ctx.character })).data;
    v = copy;
    return copy.id;
  }

  const changed = async (fresh, note) => { v = fresh; message = note || ""; render(); if (ctx.onChange) await ctx.onChange(v); };
  async function busy(btn, label, fn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = label;
    try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.textContent = old; }
  }
  function field(key, attrs, value) {
    if (!ui[key]) {
      ui[key] = h(attrs.rows ? "textarea" : "input", attrs);
      ui[key].addEventListener("input", () => { ui[key].dataset.touched = "1"; });
    }
    if (value !== undefined && !ui[key].dataset.touched) ui[key].value = value ?? "";
    return ui[key];
  }
  const untouch = (...keys) => keys.forEach(k => ui[k] && delete ui[k].dataset.touched);

  async function send(method, path, form) {
    const r = await fetch(path, { method, body: form, headers: { Authorization: "Bearer " + TOKEN } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
    return data;
  }

  async function setClip(blob) {
    let duration = 0;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      duration = (await ac.decodeAudioData(await blob.arrayBuffer())).duration;
      ac.close();
    } catch (e) { alert("This browser can't play that file; the server may still read it."); }

    ui.start = null; ui.end = null; ui.clipText = null;
    render();
  }
  function clipForm(extra) {
    const f = new FormData();
    f.append("audio", clip.blob, "clip");
    if (Number(ui.start.value) > 0) f.append("start", ui.start.value);
    if (ui.end.value && Number(ui.end.value) < clip.duration) f.append("end", ui.end.value);
    for (const [k, val] of Object.entries(extra)) if (val) f.append(k, val);
    return f;
  }
  function listenToClip() {
    const a = sharedPlayer, s = Number(ui.start.value) || 0, e = Number(ui.end.value) || clip.duration;
    a.pause(); a.src = clip.url;
    a.onloadedmetadata = () => { a.currentTime = s; a.play(); };
    a.ontimeupdate = () => { if (a.currentTime >= e) { a.pause(); a.ontimeupdate = null; } };
  }
  async function toggleRecording(btn) {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { alert("No microphone access: " + e.message); return; }
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); recorder = null; setClip(new Blob(chunks, { type: chunks[0]?.type || "audio/webm" })); };
    recorder.start();
    btn.textContent = "\u25A0 Stop recording";
  }

  async function makeTakes(btn, age = 0) {
    const description = ui.description.value.trim();
    if (!description) { alert("Describe the voice first."); return; }
    const label = age < 0 ? "Making 3 younger options\u2026 (about a minute)" : age > 0 ? "Making 3 older options\u2026 (about a minute)"
      : "Making 3 options\u2026 (about a minute)";
    await busy(btn, label, async () => {
      const body = { description, count: 3 };
      if (age) body.age = age;
      if (ui.sampleLine && ui.sampleLine.value.trim()) body.text = ui.sampleLine.value.trim();
      const r = (await api("POST", `/api/voices/${v.id}/design`, body)).data;
      takes = r.candidates;
      // The description now says the new age; pressing again goes a step further.

      message = !age ? "" : r.age_from ? `${age < 0 ? "Younger" : "Older"}: ${r.age_from} \u2192 ${r.age_to}` +
        (v.seed != null ? ". Option 1 keeps this voice's seed (closest to it)." : ".")
        : `No age in the description, so it asks for a ${age < 0 ? "younger" : "older"}-sounding voice.`;

    });

  async function keep(btn, take, i) {
    await busy(btn, "Saving\u2026", async () => {

        h("label", {}, "Seed ", field("seed", { type: "number", step: 1 }, v.seed ?? ""))),
      h("datalist", { id: "langs" }, ...Object.values(LANGS).map(l => h("option", { value: l }))),
      h("label", {}, "Transcript of the reference clip"), field("refText", { rows: 2 }, v.ref_text),
      h("button", { onclick: (e) => busy(e.target, "Saving\u2026", async () => {
        const id = await target();
        const body = { name: ui.name.value, language: ui.language.value, seed: ui.seed.value === "" ? null : ui.seed.value,
          ref_text: ui.refText.value, description: ui.description.value.trim() };
        untouch("name", "language", "seed", "refText", "description");
        await changed((await api("PATCH", `/api/voices/${id}`, body)).data, "Details saved.");
      }) }, "Save details"));

    const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);
    s.push(h("h4", {}, "Use a real recording instead"),
      h("p", { class: "small muted", style: { margin: 0 } }, "5\u201320 s of one person speaking clearly. Any audio format."),
      h("div", { class: "line" },
        h("input", { type: "file", accept: "audio/*,.wav,.mp3,.m4a,.ogg,.flac,.webm", onchange: (e) => e.target.files[0] && setClip(e.target.files[0]) }),

    if (clip) {

      ui.end = ui.end || h("input", { type: "number", step: 0.1, min: 0, value: clip.duration.toFixed(1) });
      ui.clipText = ui.clipText || h("textarea", { rows: 2, placeholder: "What is said (filled in automatically if left empty)" });
      s.push(h("div", { class: "line" }, h("span", { class: "small" }, `${clip.duration.toFixed(1)} s \u2014 keep from`),
          ui.start, h("span", { class: "small" }, "to"), ui.end, h("span", { class: "small" }, "s"),
          h("button", { onclick: listenToClip }, "\u25B6 Listen")),
        ui.clipText,
        h("div", { class: "line" },
          h("button", { onclick: (e) => busy(e.target, "Transcribing\u2026", async () => {
            ui.clipText.value = (await send("POST", "/api/transcribe", clipForm({ language: v.language }))).text;
          }) }, "Fill in what is said"),

        }) }, "\u21B6 Undo") : null,

/* ------------------------------------------------------------------ book view */

async function bookView(id) {
  const st = {

  app.replaceChildren(

      } }, "\u270E"),
      h("span", { class: "small muted", id: "seriesInfo" }),
      h("span", { class: "muted small", id: "status" }), h("span", { class: "grow" }),
      h("a", { href: "/books/voices" }, "Voices"),
      h("input", { id: "search", placeholder: "Search text\u2026", onchange: (e) => { st.search = e.target.value.trim(); renderText(); } }),
      h("select", { id: "charFilter", onchange: (e) => { st.filterChar = e.target.value; renderText(); renderCast(); } }),

        onclick: () => setReading(true) }, "\u26F6")),
    h("div", { class: "layout" },
      h("aside", {},
        h("div", { class: "sidehead" }, h("strong", {}, st.book.title),
          h("button", { class: "iconbtn", title: "Close (Esc)", onclick: () => setSide(false) }, "\u2715")),
        h("h3", {}, "Chapters"), h("div", { id: "chapters" }),
        h("div", { class: "casthead" }, h("h3", {}, "Cast"), h("span", { class: "small muted", id: "castBusy" }),
          h("button", { class: "iconbtn", title: "Cast actions", onclick: (e) => bookMenu(e.currentTarget) }, "\u22EF")),
        h("input", { id: "castSearch", type: "search", placeholder: "Find a character\u2026",
          oninput: (e) => { st.castQuery = e.target.value.trim().toLowerCase(); renderCast(); } }),
        h("div", { id: "cast" })),
      h("main", {}, h("div", { class: "text", id: "text" }))),

    h("div", { class: "player" },
      h("button", { class: "primary", id: "playBtn", onclick: () => st.session ? stopPlayback() : playFrom(Math.max(0, st.playing)) }, "\u25B6 Play"),

      h("select", { id: "narrator", onchange: (e) => { st.narrator = e.target.value; localStorage.setItem("narrator:" + id, st.narrator); flushAudio(); } }),

    // Reading mode: only these float over the text, and fade when the pointer is still.
    h("div", { class: "readctl", id: "readctl" },

      h("button", { title: "Leave reading mode (Esc)", onclick: () => setReading(false) }, "\u2715 Exit reading mode")));

  /* Full-screen reading: header, sidebar and player go away; Esc, the button or leaving full screen ends it. */
  let ctlTimer = null;
  function wakeControls() {
    const c = $("#readctl");
    if (!c || !document.body.classList.contains("reading")) return;
    c.classList.remove("faded");
    clearTimeout(ctlTimer);
    ctlTimer = setTimeout(() => c.classList.add("faded"), 2500);
  }
  /* Phones: chapters and cast slide over the text (wherever you've scrolled to) and close when you pick a chapter. */
  function setSide(open) {
    const a = $("aside");
    if (a) a.classList.toggle("open", open);
    document.body.classList.toggle("sideopen", open);
    const on = open && document.querySelector(".chap.on");
    if (on) on.scrollIntoView({ block: "center" });
  }
  function setReading(on) {
    if (on) setSide(false);
    document.body.classList.toggle("reading", on);
    const el = document.documentElement;
    if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    const cur = document.querySelector(".cur");  // keep the place
    if (cur) setTimeout(() => cur.scrollIntoView({ block: "center" }), 100);
    if (on) wakeControls();
  }
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("reading")) setReading(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector("dialog[open]")) return;
    const reading = document.body.classList.contains("reading");
    if (e.key === "Escape" && document.body.classList.contains("sideopen")) setSide(false);
    else if (e.key === "Escape" && reading) setReading(false);
    else if ((e.key === "f" || e.key === "F") && !e.repeat) setReading(!reading);
  });
  ["pointermove", "pointerdown", "keydown", "wheel"].forEach(ev => document.addEventListener(ev, wakeControls, { passive: true }));
  const playLabel = (playing) => {
    const b = $("#playBtn"); if (b) b.textContent = playing ? "\u25A0 Stop" : "\u25B6 Play";
    const r = $("#readPlay"); if (r) r.textContent = playing ? "\u25A0" : "\u25B6";
  };

  function renderAll() { renderStatus(); renderCast(); renderSelectors(); renderText(); }

  function renderStatus() { $("#status").textContent = statusText(st.script); }

  function renderChapters() {
    const lines = st.script.lines;
    $("#chapters").replaceChildren(...st.book.chapters.map((c, i) => {
      const done = c.quotes.filter(q => lines[q[0]]).length;

        c.title, h("span", { class: "cnt" }, c.quotes.length ? `${done}/${c.quotes.length}` : ""));
    }));

  const TIERS = [["main", "Main"], ["supporting", "Supporting"], ["extra", "Extras"], ["", "Not sorted yet"]];
  const tierOf = (c) => c && TIERS.some(([k]) => k && k === c.role) ? c.role : "";
  const castOpen = { main: true, supporting: true, extra: false, "": true };

  function renderCast() {
    const q = st.castQuery || "";
    const hit = (c) => !q || [c.name, ...(c.aliases || [])].some(n => n.toLowerCase().includes(q));
    const groups = TIERS.map(([key, label]) => {
      const all = st.script.characters.filter(c => tierOf(c) === key);
      const members = all.filter(hit);
      if (!members.length) return null;
      const d = h("details", { class: "tier" }, h("summary", {}, `${label} (${all.length})`), ...members.map(castRow));
      d.open = q ? true : castOpen[key];
      d.addEventListener("toggle", () => { if (!q) castOpen[key] = d.open; });
      return d;
    });
    const list = nonNull(groups);
