<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ElvenReader books</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6; --accent:#3557d6; --card:#fff; --hl:#fff3b0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#e7e7ea; --muted:#9a9aa2; --line:#2c2c31; --accent:#7d9bff; --card:#1d1d21; --hl:#4a4320; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  a { color:var(--accent); text-decoration:none; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* A button while speech or a voice is being made (the play buttons, Generate Voice, Say it, …): a spinning ring
     in place of its icon, and a band of light sweeping across it. */
  #readPlay, button.loading { position:relative; overflow:hidden; }
  .spin { display:inline-block; width:.85em; height:.85em; box-sizing:border-box; vertical-align:-.1em;
    border:2px solid currentColor; border-right-color:transparent; border-radius:50%;
    animation:playspin .7s linear infinite; }
  @keyframes playspin { to { transform:rotate(360deg); } }
  button.loading::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%);
    transform:translateX(-100%); animation:playsweep 1.1s ease-in-out infinite; }
  button.loading:disabled { opacity:1; cursor:progress; }
  /* The ring drawn over the icon it stands for (kept, unseen), so the label doesn't move. */
  .spinslot { position:relative; display:inline-block; } .spinslot .glyph { visibility:hidden; }
  .spinslot .spin { position:absolute; left:50%; top:50%; margin:-.425em 0 0 -.425em; }
  @keyframes playsweep { to { transform:translateX(100%); } }
  @media (prefers-reduced-motion: reduce) {
    button.loading::after { animation:none; transform:none; background:none; }
    .spin { animation-duration:2s; }
    button.loading { animation:playpulse 1.4s ease-in-out infinite; }
  }
  @keyframes playpulse { 50% { opacity:.55; } }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  /* Pushes what follows to the right edge; it takes no room of its own, so it never makes the header wrap. */
  header .grow { flex:1 1 0; min-width:0; }
  header nav.headnav { flex:1 1 0; min-width:0; display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:6px 12px; }
  /* The reading page's header stays one line: the book's title is cut short with ? (in full on hover). */
  header.bookhead { flex-wrap:nowrap; } header.bookhead > * { flex:none; }
  header.bookhead h1 { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.bookhead #status { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.bookhead .grow { flex:1 1 0; min-width:0; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; padding:18px; }
  .grid .serieshead { grid-column:1/-1; font-size:15px; margin:6px 0 -8px; display:flex; gap:8px; align-items:baseline; }
  .grid .serieshead:not(:first-child) { margin-top:14px; }
  .grid .libhead { grid-column:1/-1; margin:0 0 -6px; font-size:19px; display:flex; gap:8px; align-items:baseline; }
  .grid .libnote { grid-column:1/-1; margin:0; }
  .grid .libsec { grid-column:1/-1; border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }
  .grid .libsec > summary { cursor:pointer; font-size:19px; font-weight:700; }
  .grid .libsec > summary .small { font-weight:400; margin-left:8px; }
  .grid .libsec > .grid { padding:14px 0 0; }
  .seriessel { max-width:18em; font-size:12.5px; padding:2px 4px; } dialog .seriessel { max-width:none; width:100%; }
  .selbtn { position:fixed; z-index:30; font-size:12.5px; box-shadow:0 2px 8px #0003; }
  .updatebar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60; background:var(--accent); color:#fff;
    border:0; border-radius:20px; padding:8px 16px; box-shadow:0 4px 16px #0005; max-width:92vw; }
  dialog.prondlg { width:min(520px, 94vw); min-width:0; max-width:94vw; padding:16px 18px; }
  .pron .phead { display:flex; align-items:center; } .pron .phead h3 { margin:0; flex:1; }
  .pron .phead .iconbtn { font-size:18px; padding:4px 8px; }
  .pron .pfields { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .pron label { margin:0; } .pron label input, .pron label select { display:block; margin-top:3px; }
  .pron .pact { display:flex; align-items:center; gap:10px; margin:12px 0 4px; }
  .pron .pmore { margin:6px 0; font-size:13px; } .pron .pmore summary { cursor:pointer; color:var(--muted); }
  .pron .pmore label { margin-top:8px; }
  .pron .pcheck { display:flex !important; align-items:center; gap:6px; } .pron .pcheck input { width:auto; margin:0; }
  .pron .pall { margin-top:10px; text-align:right; }
  .prow { display:flex; align-items:center; gap:8px; padding:7px 2px; border-bottom:1px solid var(--line); }
  .prow .pt { font-weight:600; } .prow .pr { color:var(--muted); }
  .prow .ps { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:0 6px; }
  .sr .plist { margin-top:4px; border-top:1px solid var(--line); }  /* Book settings and the Pronunciations page */
  .prow .ps { max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr.flash { border-color:var(--accent); }
  .prow .grow, .sr h3 .grow { flex:1; }
  .sr.pempty { padding-top:8px; padding-bottom:8px; } .sr.pempty h3 { margin:0; font-weight:500; } .sr.pempty h3 .muted { white-space:nowrap; }
  .pron .grow { flex:1; }
  @media (max-width: 480px) { .pron .pfields { grid-template-columns:1fr; } }
  .selbtn.touch { transform:translateX(-50%); font-size:15px; padding:10px 16px; border-radius:22px; max-width:92vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--accent); color:#fff; border:0;
    box-shadow:0 4px 16px #0005; }
  #gpubanner { position:fixed; inset:auto; top:64px; left:50%; transform:translateX(-50%); margin:0; max-width:min(560px, 92vw);
    background:var(--card); color:var(--fg); border:1px solid var(--accent); border-radius:10px; padding:8px 14px; box-shadow:0 4px 16px #0003;
    font-size:13px; }
  #gpubanner .bar { margin:6px 0 2px; } #gpubanner.ok { border-color:#3cb44b; }
  /* The reading controls, floating at the bottom middle of the text: play/stop, the narrator's voice, full screen. */
  .readctl { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:calc(300px + (100vw - 300px) / 2);
    transform:translateX(-50%); z-index:35; display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:opacity .5s; pointer-events:none; }
  .readctl .rcbtns { display:flex; gap:10px; pointer-events:auto; }
  .readctl .rcbtns button { width:48px; height:48px; padding:0; display:flex; align-items:center; justify-content:center;
    font-size:20px; line-height:1; border-radius:12px; box-shadow:0 2px 12px #0004; }
  .readctl .rcbtns button.primary { font-size:18px; }
  .readctl .rcstatus { pointer-events:auto; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:4px 10px; font-size:13px; box-shadow:0 2px 10px #0003; max-width:min(520px, 90vw); }
  .readctl .rcstatus:empty { display:none; }
  /* Reading mode: just the text and the controls, which fade when the pointer is still. */
  body.reading header, body.reading aside { display:none !important; }
  body.reading .layout { grid-template-columns:1fr; height:100vh; }
  body.reading main { padding:48px 24px 110px; }
  body.reading .readctl { left:50%; }
  body.reading .readctl.faded { opacity:0; } body.reading .readctl.faded * { pointer-events:none; }
  .serieslist { padding:12px 18px; max-width:900px; }
  .serieslist .sr { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .serieslist .sr h3 { margin:0 0 4px; font-size:16px; display:flex; gap:8px; align-items:center; }
  .userlinks { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .ulink { display:flex; gap:6px; align-items:center; }
  .userlinks .ulink input { flex:1; min-width:0; font-family:ui-monospace, monospace; font-size:12px; }
  .userlinks .qr { width:180px; height:180px; background:#fff; border-radius:6px; padding:4px; }
  .userlinks .qr svg { width:100%; height:100%; }
  .serieslist ol { margin:6px 0 0; padding-left:22px; }
  .vollist .volrow { display:flex; gap:12px; padding:3px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .vollist .volrow .vn { flex:0 0 8.5em; color:var(--muted); white-space:nowrap; }
  .vollist .volrow.here .vn { color:var(--fg); font-weight:600; }
  #bs select.seriessel { min-width:min(100%, 26em); max-width:100%; }
  .casttable { width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed; }
  .casttable col.cn { width:30%; } .casttable col.cv { width:48%; } .casttable col.cl { width:9%; } .casttable col.ce { width:13%; }
  .casttable th { text-align:left; font-weight:normal; font-size:12px; color:var(--muted); padding:2px 8px 4px 0; border-bottom:1px solid var(--line); }
  .casttable td { padding:3px 8px 3px 0; vertical-align:middle; overflow:hidden; text-overflow:ellipsis; }
  .casttable td.cn { font-weight:600; white-space:nowrap; }
  .casttable td:last-child { text-align:right; white-space:nowrap; padding-right:0; }
  .casttable .vcell { display:flex; align-items:center; gap:4px; }
  .casttable td.num, .casttable th:nth-child(3) { text-align:right; }
  .casttable .vcell select { flex:1; min-width:0; max-width:17em; width:auto; padding:2px 4px; font-size:13px; }
  .tier { margin-top:12px; } .tier h4, .tier summary { margin:0 0 4px; font-size:14px; font-weight:600; cursor:default; }
  .tier summary { cursor:pointer; }
  @media (max-width: 600px) {
    /* Still fixed columns (a voice dropdown would otherwise push Edit off the card), sized for a phone. */
    .casttable col.cn { width:29%; } .casttable col.cv { width:43%; } .casttable col.cl { width:10%; } .casttable col.ce { width:18%; }
    .casttable td { padding-right:4px; } .casttable .vcell select { max-width:none; }
  }
  .actions { margin-top:14px; border-top:1px solid var(--line); padding-top:6px; }
  .actrow { display:grid; grid-template-columns:minmax(11em,auto) 1fr; gap:4px 12px; align-items:start; padding:6px 0; }
  .actrow button { justify-self:start; }
  @media (max-width: 600px) { .actrow { grid-template-columns:1fr; } }
  .sr .row button.small { margin:0; }
  .qrow { display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; margin-bottom:6px; }
  .qrow.drag { opacity:.4; } .qrow.over { border-top:3px solid var(--accent); }
  .qrow .qhandle { cursor:grab; color:var(--muted); font-size:18px; user-select:none; }
  .qrow .qpos { width:1.6em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .qrow .qcover { width:34px; height:50px; flex:none; background:#8883; border-radius:3px; overflow:hidden; }
  .qrow .qcover img { width:100%; height:100%; object-fit:cover; }
  .qrow .qinfo { min-width:0; flex:1 1 auto; } .qrow .qtitle { font-weight:600; color:inherit; }
  .qrow.now { border-color:var(--accent); }
  .qrow .qbtns { display:flex; gap:10px; flex:none; } .qrow .qbtns .iconbtn { font-size:16px; padding:4px 8px; }
  .book { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; color:inherit; }
  .book .cover { aspect-ratio:2/3; background:#8883; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font-weight:600; }
  .book .cover img { width:100%; height:100%; object-fit:cover; }
  .cover.sheet, .qcover.sheet { color:transparent; background-repeat:no-repeat; }
  .book .info { padding:10px; } .book .title { font-weight:600; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0; } .bar > div { height:100%; background:var(--accent); }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 55px); }
  /* Under the header, whatever its height (it wraps, and was guessed at 55px, which left a strip under the
     sidebar): the page is a column and the layout takes the rest of the window. */
  @media (min-width: 761px) {
    #app:has(> .layout) { display:flex; flex-direction:column; height:100vh; }
    #app:has(> .layout) > header { flex:none; }
    #app:has(> .layout) > .layout { flex:1 1 0; min-height:0; height:auto; }
  }
  aside { border-right:1px solid var(--line); overflow:auto; padding:12px 12px 80px; background:var(--card); }
  aside h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  .chap { display:block; width:100%; text-align:left; border:0; border-radius:4px; padding:3px 6px; background:none; }
  .chap.on { background:var(--accent); color:#fff; } .chap .cnt { float:right; font-size:12px; opacity:.7; }
  .char { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:6px; cursor:pointer; min-height:28px; }
  .char:hover { background:var(--line); } .char.on { box-shadow:inset 0 0 0 1px var(--accent); }
  .char .sw { width:9px; height:9px; border-radius:50%; flex:none; }
  .char .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .char .cnt { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .char .gap { width:22px; flex:none; }
  p.narrated { cursor:pointer; } p.narrated:hover { color:var(--fg); text-decoration:underline dotted; }
  header a.hicon, header button.hicon { display:inline-flex; align-items:center; line-height:1; padding:3px 4px; border-radius:6px; color:var(--fg); }
  header button.hicon { border:0; background:none; font:inherit; cursor:pointer; }
  header a.hicon:hover, header button.hicon:hover { background:var(--line); }
  header .hicon.on { color:var(--accent); }
  header .hicon.off { color:var(--muted); }
  header .hicon .left { font-size:12px; font-weight:600; margin-left:2px; font-variant-numeric:tabular-nums; }
  .iconbtn { border:0; background:none; padding:2px 5px; color:var(--muted); line-height:1; border-radius:5px; flex:none; }
  .iconbtn:hover { color:var(--accent); background:var(--line); }
  .casthead { display:flex; align-items:center; gap:6px; margin:16px 0 6px; } .casthead h3 { margin:0; flex:1; }
  #castSearch { width:100%; margin-bottom:4px; }
  details.tier > summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--muted); margin:10px 0 2px; list-style-position:inside; }
  .menu { position:fixed; z-index:50; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px;
    min-width:250px; max-width:92vw; box-shadow:0 8px 24px #0005; }
  .menu button { display:block; width:100%; text-align:left; border:0; background:none; padding:6px 10px; border-radius:5px; }
  .menu button:hover { background:var(--line); } .menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  .menu .lbl { font-size:12px; color:var(--muted); padding:4px 10px 0; }
  /* The visible screen's height (dvh): on a phone 100vh is the height with the browser's toolbar hidden, which left the
     bottom of the panel under the toolbar, out of reach. */
  dialog.drawer { margin:0 0 0 auto; height:100vh; max-height:100vh; height:100dvh; max-height:100dvh;
    width:min(460px,100vw); max-width:100vw; min-width:0; overflow-y:auto; overscroll-behavior:contain;
    border-radius:0; border:0; border-left:1px solid var(--line); padding:0 0 env(safe-area-inset-bottom); }
  .drawer .dh { position:sticky; top:0; z-index:2; background:var(--card); display:flex; align-items:center; gap:8px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  .drawer .dh h2 { margin:0; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drawer .dh .sw { width:12px; height:12px; border-radius:50%; flex:none; }
  .drawer section { padding:10px 16px 14px; border-bottom:1px solid var(--line); }
  .drawer section h4 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .drawer .rowx { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .drawer .rowx select { width:auto; flex:1; min-width:0; }
  .drawer .rowx .vname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drawer details.profile > summary { cursor:pointer; list-style-position:inside; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:4px 12px; background:var(--card); }
  .seg button + button { border-left:1px solid var(--line); } .seg button.on { background:var(--accent); color:#fff; }
  .seg button:disabled { cursor:default; } .seg button:disabled:not(.on) { opacity:.45; }
  .q.dim { opacity:.35; background:none !important; box-shadow:none !important; }
  main { overflow:auto; padding:20px 40px 120px; }
  main .text { max-width:780px; margin:auto; font-size:17px; line-height:1.75; }
  .text h2 { font-size:22px; } .text h4 { margin:26px 0 6px; color:var(--muted); font-size:13px; }
  .text p { margin:0 0 .9em; } .text p.heading { font-weight:600; font-size:1.1em; }
  .q { border-radius:4px; padding:1px 2px; cursor:pointer; }
  .nar { cursor:pointer; border-radius:4px; }
  .cur { outline:2px solid var(--accent); background:var(--hl); }
  .tag { font-size:12px; border-radius:10px; padding:0 7px; margin:0 3px; white-space:nowrap; vertical-align:1px; cursor:pointer; color:var(--fg); border:1px solid var(--line); }
  .tag i { color:var(--muted); }
  .tag.fix::after { content:" \270E"; }
  /* Dot meters (braille U+2840-28FF): a monospace font with braille, so every meter has the same width. */
  .meter { font-family:"Cascadia Mono", "Cascadia Code", "DejaVu Sans Mono", "Segoe UI Symbol", Consolas, Menlo,
    "Noto Sans Mono", "Noto Sans Symbols 2", monospace; font-style:normal; font-size:15px; line-height:1; margin-left:3px;
    vertical-align:var(--meter-shift, 0px); display:inline-block; width:1ch; text-align:center; }
  .tag.unsure > .meter { color:#e0a030; opacity:1; }
  .tag.unsure { border-style:dashed; border-color:#e0a030 !important; }
  .odds { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .odds button { font-size:12px; padding:2px 8px; }
  .flagbtn { color:#e06c5a; }
  #text p.resumed { background:color-mix(in srgb, var(--accent) 16%, transparent); border-radius:4px; transition:background 1s; }
  #text .q.resumed { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #vdlg h4.vsec, .voiceedit h4.vsec { margin:16px 0 6px; padding-top:12px; border-top:1px solid var(--line); font-size:14px; }
  #vdlg h4.vsec:first-of-type { border-top:0; padding-top:0; margin-top:10px; }
  /* Inside a character's panel: the sections are sub-headings of its Voice section. */
  .drawer .voiceedit h4.vsec { font-size:13px; text-transform:none; letter-spacing:0; color:var(--fg); }
  .voiceedit textarea, .voiceedit input:not([type=number]):not([type=checkbox]) { width:100%; box-sizing:border-box; }
  .voiceedit .line input { width:auto; flex:1; min-width:8em; }
  .pastrow { flex-wrap:nowrap; } .pastrow .pastdesc { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chlines h3 { margin:18px 0 4px; font-size:15px; }
  .lrow { display:flex; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line); }
  .lrow .lt { flex:1; line-height:1.45; }
  .lrow .ld { color:var(--muted); font-size:12px; margin-left:6px; white-space:nowrap; }
  .casttable a.lines { color:inherit; text-decoration:underline dotted; }
  .book .bm { color:var(--accent); margin-top:2px; }
  .mention { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
  figure.pic { margin: 1.2em 0; text-align: center; }
  img.pic { max-width: 100%; max-height: 85vh; cursor: zoom-in; border-radius: 4px; }
  /* A scene break (the EPUB's ornament, or ⁂ where it has none): dark on the page, light on the dark theme. */
  .scenebreak { margin: 1.8em 0; text-align: center; color: var(--muted); letter-spacing: .4em; user-select: none; }
  .scenebreak figure.pic { margin: 0; display: inline-block; }
  img.orn { max-width: 60vw; max-height: 40px; mix-blend-mode: multiply; }

  if (!playing && document.visibilityState === "visible" && Date.now() - lastInteract > 2000 && resumedAt && Date.now() - resumedAt < 3000) {
    location.reload(); return;
  }
  if (updateShown) return;
  updateShown = true;
  document.body.append(h("button", { class: "updatebar", onclick: () => location.reload() }, "ElvenReader was updated \u2014 tap to reload"));
}
let resumedAt = Date.now();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resumedAt = Date.now(); });
const route = location.pathname.replace(/\/+$/, "");
const routeMatch = route.match(/^\/books\/([A-Za-z0-9_-]+)$/);
const settingsMatch = route.match(/^\/books\/([A-Za-z0-9_-]+)\/settings$/);
const linesMatch = route.match(/^\/books\/([A-Za-z0-9_-]+)\/characters\/([^/]+)$/);
function openRoute() {
  if (settingsMatch) bookSettingsView(settingsMatch[1]);
  else if (linesMatch) characterLinesView(linesMatch[1], decodeURIComponent(linesMatch[2]));
  else if (routeMatch && routeMatch[1] === "voices") voicesView();
  else if (routeMatch && routeMatch[1] === "series") seriesView();
  else if (routeMatch && routeMatch[1] === "settings") settingsView();
  else if (routeMatch && routeMatch[1] === "queue") queueView();
  else if (routeMatch && routeMatch[1] === "users") usersView();
  else if (routeMatch && routeMatch[1] === "pronunciations") pronunciationsView();
  else if (routeMatch) bookView(routeMatch[1]); else libraryView();
}

/* ------------------------------------------------------------------ series */

async function seriesNames() {
  if (!SERIES_NAMES) SERIES_NAMES = (await get("/api/series")).series.map(g => g.name);
  return SERIES_NAMES;
}

/* A series chooser: "Detect from title", the series known so far and "New series…". `onPick(name)` gets ""
   for "detect from the title"; returning false puts the old choice back. */
function seriesSelect(names, current, auto, detected, onPick) {
  const AUTO = "__auto__", NEW = "__new__";
  // The detected name is the "Detect from title" entry; it is only listed on its own when set by hand.
  const list = [...new Set([...names, current].filter(n => n && (n !== detected || (!auto && n === current))))]
    .sort((a, b) => a.localeCompare(b));
  const sel = h("select", { class: "seriessel", title: "Books in a series share their cast and voices" },
    h("option", { value: AUTO }, detected ? `Detect from title (${detected})` : "Detect from title"),
    ...list.map(n => h("option", { value: n }, n)),
    h("option", { value: NEW }, "New series\u2026"));
  sel.value = auto ? AUTO : current;
  let last = sel.value;
  sel.onchange = async () => {
    let v = sel.value;
    if (v === NEW) {
      const name = (prompt("Name of the new series") || "").trim();
      if (!name) { sel.value = last; return; }
      if (!list.includes(name)) sel.insertBefore(h("option", { value: name }, name), sel.lastChild);
      sel.value = v = name;
    }
    sel.disabled = true;
    const ok = await onPick(v === AUTO ? "" : v);
    sel.disabled = false;
    if (ok === false) sel.value = last; else { last = sel.value; SERIES_NAMES = null; }
  };
  return sel;
}

/* Volume order inside a series ("Part 2 Volume 3" -> [2, 3]); books without a number go last. */
function byVolume(a, b) {
  const x = a.volume || [], y = b.volume || [];
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if (x[i] === undefined || y[i] === undefined) return x[i] === undefined ? 1 : -1;
    if (x[i] !== y[i]) return x[i] - y[i];
  }
  return (a.title || "").localeCompare(b.title || "");
}

/* A volume's short name from its number: [19] -> "Vol. 19", [2, 3] ("Part 2 Volume 3") -> "Part 2, Vol. 3". */
function volumeLabel(v) {
  const n = v.volume || [];
  return n.length === 1 ? `Vol. ${n[0]}` : n.length === 2 ? `Part ${n[0]}, Vol. ${n[1]}` : v.title;
}

/* Rename a book; resolves to the new title (null if cancelled). The volume order in a series follows the title. */
async function renameBook(id, title) {
  const to = (prompt("Book title. Volumes of a series are ordered by the number after \u201cVol.\u201d, \u201cVolume\u201d, " +
    "\u201cBook\u201d or \u201cPart\u201d, e.g. \u201cSword Art Online, Vol. 19: Moon Cradle\u201d.", title) || "").trim();
  if (!to || to === title) return null;
  try { await api("PATCH", `/api/books/${id}`, { title: to }); } catch (e) { alert(e.message); return null; }
  return to;
}

async function seriesView() {
  $("#app").replaceChildren(
    h("header", {}, libraryLink(), h("h1", {}, "Series"), h("span", { class: "grow" })),
    h("div", { class: "serieslist", id: "slist" }, h("p", { class: "muted" }, "Loading\u2026")));
  async function render() {
    SERIES_NAMES = null;
    const [{ series }, { books }] = await Promise.all([get("/api/series"), ME.owner ? { books: [] } : get("/api/books")]);
    // The admin sees every series; everyone else only the series of the books they added, with just those books.
    const mine = new Set(books.filter(b => b.can_edit).map(b => b.id));
    const shown = ME.owner ? series.filter(g => g.volumes.length || g.cast)
      : series.filter(g => g.volumes.some(v => mine.has(v.id)));
    const el = $("#slist");
    el.replaceChildren(h("p", { class: "small muted" }, "Books in a series share their cast: characters, tiers, profiles and " +
      "voices carry over from one volume to the next. A book's series is detected from its title; change it on the book's page."));
    if (!shown.length) el.append(h("p", { class: "muted" }, "None of your books are in a series yet."));
    for (const g of shown) {
      const vols = ME.owner ? g.volumes : g.volumes.filter(v => mine.has(v.id));
      // A series' pronunciations are for the admin, or for whoever added all its books.
      const allMine = ME.owner || g.volumes.every(v => mine.has(v.id));
      const others = series.filter(o => o.name !== g.name).map(o => o.name);
      const rename = async () => {
        const to = (prompt(`Rename \u201c${g.name}\u201d to`, g.name) || "").trim();
        if (!to || to === g.name) return;
        const into = series.find(o => o.name !== g.name && o.name.toLowerCase() === to.toLowerCase());
        if (into && !confirm(`\u201c${into.name}\u201d already exists. Merge \u201c${g.name}\u201d into it?`)) return;
        await move(to);
      };
      const move = async (to) => {
        try { await api("POST", "/api/series/rename", { from: g.name, to }); } catch (e) { alert(e.message); }
        render();
      };
      const merge = (e) => popMenu(e.currentTarget, [{ label: `Merge \u201c${g.name}\u201d into\u2026` },
        ...others.map(o => ({ text: o, title: "Its books move there; the same characters become one (that series' voices win)",
          run: () => confirm(`Merge \u201c${g.name}\u201d into \u201c${o}\u201d?`) && move(o) }))]);
      el.append(h("div", { class: "sr" },
        h("h3", {}, g.name, h("span", { class: "grow" }),
          ME.owner ? h("button", { class: "small", onclick: rename }, "Rename\u2026") : null,
          allMine ? h("a", { class: "small", href: `/books/pronunciations#series=${encodeURIComponent(g.name)}`,
            title: "How names and words are said in every book of this series" }, "Pronunciations") : null,
          others.length && ME.owner ? h("button", { class: "small", onclick: merge }, "Merge into\u2026") : null),
        h("div", { class: "small muted" }, (ME.owner ? `${vols.length} book${vols.length === 1 ? "" : "s"}`
            : `${vols.length} of your books`) + " \u00b7 " +
          (g.cast ? `cast of ${g.cast} (${g.voiced} with voices)` : "no cast remembered yet")),
        vols.length ? h("ol", {}, ...vols.slice().sort(byVolume).map(v => h("li", {},
          h("a", { href: `/books/${v.id}` }, v.title), v.auto ? null : h("span", { class: "small muted" }, " (set by hand)"),
          v.volume && v.volume.length ? null : h("span", { class: "small muted", title: "No volume number in the title, so it is listed last" }, " (no volume number)"),
          ME.owner || mine.has(v.id) ? h("button", { class: "iconbtn", title: "Rename the book (the title sets its place in the series)",
            onclick: async () => { if (await renameBook(v.id, v.title)) render(); } }, "\u270E") : null))) : null));
    }
  }
  render().catch(e => tokenScreen.shown || $("#slist").replaceChildren(h("p", {}, "Error: " + e.message)));
}

/* A book's settings, on a page of their own: its title, series, the series' pronunciations and cast with their
   voices, and its analysis. The reading page keeps only reading. */
async function bookSettingsView(id) {
  const back = h("a", { href: `/books/${id}` }, "\u2190 Back to the book");
  const titleEl = h("span", { class: "muted small" });
  $("#app").replaceChildren(
    h("header", {}, back, h("h1", {}, "Book settings"), titleEl, h("span", { class: "grow" })),
    h("div", { class: "serieslist", id: "bs" }, h("p", { class: "muted" }, "Loading\u2026")));
  const card = (heading, ...kids) => h("div", { class: "sr" }, h("h3", {}, heading), ...kids);
  const note = (t) => h("div", { class: "small muted" }, t);
  const flash = (el, t) => { el.textContent = t; setTimeout(() => { if (el.textContent === t) el.textContent = ""; }, 4000); };
  const extrasOpen = { book: false, series: false };  // kept across re-renders (switching a voice re-renders the page)
  const charState = {};  // the character panel's folded profile and the series, across openings

  async function render() {
    const [script, info, names, seriesAll, voices, pron] = await Promise.all([
      get(`/api/books/${id}/script`).catch(() => null), get(`/api/books/${id}/series`),
      seriesNames(), get("/api/series"), get("/api/voices?all=1"), get(`/api/pronunciations?book=${encodeURIComponent(id)}`)]);
    const book = { title: info.title };
    document.title = `${book.title} \u2014 settings`;
    titleEl.textContent = book.title;
    if (script && script.can_edit === false) {
      $("#bs").replaceChildren(h("p", {}, "\uD83D\uDD12 This book is read-only for you: you can change only the books you added. ",
        h("a", { href: `/books/${id}` }, "Back to the book")));
      return;
    }
    const group = seriesAll.series.find(g => g.name === info.series) || { characters: {}, volumes: [] };
    const voiceName = (vid) => (voices.voices.find(v => v.id === vid) || {}).name || vid;

    // Title
    const title = h("input", { value: book.title, spellcheck: "false", style: { flex: "1", minWidth: "12em" } });
    const titleMsg = h("span", { class: "small muted" });
    const saveTitle = h("button", { class: "primary", onclick: async () => {
      const to = title.value.trim();
      if (!to || to === book.title) return;
      try { await api("PATCH", `/api/books/${id}`, { title: to }); } catch (e) { alert(e.message); return; }
      SERIES_NAMES = null; await render(); flash($("#bs .titlemsg"), "\u2713 Saved");
    } }, "Save");
    titleMsg.className = "small muted titlemsg";

    // Series
    const pick = seriesSelect(names, info.series, info.auto, info.detected, async (name) => {
      // The series' cast applies at once: its characters' voices, profiles and tiers (voices you picked are kept).
      try { await api("POST", `/api/books/${id}/series`, { series: name, apply: true }); } catch (e) { alert(e.message); return false; }
      await render();
    });

    // Pronunciations of the series (and those just for this book)
    const entries = [...pron.user, ...pron.series, ...pron.book].sort((a, b) => a.term.localeCompare(b.term));
    const editPron = (entry) => pronunciationsDialog({ book: id, entry, onChange: render }).catch(e => alert(e.message));

    // Cast and voices of the series, as the series remembers them
    const ROLE = { main: 0, supporting: 1, extra: 2 };
    const cast = Object.entries(group.characters || {}).map(([key, e]) => ({ key, name: e.name, role: e.role, voice: e.voice,
      books: (e.books || []).length, bookIds: e.books || [] }));
    cast.sort((a, b) => (ROLE[a.role] ?? 3) - (ROLE[b.role] ?? 3) || (b.books - a.books) || a.name.localeCompare(b.name));
    const castMsg = h("span", { class: "small muted" });
    // This book's characters by name: the voice editor needs the character it edits for (a book and a character id),
    // so that changing a voice others use too makes a copy just for this one. Characters only in other volumes are
    // edited in their latest book.
    const bookChar = new Map();
    for (const c of (script ? script.characters : [])) for (const n of [c.name, ...(c.aliases || [])]) bookChar.set(n.toLowerCase(), c.id);
    const editFor = (c) => {
      if (c.target) return c.target;
      const own = bookChar.get(c.name.toLowerCase());
      if (own) return { book: id, character: own };
      const vols = group.volumes.filter(v => (c.bookIds || []).includes(v.id)).sort(byVolume);
      return vols.length && c.key ? { book: vols[vols.length - 1].id, character: c.key } : {};
    };
    const generic = (vid) => (vid || "").startsWith("pool-");
    // A character on a generic voice (or none) switches between the generic voices, in their book(s).
    const switchGeneric = (c) => {
      const t = editFor(c);
      if (!t.character) return null;
      return genericVoiceSelect(voices.voices, c.voice, async (vid) => {
        try { await api("PATCH", `/api/books/${t.book}/characters/${t.character}`, { voice: vid }); } catch (e) { alert(e.message); }
        await render();
      }, c.voice ? null : "no voice yet");
    };
    // A character's panel (the same as on the reading page): tier, aliases, voice, profile. One only in other volumes
    // is edited in their latest book.
    const editButton = (c) => {
      const t = editFor(c);
      if (!t.character) return null;
      const vol = t.book === id ? null : group.volumes.find(v => v.id === t.book);
      return h("button", { class: "small", title: `${c.name}: tier, aliases, voice and profile` +
          (vol ? ` (in ${vol.title}, where they last appear)` : ""),
        onclick: () => openCharacterEditor(t.book, t.character, { state: charState, inBook: vol ? volumeLabel(vol) : "", onChange: render })
          .catch(e => alert(e.message)) }, "Edit\u2026");
    };
    // This book's cast counts their lines here (a link to them); the series' cast, how many of its books they're in.
    const castRows = (list, withLines) => h("table", { class: "casttable" },
      // The same column widths in every table (tiers and both sections), so they line up.
      h("colgroup", {}, ...["cn", "cv", "cl", "ce"].map(k => h("col", { class: k }))),
      h("thead", {}, h("tr", {}, h("th", {}, "Character"), h("th", {}, "Voice"), h("th", {}, withLines ? "Lines" : "Books"), h("th", {}))),
      h("tbody", {}, ...list.map(c => h("tr", {},
        h("td", { class: "cn", title: c.name }, c.name),
        h("td", {}, h("span", { class: "vcell" },
            c.voice ? h("button", { class: "iconbtn", title: `Play ${c.name}'s voice`, onclick: () => playPath(`/api/voices/${c.voice}/audio`) }, "\u25B6")
              : h("span", { class: "iconbtn", style: { visibility: "hidden" } }, "\u25B6"),  // keeps the voices lined up
            c.voice && !generic(c.voice) ? voiceName(c.voice)
              : switchGeneric(c) || (c.voice ? h("span", {}, genericName(voiceName(c.voice)), h("span", { class: "muted" }, " (generic)"))
                : h("span", { class: "muted" }, "no voice yet")))),
        h("td", { class: "muted num" }, !withLines ? String(c.books || 1) : c.target
          ? h("a", { class: "lines", href: `/books/${c.target.book}/characters/${encodeURIComponent(c.target.character)}`,
              title: `All of ${c.name}'s lines` }, String(c.lines))
          : String(c.lines)),
        h("td", {}, editButton(c))))));
    const tierOf = (c) => c.role === "main" ? "main" : c.role === "supporting" ? "supporting" : "extra";
    // A cast as tiers (main, supporting, extras folded); `which` keeps each section's Extras open or shut.
    const tierBlocks = (list, which, withLines) => {
      const tiers = [["main", "Main characters"], ["supporting", "Supporting characters"], ["extra", "Extras"]]
        .map(([t, label]) => [t, label, list.filter(c => tierOf(c) === t)]).filter(([, , l]) => l.length);
      return tiers.map(([t, label, l]) => t === "extra" && tiers.length > 1
        ? h("details", { class: "tier", open: extrasOpen[which] || undefined, ontoggle: (e) => { extrasOpen[which] = e.target.open; } },
            h("summary", {}, `${label} (${l.length})`), castRows(l, withLines))
        : h("div", { class: "tier" }, h("h4", {}, `${label} (${l.length})`), castRows(l, withLines)));
    };
    // The cast actions, each with what it does and what it would change here; those with nothing to do are left out.
    const mine = script ? script.characters : [];
    const seriesByName = new Map();
    for (const [key, e] of Object.entries(group.characters || {}))
      for (const n of [e.name, ...(e.aliases || [])]) seriesByName.set(n.toLowerCase(), { ...e, key });
    const seriesEntry = (c) => [c.name, ...(c.aliases || [])].map(n => seriesByName.get(n.toLowerCase())).find(Boolean);
    // This book's cast: everyone who speaks in it (and its narrators, and characters you added), most lines first.
    const narrating = new Set(((script && script.narration) || []).map(n => n[2]).filter(Boolean));
    const bookCast = mine.filter(c => c.lines > 0 || narrating.has(c.id) || c.user).map(c => {
      const e = seriesEntry(c);
      return { name: c.name, role: c.role, voice: c.voice, lines: c.lines, target: { book: id, character: c.id },
        key: e && e.key, bookIds: e ? e.books || [] : [id], books: e ? (e.books || []).length : 1 };
    }).sort((a, b) => (ROLE[a.role] ?? 3) - (ROLE[b.role] ?? 3) || b.lines - a.lines || a.name.localeCompare(b.name));
    const noVoice = mine.filter(c => !c.voice && c.lines > 0);
    const pooledSupporting = mine.filter(c => c.role === "supporting" && (c.voice || "").startsWith("pool-"));
    const action = (label, text, run, primary) => h("div", { class: "actrow" },
      h("button", { class: "small" + (primary ? " primary" : ""), onclick: async (e) => {
        const b = e.currentTarget; b.disabled = true;
        try { await run(); flash(castMsg, `\u2713 ${label}: started, it runs in the background`); }
        catch (err) { alert(err.message); } finally { b.disabled = false; }
      } }, label),
      h("span", { class: "small muted" }, text));
    const actions = [
      noVoice.length ? action("Create missing voices",
        `${noVoice.length} character${noVoice.length === 1 ? " has" : "s have"} no voice yet (${noVoice.slice(0, 4).map(c => c.name).join(", ")}` +
        `${noVoice.length > 4 ? ", \u2026" : ""}). Main and supporting characters get a voice designed for them, extras a generic voice from the voice pool.`,
        () => api("POST", `/api/books/${id}/cast`, {})) : null,
      pooledSupporting.length ? action("Design voices for supporting characters",
        `${pooledSupporting.length} supporting character${pooledSupporting.length === 1 ? " uses" : "s use"} a generic voice from the voice pool ` +
        `(${pooledSupporting.slice(0, 4).map(c => c.name).join(", ")}${pooledSupporting.length > 4 ? ", \u2026" : ""}). ` +
        "Each gets a voice of their own, designed from their profile.",
        () => api("POST", `/api/books/${id}/cast`, { own_voices_for: ["supporting"] })) : null,
    ].filter(Boolean);

    // Analysis
    const st = script || { status: "none", progress: 0, detail: "" };
    const analyse = (body, question) => async () => {
      if (!confirm(question)) return;
      try { await api("POST", `/api/books/${id}/analyze`, body); } catch (e) { alert(e.message); return; }
      render();
    };

    $("#bs").replaceChildren(...nonNull([
      card("Title",
        h("div", { style: { display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" } }, title, saveTitle, titleMsg),
        note("Volumes of a series are ordered by the number after \u201cVol.\u201d, \u201cVolume\u201d, \u201cBook\u201d or " +
          "\u201cPart\u201d, e.g. \u201cSword Art Online, Vol. 19: Moon Cradle\u201d.")),
      card("Series",
        h("div", {}, pick),
        note("Books in a series share their cast: characters, tiers, profiles and voices carry over from one volume to the next. " +
          "A change applies at once."),
        group.volumes.length > 1 ? h("div", { class: "vollist" },
          h("div", { class: "small muted", style: { margin: "8px 0 4px" } }, `The series\u2019 books in your library (${group.volumes.length}), in volume order:`),
          ...group.volumes.slice().sort(byVolume).map(v => h("div", { class: "volrow" + (v.id === id ? " here" : "") },
            h("span", { class: "vn" }, (v.volume || []).length ? volumeLabel(v) : "\u2014"),
            v.id === id ? h("span", {}, v.title, h("span", { class: "muted small" }, " \u00b7 this book"))
              : h("a", { href: `/books/${v.id}/settings` }, v.title)))) : null),
      card(`Pronunciations${info.series ? ` for ${info.series}` : ""}`,
        entries.length ? h("div", { class: "plist" }, ...entries.map(e => h("div", { class: "prow" },
          h("span", { class: "pt" }, e.term), h("span", { class: "pr" }, e.respelling || e.phonemes),
          e.scope === "book" ? h("span", { class: "ps" }, "this book only")
            : e.scope === "user" ? h("span", { class: "ps" }, e.user === ME.id ? "all my books" : "all the owner's books") : null,
          h("span", { class: "grow" }),
          h("button", { class: "iconbtn", title: "Change", onclick: () => editPron(e) }, "\u270E"))))
          : note("None yet: names are said as the speech model reads them."),
        h("div", { style: { marginTop: "8px", display: "flex", gap: "12px", alignItems: "center" } },
          h("button", { class: "small", onclick: () => editPron() }, "Add\u2026"),
          h("a", { class: "small", href: `/books/pronunciations#book=${id}` }, "All pronunciations \u2192"))),
      card("Cast and voices in this book",
        bookCast.length ? [
          note("Everyone who speaks in this book, how many lines they have, and the voice their lines are read in. \u25B6 plays " +
            "the voice; (generic) is a voice from the voice pool, picked by gender and age, which you can switch to another. " +
            "Edit\u2026 opens the character: their tier, other names, voice (and Edit voice\u2026 to change how it sounds, or to " +
            "make one just for them) and profile."),
          ...tierBlocks(bookCast, "book", true)]
          : note("No cast yet: it is found when the book is analysed."),
        actions.length ? h("div", { class: "actions" }, ...actions) : null,
        castMsg),
      info.series && cast.length ? card(`The series' cast: ${info.series}`,
        note(`Everyone who speaks in the series' ${group.volumes.length} book${group.volumes.length === 1 ? "" : "s"} in your ` +
          "library, how many of its books they're in, and the voice that carries over from one volume to the next. A " +
          "character's panel (Edit\u2026) says where they first appear."),
        ...tierBlocks(cast, "series", false)) : null,
      card("Analysis",
        h("div", {}, statusText(st)),

        h("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap", marginTop: "8px" } },

/* Shared popup menu below `anchor`: items are {text, run, title, on}, "-" or {label}. */
function popMenu(anchor, items) {
  document.querySelectorAll(".menu").forEach(m => m.remove());
  const m = h("div", { class: "menu", role: "menu" }, ...items.map(it => it === "-" ? h("hr")
    : it.label ? h("div", { class: "lbl" }, it.label)
    : h("button", { type: "button", title: it.title || "", onclick: () => { m.remove(); it.run(); } },
        it.on === undefined ? "" : (it.on ? "\u2713 " : "\u2003 "), it.text)));
  (anchor.closest("dialog") || document.body).append(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, mh = m.offsetHeight;
  // Below the button, or above it when it sits low (the reading controls).
  m.style.top = (r.bottom + 4 + mh > innerHeight - 8 ? Math.max(8, r.top - 4 - mh) : r.bottom + 4) + "px";
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  const off = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", off, true); } };
  setTimeout(() => document.addEventListener("mousedown", off, true));
}

/* Copy text to the clipboard. The Clipboard API exists only on HTTPS or the PC itself, and phones open the site
   over plain http:// on the network, so there the text is copied from `field` (or a hidden one) with the older
   copy command. If even that is refused, the text is left selected for the device's own Copy. */
async function copyText(text, field) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) { /* fall back below */ }
  }
  const el = field || document.body.appendChild(h("textarea", { readonly: true,
    style: { position: "fixed", top: "0", left: "0", opacity: "0", pointerEvents: "none" } }, text));
  el.focus();
  el.select();
  el.setSelectionRange(0, text.length);  // iOS selects nothing with select() alone
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
  if (!field) el.remove();
  return ok;
}

// against them (resting on its bottom-left corner). Solid spines with two bands cut out, apart by clear gaps, so each

const LIBRARY_ICON = (() => {
  const SHELF = 19.6, GAP = 1.15, TILT = 14;
  const spine = (x, w, h) => {
    const y = SHELF - h, r = 0.7, iw = w - 1.2;
    const body = `M${x + r} ${y}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${h - 2 * r}a${r} ${r} 0 0 1 -${r} ${r}` +
      `h-${w - 2 * r}a${r} ${r} 0 0 1 -${r} -${r}v-${h - 2 * r}a${r} ${r} 0 0 1 ${r} -${r}z`;
    const band = (by) => `M${x + 0.6} ${by}h${iw}v0.85h-${iw}z`;

/* Add a book: upload EPUB files from this device. The server parses the book, analyses who says what, sorts
   the cast and creates voices. Its series (detected from the title) can be set before or right after. */
async function addBook(onDone) {
  const d = $("#dlg");
  d.onclose = null;
  const names = await seriesNames().catch(() => []);
  const files = h("input", { type: "file", accept: ".epub,application/epub+zip", multiple: true });
  let chosen = "";  // "" = detect from the title
  const series = seriesSelect(names, "", true, null, async (name) => { chosen = name; });
  const cast = h("input", { type: "checkbox", checked: true, style: { width: "auto" } });
  const bar = h("div", { style: { width: "0%" } }), status = h("p", { class: "small" });
  const go = h("button", { class: "primary", type: "button" }, "Add");
  const upload = (file) => new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("epub", file); form.append("cast", cast.checked ? "1" : "0");
    if (chosen) form.append("series", chosen);
    const x = new XMLHttpRequest();
    x.open("POST", "/api/library/import"); x.setRequestHeader("Authorization", "Bearer " + TOKEN);
    x.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = Math.round(e.loaded / e.total * 100) + "%"; };
    x.onload = () => {
      let data = {}; try { data = JSON.parse(x.responseText); } catch (_) {}
      x.status === 200 ? resolve(data) : reject(new Error(data.error || "HTTP " + x.status));
    };
    x.onerror = () => reject(new Error("Upload failed"));
    x.send(form);
  });
  go.onclick = async () => {
    if (!files.files.length) { status.textContent = "Choose an EPUB file."; return; }
    go.disabled = true;
    const added = [];
    try {
      for (const f of files.files) {
        status.textContent = `Uploading ${f.name}\u2026`; bar.style.width = "0%";
        added.push(await upload(f));
      }
    } catch (e) { status.textContent = "\u26A0 " + e.message; go.disabled = false; if (!added.length) return; }
    onDone && onDone();
    confirmSeries(added);
  };
  /* After the upload: each book's series, which can still be fixed before its cast is created. */
  async function confirmSeries(added) {
    SERIES_NAMES = null;
    const known = await seriesNames().catch(() => names);
    const rows = added.map(b => {
      const note = h("span", { class: "small muted" });
      return h("div", { style: { margin: "10px 0" } },
        h("div", {}, h("b", {}, b.title)),
        h("div", { style: { display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap", marginTop: "4px" } },
          h("span", { class: "small" }, "Series"),
          seriesSelect(known, b.series, b.series_auto, b.series_detected, async (name) => {
            try {
              const r = (await api("POST", `/api/books/${b.id}/series`, { series: name, apply: true })).data;
              note.textContent = r.applied ? `\u2713 ${r.applied} characters and their voices from the series` : "\u2713 saved";
              onDone && onDone();
            } catch (e) { alert(e.message); return false; }
          }), note));
    });
    const started = added.some(b => BUSY.includes(b.status));
    d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, added.length === 1 ? "Book added" : `${added.length} books added`),
      h("p", { class: "small muted" }, (started ? "The analysis has started. " : "Already analysed. ") +
        "Books in a series share their cast and voices: if a series below is wrong, " +
        "change it now, before the cast is created (later it can be changed on the book\u2019s page)."),
      ...rows,
      h("div", { class: "row" }, h("button", { class: "primary", value: "ok" }, "Done"))));
  }
  d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, "Add a book"),
    h("label", {}, "EPUB file(s) from this device"), files,
    h("label", {}, "Series"), h("div", {}, series),
    h("p", { class: "small muted", style: { marginTop: "4px" } }, "Books in a series share their cast and voices. Usually detected from the title."),
    h("label", { style: { display: "flex", gap: "8px", alignItems: "center" } }, cast, "Create the cast's voices when the analysis is done"),
    h("p", { class: "small muted" }, "The book is parsed on the server, then analysed (who says what, the cast's tiers and profiles), " +
      "which takes about an hour for a long novel; you can read along as lines come in."),
    h("div", { class: "bar" }, bar), status,
    h("div", { class: "row" }, h("button", { value: "cancel" }, "Cancel"), go)));
  d.showModal();
}

      r.addEventListener("dragover", (e) => { if (dragging && dragging !== b.id) { e.preventDefault(); r.classList.add("over"); } });
      r.addEventListener("dragleave", () => r.classList.remove("over"));
      r.addEventListener("drop", (e) => {
        e.preventDefault(); r.classList.remove("over");
        if (!dragging || dragging === b.id) return;
        move(ids.indexOf(dragging), ids.indexOf(b.id));
      });
      return r;
    };
    const cur = q.current;
    el.replaceChildren(...[
      h("h3", {}, "Analysing now"),
      cur ? h("div", { class: "qrow now" }, cover(cur),
        h("div", { class: "qinfo" }, h("a", { href: `/books/${cur.id}`, class: "qtitle" }, cur.title),
          h("div", { class: "bar" }, h("div", { style: { width: Math.round((cur.progress || 0) * 100) + "%" } })),
          h("div", { class: "small muted" }, `${Math.round((cur.progress || 0) * 100)}% \u00b7 ${cur.detail || ""}`)),
        q.queued.length ? h("span", { class: "qbtns" }, toBottom(cur, true)) : null)
        : h("p", { class: "small muted" }, "Nothing."),
      h("h3", {}, `Next up (${q.queued.length})`),
      q.queued.length ? h("div", {}, ...q.queued.map(row)) : h("p", { class: "small muted" }, "Nothing is waiting. Add books from the library."),
      q.queued.length ? h("p", { class: "small muted" }, "\u25B6\uFE0E analyses a book now (the current one keeps its progress and goes next). " +
        "Drag a book, or use \u2912 \u2191 \u2193 \u2913, to change the order. " +
        `Together about ${minutes(q.queued.reduce((a, b) => a + (b.words || 0), 0))} min with the whole GPU; longer while you read, ` +
        "and analysis pauses while you design voices.") : null,
      q.casting.length ? h("h3", {}, `Voices still to create (${q.casting.length})`) : null,
      ...q.casting.map(b => h("div", { class: "qrow" }, cover(b), h("div", { class: "qinfo" },
        h("a", { href: `/books/${b.id}`, class: "qtitle" }, b.title), h("div", { class: "small muted" }, b.detail || ""))))].filter(Boolean));
    refreshSoon();
  }
  function refreshSoon() { clearTimeout(timer); timer = setTimeout(refresh, 5000); }
  async function refresh() {
    if (dragging) return refreshSoon();
    try { render(await get("/api/queue")); } catch (e) { if (!tokenScreen.shown) $("#queue").replaceChildren(h("p", {}, "Error: " + e.message)); }
  }
  refresh();
}

    } }, "Save");
    const modeBox = h("div", { style: { display: s.llm_backend === "remote" ? "none" : "", marginTop: "10px" } },
      h("p", { class: "small muted" }, "On this PC: how it shares the GPU."), mode,
      mode.value === "adaptive" || s.llm_mode === "adaptive" ? h("ul", { class: "small", style: { margin: "8px 0 0", paddingLeft: "18px" } },
        h("li", {}, h("b", {}, "Reading or listening: "), "the reading voice stays loaded; analysis runs next to it, a bit slower."),
        h("li", {}, h("b", {}, "Designing voices: "), "the reading voice and the voice designer are loaded; analysis pauses until ",
          pause, " min after your last design."),
        h("li", {}, h("b", {}, "Idle "), "(nobody has used the site for ", idle, " min): analysis gets the whole GPU and new books\u2019 voices are created; " +
          "the reading voice comes back when you do (a banner shows its progress)."),
        h("li", {}, h("b", {}, "Two or more people listening "), "to speech that has to be made: analysis stops and the speech " +
          "models get the whole GPU, until there\u2019s been one listener for 3 minutes.")) : null,
      h("p", { class: "small" }, nowText));
    el.replaceChildren(...nonNull([
      h("div", { class: "sr" }, h("h3", {}, "Speech model"),
        h("p", { class: "small muted" }, "The one model the whole site reads with: books, previews and voice tests. " +
          "Only an idle site unloads it, for book analysis; it comes back when you do."), speech, h("p", { class: "small" }, state),
        h("h4", { style: { margin: "14px 0 4px" } }, "Narration"),
        h("p", { class: "small muted" }, "A second model, loaded next to the speech model, can read the narration (the narrator\u2019s, or a " +

          "for both; book analysis next to them gets less."), narration,
        narrationState ? h("p", { class: "small" }, narrationState) : null),
      tunes.length ? h("div", { class: "sr" }, h("h3", {}, "Speech defaults"),

        ...tunes.map(x => x.el)) : null,
      h("div", { class: "sr" }, h("h3", {}, "Narrator voice"),
        h("p", { class: "small muted" }, "Reads the narration of every book, unless a book's player picks another."), voice),
      h("div", { class: "sr" }, h("h3", {}, "Voice design"),
