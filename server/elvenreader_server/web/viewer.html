/* ------------------------------------------------------------------ pronunciations */

/* Fix how one word or name is said, for a series (every book of it), one book or all of your books. Each fix is a
   respelling ("MY-nuh") applied before synthesis, so it works with any speech model; listen before saving. All the
   fixes are on the Pronunciations page (/books/pronunciations).
   opts: {book?, series?, term?, entry? (a fix to change), scope? ("user": all my books), sample?, voice?, onChange?} */
async function pronunciationsDialog(opts = {}) {
  const d = $("#dlg");
  d.onclose = null;
  d.classList.add("prondlg");
  d.addEventListener("close", () => d.classList.remove("prondlg"), { once: true });
  const book = opts.book || (opts.entry && opts.entry.book);
  const q = book ? `book=${encodeURIComponent(book)}`
    : `series=${encodeURIComponent((opts.entry ? opts.entry.series : opts.series) || "")}`;
  const list = await get(`/api/pronunciations?${q}`);
  const series = list.series_name || (opts.entry && opts.entry.series) || opts.series || "";
  const term = h("input", { placeholder: "e.g. Myne", value: opts.term || "", autocomplete: "off" });
  const resp = h("input", { placeholder: "e.g. MY-nuh", autocomplete: "off" });
  const phon = h("input", { placeholder: "M AY1 N AH0", autocomplete: "off" });
  const cased = h("input", { type: "checkbox" });
  // "All my books": every book in your library, so only offered where it applies (your book, or no book).
  const SCOPES = { series: series ? `Every book of ${series}` : "", book: book ? "Only this book" : "",
    user: (list.users || []).includes(ME.id) ? "All my books" : "" };
  const scope = h("select", {}, ...Object.entries(SCOPES).filter(([, t]) => t).map(([v, t]) => h("option", { value: v }, t)));
  const note = h("span", { class: "small muted" });
  let editing = null;  // the fix being changed
  const sampleFor = (t) => {
    // Just the word with a couple of words either side from where it came (a lone word can come out clipped);
    // the whole sentence took as long to make as the sentence itself.
    const text = (opts.sample || "").replace(/\s+/g, " ");
    const at = t ? text.toLowerCase().indexOf(t.toLowerCase()) : -1;
    if (at < 0) return t;
    const before = (text.slice(0, at).match(/(?:\S+ ){0,2}$/) || [""])[0];
    const after = (text.slice(at + t.length).match(/^\S*(?: \S+){0,2}/) || [""])[0];
    return (before + text.slice(at, at + t.length) + after).replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "") || t;
  };
  async function say(btn, text, extra) {
    const body = { text, format: TTS_FORMAT || undefined };
    if (book) body.book = book;
    if (opts.voice) body.voice = opts.voice;
    if (extra) body.extra_pronunciations = extra;
    try { playUrl(speechUrl(await whileMaking(btn, () => api("POST", "/api/tts", body)))); } catch (e) { alert(e.message); }
  }
  const fix = () => ({ term: term.value.trim(), respelling: resp.value.trim(), phonemes: phon.value.trim(), case_sensitive: cased.checked });
  const hasFix = () => term.value.trim() && (resp.value.trim() || phon.value.trim());
  const listen = (e) => term.value.trim() && say(e.currentTarget, sampleFor(term.value.trim()), hasFix() ? [fix()] : undefined);
  const done = () => { d.close(); opts.onChange && opts.onChange(); };
  const save = h("button", { class: "primary", type: "button", onclick: async () => {
    if (!hasFix()) { note.textContent = "Type the word and how it sounds."; return; }
    try {
      if (editing && editing.scope === scope.value) {
        await api("PATCH", `/api/pronunciations/${editing.id}`, fix());
      } else {
        if (editing) await api("DELETE", `/api/pronunciations/${editing.id}`);
        await api("POST", "/api/pronunciations", { ...fix(), scope: scope.value, book, series: series || undefined });
      }
      done();
    } catch (e) { alert(e.message); }
  } }, "Save");
  const del = h("button", { type: "button", style: { display: "none" }, title: "Remove this fix", onclick: async () => {
    if (!editing || !confirm(`Delete the pronunciation of \u201c${editing.term}\u201d?`)) return;
    try { await api("DELETE", `/api/pronunciations/${editing.id}`); done(); } catch (e) { alert(e.message); }
  } }, "Delete");
  function edit(e) {
    editing = e; term.value = e.term; resp.value = e.respelling; phon.value = e.phonemes || ""; cased.checked = e.case_sensitive;
    // Someone else's user-wide fix (the admin, on their book) keeps its place.
    if (![...scope.options].some(o => o.value === e.scope)) scope.append(h("option", { value: e.scope }, "All the owner's books"));
    scope.value = e.scope; save.textContent = "Save changes"; del.style.display = "";
  }
  // A word that already has a fix opens that fix (the one this book uses: its own, its series' or its users').
  const known = [...list.book, ...list.series, ...list.user];
  const fixOf = (w) => w && known.find(e => e.term.toLowerCase() === w.toLowerCase());
  term.addEventListener("change", () => { if (!editing && fixOf(term.value.trim())) edit(fixOf(term.value.trim())); });
  const all = "/books/pronunciations" + (book ? `#book=${encodeURIComponent(book)}` : series ? `#series=${encodeURIComponent(series)}` : "");
  d.replaceChildren(h("form", { method: "dialog", class: "pron",
      // Enter in a field saves instead of closing the dialog.
      onsubmit: (e) => { if (!e.submitter || e.submitter.value !== "close") { e.preventDefault(); save.click(); } } },
    h("div", { class: "phead" }, h("h3", {}, "Pronunciation"),
      h("button", { value: "close", class: "iconbtn", title: "Close" }, "\u2715")),
    h("div", { class: "pfields" },
      h("label", {}, "Word", term),
      h("label", {}, "Sounds like", resp)),
    h("div", { class: "small muted" }, "Stressed part in capitals."),
    h("div", { class: "pact" },
      h("button", { type: "button", title: "Hear it (with your fix, if you typed one)", onclick: listen }, "\u25B6\uFE0E Listen"),
      note, h("span", { class: "grow" }), del, save),
    h("details", { class: "pmore" }, h("summary", {}, "More options"),
      h("label", {}, "Applies to", scope),
      h("label", {}, "Phonemes (ARPAbet, optional)", phon),
      h("label", { class: "pcheck" }, cased, "Match case")),
    route === "/books/pronunciations" ? null : h("div", { class: "small pall" }, h("a", { href: all }, "All pronunciations \u2192"))));
  if (!d.open) d.showModal();
  if (opts.entry) edit(opts.entry);
  else if (fixOf(opts.term)) edit(fixOf(opts.term));
  else if (opts.scope && [...scope.options].some(o => o.value === opts.scope)) scope.value = opts.scope;
  if (opts.term || opts.entry) resp.focus(); else term.focus();
}

/* Every pronunciation fix you deal with (/books/pronunciations): yours for all your books, then each series of your
   books with its fixes and those of its single books. The admin's page has everyone's. Opened from a book
   (#book=<id>) or a series (#series=<name>), it shows just that series and the user-wide fixes it is read with
   (the book's owners', or yours), with Show all. */
async function pronunciationsView() {
  const fromBook = new URLSearchParams(location.hash.slice(1)).get("book");
  $("#app").replaceChildren(
    h("header", {}, fromBook ? h("a", { href: `/books/${fromBook}` }, "\u2190 Back to the book") : libraryLink(),
      h("h1", {}, "Pronunciations"), h("span", { class: "grow" }),
      h("input", { id: "psearch", type: "search", placeholder: "Find a word\u2026", oninput: () => paint() })),
    h("div", { class: "serieslist", id: "plist" }, h("p", { class: "muted" }, "Loading\u2026")));
  // The same as the server's series_key: series names match with case and punctuation aside.
  const slug = (n) => (n || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  let data = null;
  const hash = new URLSearchParams(location.hash.slice(1));
  let focus = hash.get("book") || hash.get("series") ? { book: hash.get("book"), series: hash.get("series") } : null;
  async function render() {
    data = await get("/api/pronunciations?all=1");
    paint();
  }
  const listen = async (btn, e) => {
    const body = { text: e.term, format: TTS_FORMAT || undefined, book: e.book || undefined,
      extra_pronunciations: [{ term: e.term, respelling: e.respelling, phonemes: e.phonemes, case_sensitive: e.case_sensitive }] };
    try { playUrl(speechUrl(await whileMaking(btn, () => api("POST", "/api/tts", body)))); } catch (err) { alert(err.message); }
  };
  const open = (o) => pronunciationsDialog({ ...o, onChange: render }).catch(err => alert(err.message));
  const row = (e, tag) => h("div", { class: "prow" },
    h("span", { class: "pt" }, e.term), h("span", { class: "pr" }, e.respelling || e.phonemes),
    tag ? h("span", { class: "ps", title: tag }, tag) : null, h("span", { class: "grow" }),
    h("button", { class: "iconbtn", title: "Listen", onclick: (ev) => listen(ev.currentTarget, e) }, "\u25B6\uFE0E"),
    e.can_edit ? h("button", { class: "iconbtn", title: "Change", onclick: () => open({ entry: e }) }, "\u270E") : null,
    e.can_edit ? h("button", { class: "iconbtn", title: "Delete", onclick: async () => {
      if (!confirm(`Delete the pronunciation of \u201c${e.term}\u201d?`)) return;
      try { await api("DELETE", `/api/pronunciations/${e.id}`); } catch (err) { alert(err.message); }
      render();
    } }, "\u2715") : null);
  // A group without fixes is one line (its name and Add?), so a library of many series stays short.
  const group = (id, title, sub, rows, add) => h("div", { class: "sr" + (rows.length ? "" : " pempty"), id },
    h("h3", {}, title, rows.length ? null : h("span", { class: "small muted" }, "none yet"), h("span", { class: "grow" }),
      add ? h("button", { class: "small", onclick: add }, "Add\u2026") : null),
    sub && rows.length ? h("div", { class: "small muted" }, sub) : null,
    rows.length ? h("div", { class: "plist" }, ...rows) : null);
  function paint() {
    const q = ($("#psearch").value || "").trim().toLowerCase();
    const shown = data.entries.filter(e => !q || e.term.toLowerCase().includes(q) || (e.respelling || "").toLowerCase().includes(q))
      .sort((a, b) => a.term.localeCompare(b.term));
    const used = new Set(), take = (es) => { es.forEach(e => used.add(e.id)); return es; };
    const groups = [];
    // From a book or a series: just its series, and the user-wide fixes it is read with.
    const fb = focus && focus.book && data.books[focus.book];
    const only = focus && slug(focus.series || (fb && fb.series) || "");
    // Yours, for every book of your library (and, for the admin, everyone else's).
    const owners = only ? (fb ? fb.users : [ME.id]) : [...new Set([ME.id, ...shown.filter(e => e.scope === "user").map(e => e.user)])];
    for (const u of owners) {
      const es = take(shown.filter(e => e.scope === "user" && e.user === u));
      if (u !== ME.id && !es.length) continue;
      groups.push(group("pu-" + u, u === ME.id ? "All my books" : `All of ${data.users[u] || "a former user"}'s books`,
        u === ME.id ? "Said this way in every book you added, unless a series or book says otherwise." : null,
        es.map(e => row(e)), u === ME.id ? () => open({ scope: "user" }) : null));
    }
    for (const sr of data.series) {
      const key = slug(sr.name);
      if (only && key !== only) continue;
      const books = Object.keys(data.books).filter(b => slug(data.books[b].series) === key);
      const es = take(shown.filter(e => (e.scope === "series" && slug(e.series) === key) || (e.scope === "book" && books.includes(e.book))));
      if (q && !es.length) continue;
      groups.push(group("ps-" + key, sr.name, null,
        es.map(e => row(e, e.scope === "book" ? `only ${data.books[e.book].title}` : null)),
        sr.can_edit ? () => open({ series: sr.name }) : null));
    }
    // The admin's leftovers: fixes for a series or book no longer in the library.
    const rest = only ? [] : shown.filter(e => !used.has(e.id));
    if (rest.length) groups.push(group("pother", "Other", "For series or books no longer in the library.",
      rest.map(e => row(e, e.scope === "book" ? `book ${e.book}` : e.series || null))));
    const all = h("a", { href: "/books/pronunciations", onclick: (e) => {
      e.preventDefault(); focus = null; history.replaceState(null, "", "/books/pronunciations"); paint();
    } }, "Show all");
    $("#plist").replaceChildren(h("p", { class: "small muted" }, "How names and words are said: each fix is for all your " +
      "books, a series or one book, and the narrower one wins. Select a word while reading to add one there.",
      only ? h("span", {}, " ", fb ? `Showing what ${fb.title} is read with. ` : "Showing one series. ", all) : null), ...groups);
  }
  render().catch(e => tokenScreen.shown || $("#plist").replaceChildren(h("p", {}, "Error: " + e.message)));
}

/* ------------------------------------------------------------------ voices */

const ENGINE_INFO = { list: null, def: "" };
async function installedEngines() {
  if (!ENGINE_INFO.list) {
    const e = await get("/api/engines");
    ENGINE_INFO.list = e.engines.filter(x => x.installed);
    ENGINE_INFO.def = e.default || "";
  }
  return ENGINE_INFO.list;
}
const sharedPlayer = new Audio();
PLAYERS.add(sharedPlayer);
function playUrl(url) { if (url) { sharedPlayer.pause(); sharedPlayer.src = url; sharedPlayer.play().catch(() => {}); } }
async function playPath(path) { playUrl(await authBlobUrl(path)); }
const usedByText = (v, limit = 8) => {
  if (!v.used_by.length) return "nobody";
  const names = v.used_by.map(u => u.default ? u.name : `${u.name} (${[u.role, u.title || u.book].filter(Boolean).join(", ")})`);
  return names.length > limit ? names.slice(0, limit).join(", ") + ` and ${names.length - limit} more` : names.join(", ");
};

async function voicesView() {
  $("#app").replaceChildren(
    h("header", {}, libraryLink(), h("h1", {}, "Voices"), h("span", { class: "grow" }),
      h("input", { id: "vsearch", placeholder: "Filter by name, description or character\u2026", oninput: () => render() })),
    h("div", { id: "vlist", style: { padding: "12px 18px", maxWidth: "1100px" } }, h("p", { class: "muted" }, "Loading\u2026")));
  // The site's voices are the admin's; everyone else edits their characters' voices from their books' cast.
  if (!ME.owner) { $("#vlist").replaceChildren(h("p", {}, "Only the admin manages the site's voices. Your characters' voices " +
    "are in the cast of the books you added.")); $("#vsearch").remove(); return; }
  let voices = [];
  async function load() { voices = (await get("/api/voices?details=1")).voices; render(); }
  function render() {
    const q = ($("#vsearch").value || "").toLowerCase();
    const rows = voices.filter(v => !q || [v.name, v.description, v.instruct, usedByText(v)].join(" ").toLowerCase().includes(q));
    $("#vlist").replaceChildren(h("p", { class: "small muted" },
      `${voices.length} voices. Editing a voice changes it for everyone who uses it, unless you make a copy; the previous version is kept for undo.`),
      h("table", { class: "vt" },
        h("tr", {}, h("th", {}, ""), h("th", {}, "Voice"), h("th", {}, "Used by"), h("th", {}, "")),
        ...rows.map(v => h("tr", {},
          h("td", {}, h("button", { title: "Play the reference clip", onclick: () => playPath(`/api/voices/${v.id}/audio`) }, "\u25B6")),
          h("td", {}, h("div", {}, h("b", {}, v.name), h("span", { class: "muted small" }, ` \u00b7 ${v.source}${v.language ? " \u00b7 " + v.language : ""}`)),
            h("div", { class: "small muted" }, v.description || v.instruct || "")),
          h("td", { class: "small" }, usedByText(v)),
          h("td", {}, h("button", { onclick: () => openVoiceEditor(v.id, { onChange: load }) }, "Edit"))))));
  }
  load().catch(e => tokenScreen.shown || $("#vlist").replaceChildren(h("p", {}, "Error: " + e.message)));
}

/* The voice editor: describe the voice, pick one of three takes. Everything else is under Advanced.
   ctx: { book, character, characterName, onChange(voice) }. */
/* A character on a generic voice from the voice pool can switch to another one ("female young"); one with a voice of
   their own only edits it. `none` adds a "no voice" choice for characters still without one. */
const genericName = (name) => (name || "").replace(/^Pool:\s*/i, "").replace(/^unknown\s+/i, "");
// The voice pool, in the order it is listed: by gender, then elderly, adult (plain, strong, soft, young), teen, child.
const POOL_ORDER = ["elderly", "adult", "adult-strong", "adult-soft", "adult-young", "teen", "teen-strong", "teen-soft", "child"];
const poolRank = (id) => { const m = /^pool-([fm])-(.+)$/.exec(id); return m ? (m[1] === "f" ? 0 : 100) + POOL_ORDER.indexOf(m[2]) : -1; };
function genericVoiceSelect(voices, current, onPick, none) {
  const pool = voices.filter(v => poolRank(v.id) >= 0).sort((a, b) => poolRank(a.id) - poolRank(b.id));
  const sel = h("select", { title: "A generic voice from the voice pool, picked by gender and age: switch to another one",
      onchange: (e) => onPick(e.target.value || null) },
    ...(none ? [h("option", { value: "" }, none)] : []),
    ...pool.map(v => h("option", { value: v.id }, genericName(v.name) + " (generic)")));
  sel.value = current || "";
  return sel;
}

/* The voice editor: in its own dialog (the Voices page), or inside a character's panel (`ctx.into`: the element it
   fills, kept by the panel across its re-renders so what you typed and the options you're comparing stay). */
async function openVoiceEditor(voiceId, ctx = {}) {
  const inline = ctx.into || null;
  const d = inline || $("#vdlg");
  let v = await get(`/api/voices/${voiceId}`);
  const engines = await installedEngines().catch(() => []);
  const designers = engines.filter(e => e.voice_design);
  let takes = [];                // generated options to choose from
  let message = "";              // short status line ("Saved.")
  let clip = null;               // advanced: { blob, url, duration } for an uploaded reference
  const ui = {};                 // inputs that survive re-rendering

  // A voice shared with other characters is copied for this one, unless the user says otherwise. The same
  // character in other volumes of the series is this character, not another one: it keeps the voice too.
  const isSelf = (u) => u.book === ctx.book && u.character === ctx.character;
  const sameCharacter = (u) => {
    const me = v.used_by.find(isSelf);
    if (!me || isSelf(u) || u.default || u.series !== me.series) return false;
    const names = new Set([me.name, ...(me.aliases || [])].map(n => n.toLowerCase()));
    return u.character === me.character || [u.name, ...(u.aliases || [])].some(n => names.has(n.toLowerCase()));
  };
  const otherVolumes = () => v.used_by.filter(sameCharacter);
  const others = () => v.used_by.filter(u => !isSelf(u) && !sameCharacter(u));
  const pooled = () => v.id.startsWith("pool-");
  const forThisOnly = () => ctx.character && others().length > 0 && (pooled() || !(ui.everyone && ui.everyone.checked));
  async function target() {
    if (!forThisOnly()) return v.id;
    const copy = (await api("POST", `/api/voices/${v.id}/duplicate`, { book: ctx.book, character: ctx.character })).data;
    v = copy;
    return copy.id;
  }

  const changed = async (fresh, note) => { v = fresh; message = note || ""; render(); if (ctx.onChange) await ctx.onChange(v); loadPast(); };
  // The character's past voices (earlier versions, voices they had before), newest first, at most 3; a voice opened
  // without a character (the Voices page) lists its own earlier versions.
  let past = [];
  async function loadPast() {
    if (!ctx.book || !ctx.character) {
      past = (v.history || []).slice(0, 3).map(x => ({ kind: "version", voice: v.id, stamp: x.stamp, t: x.saved,
        name: x.name, description: x.description }));
    } else {
      try { past = (await get(`/api/books/${ctx.book}/characters/${encodeURIComponent(ctx.character)}/past-voices`)).past || []; }
      catch (e) { past = []; }
    }
    render();
  }
  async function busy(btn, label, fn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = label;
    try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.textContent = old; }
  }
  // Making a voice or speech: the button spins and shimmers like the reading page's play button.
  const making = (btn, fn) => whileMaking(btn, fn).catch(e => alert(e.message));
  function field(key, attrs, value) {
    if (!ui[key]) {
      ui[key] = h(attrs.rows ? "textarea" : "input", attrs);
      ui[key].addEventListener("input", () => { ui[key].dataset.touched = "1"; });
    }
    if (value !== undefined && !ui[key].dataset.touched) ui[key].value = value ?? "";
    return ui[key];
  }
  const untouch = (...keys) => keys.forEach(k => ui[k] && delete ui[k].dataset.touched);

  async function send(method, path, form) {
    const r = await fetch(path, { method, body: form, headers: { Authorization: "Bearer " + TOKEN } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
    return data;
  }

  async function setClip(blob) {
    let duration = 0;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      duration = (await ac.decodeAudioData(await blob.arrayBuffer())).duration;
      ac.close();
    } catch (e) { alert("This browser can't play that file; the server may still read it."); }
    clip = { blob, url: URL.createObjectURL(blob), duration };
    ui.start = null; ui.end = null; ui.clipText = null;
    render();
  }
  function clipForm(extra) {
    const f = new FormData();
    f.append("audio", clip.blob, "clip");
    if (Number(ui.start.value) > 0) f.append("start", ui.start.value);
    if (ui.end.value && Number(ui.end.value) < clip.duration) f.append("end", ui.end.value);
    for (const [k, val] of Object.entries(extra)) if (val) f.append(k, val);
    return f;
  }
  function listenToClip() {
    const a = sharedPlayer, s = Number(ui.start.value) || 0, e = Number(ui.end.value) || clip.duration;
    a.pause(); a.src = clip.url;
    a.onloadedmetadata = () => { a.currentTime = s; a.play(); };
    a.ontimeupdate = () => { if (a.currentTime >= e) { a.pause(); a.ontimeupdate = null; } };
  }

  async function makeTakes(btn, age = 0) {
    const description = ui.description.value.trim();
    if (!description) { alert("Describe the voice first."); return; }
    await making(btn, async () => {
      const body = { description, count: 3 };  // every design says the same standard passage
      if (ctx.book) body.book = ctx.book;  // the book it's for (other users may design for their own books' characters)
      if (age) body.age = age;
      const r = (await api("POST", `/api/voices/${v.id}/design`, body)).data;
      takes = r.candidates;
      // The description now says the new age; pressing again goes a step further.
      if (age) { ui.description.value = r.description; ui.description.dataset.touched = "1"; }
      message = !age ? "" : r.age_from ? `${age < 0 ? "Younger" : "Older"}: ${r.age_from} \u2192 ${r.age_to}` +
        (v.seed != null ? ". Option 1 keeps this voice's seed (closest to it)." : ".")
        : `No age in the description, so it asks for a ${age < 0 ? "younger" : "older"}-sounding voice.`;
      render();
      playPath(`/api/voice-candidates/${takes[0].id}/audio`);
    });
  }
  async function keep(btn, take, i) {
    await busy(btn, "Saving\u2026", async () => {
      const id = await target();
      takes = [];
      untouch("description", "name");
      await changed((await api("POST", `/api/voices/${id}/design/${take.id}`)).data, `Saved option ${i + 1}.`);
    });
  }

  // A voice made for a character is named after them (dramatize.name_voices); one of your own (opened from the
  // Voices page) can be renamed.
  function nameRow() {
    if (ctx.character) return null;
    return h("div", { class: "line" }, h("label", { style: { margin: 0 } }, "Name"), field("name", {}, v.name),
      h("button", { onclick: (e) => busy(e.target, "Saving\u2026", async () => {
        const body = { name: ui.name.value };
        untouch("name");
        await changed((await api("PATCH", `/api/voices/${v.id}`, body)).data, "Renamed.");
      }) }, "Rename"));
  }

  // 1. What the voice is: a real recording, or the description it was designed from (and designing a new one).
  function voiceSection() {
    const shared = ctx.character && others().length > 0;
    // A generic pool voice is never changed from here: editing it for a character makes them their own.
    const generic = shared && pooled();
    return [
      h("h4", { class: "vsec" }, "Voice description"),
      field("description", { rows: 3, placeholder: v.recorded
          ? "A recording you uploaded, not a design. To design a voice from words instead, describe it here and generate one below."
          : "e.g. a young girl's high, light voice, but old-fashioned and teasing like a grandmother" },
        v.recorded ? "" : v.instruct || v.description),  // a recording's old design text no longer describes it
      generic ? h("p", { class: "small muted", style: { margin: "4px 0" } },
          `A generic voice from the voice pool: changes make a voice just for ${ctx.characterName || "this character"}.`)
        : shared ? h("label", { class: "small", style: { color: "var(--fg)" } }, ui.everyone = ui.everyone || h("input", { type: "checkbox", style: { width: "auto" } }),
        ` Also change it for ${others().length} other character${others().length > 1 ? "s" : ""} who share this voice`) : null,
      ctx.character && otherVolumes().length ? h("p", { class: "small muted", style: { margin: "4px 0" } },
        `Changes apply to ${ctx.characterName || "this character"} in all ${otherVolumes().length + 1} of the series\u2019 books they\u2019re in.`) : null,
      h("div", { class: "line" },
        h("button", { class: "primary", disabled: !designers.length, onclick: (e) => makeTakes(e.target) },
          "Generate Voice"),
        // Younger / older rewrite the description's age: a recording has none.
        v.recorded ? null : h("button", { disabled: !designers.length, title: "3 options one age group younger (e.g. adult \u2192 young adult)",
          onclick: (e) => makeTakes(e.target, -1) }, "\u2193 Younger"),
        v.recorded ? null : h("button", { disabled: !designers.length, title: "3 options one age group older (e.g. young adult \u2192 adult)",
          onclick: (e) => makeTakes(e.target, 1) }, "\u2191 Older"),
        message ? h("span", { class: "small" }, message) : null),
      takes.length ? h("div", {}, ...takes.map((t, i) => h("div", { class: "line" },
        h("button", { onclick: () => playPath(`/api/voice-candidates/${t.id}/audio`) }, `\u25B6 Option ${i + 1}`),
        h("button", { onclick: (e) => keep(e.target, t, i) }, "Use this")))) : null,
    ];
  }

  // 2. Hear the current voice say anything, with a delivery.
  function testSection() {
    return [
      h("h4", { class: "vsec" }, "Test the current voice"),
      field("testText", {}, "Stop! Don't you dare take another step, or I'll make you regret it."),
      h("div", { class: "line" }, field("testDelivery", { placeholder: "delivery, e.g. shouting", style: { width: "14em" } }),
        h("button", { onclick: (e) => making(e.currentTarget, async () => {
          const body = { text: ui.testText.value.trim(), voice: v.id };
          if (ui.testDelivery.value.trim()) body.delivery = ui.testDelivery.value.trim();
          if (v.language) body.language = v.language;
          if (TTS_FORMAT) body.format = TTS_FORMAT;
          const r = await api("POST", "/api/tts", body);
          playUrl(speechUrl(r));
        }) }, "\u25B6 Say it")),
    ];
  }

  // 3. A real recording as the voice: a file, trimmed, with what is said.
  function uploadSection() {
    const s = [
      h("h4", { class: "vsec" }, "Upload a recording to use as the voice"),
      h("p", { class: "small muted", style: { margin: "0 0 4px" } }, "5\u201320 s of one person speaking clearly. Any audio format."),
      h("input", { type: "file", accept: "audio/*,.wav,.mp3,.m4a,.ogg,.flac,.webm", onchange: (e) => e.target.files[0] && setClip(e.target.files[0]) }),
    ];
    if (clip) {
      ui.start = ui.start || h("input", { type: "number", step: 0.1, min: 0, value: 0 });
      ui.end = ui.end || h("input", { type: "number", step: 0.1, min: 0, value: clip.duration.toFixed(1) });
      ui.clipText = ui.clipText || h("textarea", { rows: 2, placeholder: "What is said (filled in automatically if left empty)" });
      s.push(h("div", { class: "line" }, h("span", { class: "small" }, `${clip.duration.toFixed(1)} s \u2014 keep from`),
          ui.start, h("span", { class: "small" }, "to"), ui.end, h("span", { class: "small" }, "s"),
          h("button", { onclick: listenToClip }, "\u25B6 Listen")),
        ui.clipText,
        h("div", { class: "line" },
          h("button", { onclick: (e) => busy(e.target, "Transcribing\u2026", async () => {
            ui.clipText.value = (await send("POST", "/api/transcribe", clipForm({ language: v.language }))).text;
          }) }, "Fill in what is said"),
          h("button", { class: "primary", onclick: (e) => busy(e.target, "Saving\u2026", async () => {
            const id = await target();
            const fresh = await send("PUT", `/api/voices/${id}/audio`, clipForm({ ref_text: ui.clipText.value.trim(), language: v.language }));
            clip = null;
            await changed(fresh, "Recording saved as the voice.");
          }) }, "Use this recording")));
    }
    return s;
  }

  // 4. The voices the character had before: hear one, and go back to it.
  function pastSection() {
    if (!past.length) return [];
    const when = (t) => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    return [
      h("h4", { class: "vsec" }, "Past voices"),
      ...past.map(p => h("div", { class: "line pastrow" },
        h("button", { class: "iconbtn", title: "Hear it", onclick: () => playPath(p.kind === "version"
          ? `/api/voices/${p.voice}/history/${p.stamp}/audio` : `/api/voices/${p.voice}/audio`) }, "\u25B6"),
        h("span", { class: "small pastdesc", title: p.description || "" }, h("span", { class: "muted" }, when(p.t)),
          ` \u00b7 ${p.kind === "version" ? "an earlier version" : p.name}`, p.description ? h("span", { class: "muted" }, ` \u2014 ${p.description}`) : ""),
        h("button", { class: "small", onclick: (e) => busy(e.currentTarget, "Saving\u2026", async () => {

    localStorage.setItem("sideHidden", hidden ? "1" : "");
