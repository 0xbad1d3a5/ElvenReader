  function castRow(c) {
    return h("div", { class: "char" + (st.filterChar === c.id ? " on" : ""), onclick: () => openCharacter(c.id),
        title: [c.name, ...(c.aliases || [])].join(" / ") + "\nClick for details" },
      h("span", { class: "sw", style: { background: color(c.id) } }),
      h("span", { class: "nm" }, c.name), h("span", { class: "cnt" }, c.lines),
      c.voice ? h("button", { class: "iconbtn", title: "Play voice sample: " + voiceName(c.voice),
        onclick: (e) => { e.stopPropagation(); playSample(c.voice); } }, "\u25B6") : h("span", { class: "gap", title: "No voice yet" }));
  }

  /* Pronunciations for this book's series (or this book); the audio fetched ahead is dropped after a change. */
  function openPronunciations(term, sample, voice) {
    const names = st.script.characters.filter(c => !c.unnamed).sort((a, b) => b.lines - a.lines).map(c => c.name);
    pronunciationsDialog({ book: st.id, term, sample, voice: voice || st.narrator || undefined, names, onChange: flushAudio })
      .catch(e => alert(e.message));
  }

  function bookMenu(anchor) {
    const hi = (value, text) => ({ text, on: st.tierHi === value,
      run: () => { st.tierHi = value; localStorage.setItem("tierHi", value); renderText(); } });
    popMenu(anchor, [
      { text: "Pronunciations\u2026", title: "Fix how names and words are said in this series (or this book)", run: () => openPronunciations() },
      "-",
      { text: "Sort cast into tiers", title: "Ask the LLM to sort the cast into main, supporting and extras (your choices are kept)", run: sortCast },
      { text: "Create missing voices", run: () => castVoices() },
      { text: "Give supporting characters their own voices", title: "Supporting characters who share a pooled voice get a designed voice of their own",
        run: () => castVoices({ own_voices_for: ["supporting"] }) },
      { text: "Re-label lines\u2026", title: "Label every line again (your corrections are kept)", run: relabel },
      "-", { label: "Highlight lines of" },
      hi("", "Everyone"), hi("main", "Main characters only"), hi("main,supporting", "Main + supporting"),
    ]);
  }

  async function sortCast() {
    const busy = $("#castBusy");
    try { await api("POST", `/api/books/${st.id}/roles`, {}); } catch (e) { alert(e.message); return; }
    busy.textContent = "sorting\u2026";
    const poll = async () => {
      st.script = await get(`/api/books/${st.id}/script`);
      if ((st.script.roles_state || {}).running) { setTimeout(poll, 3000); return; }
      busy.textContent = "";
      if ((st.script.roles_state || {}).error) alert("Sorting failed: " + st.script.roles_state.error);
      renderAll();
    };
    poll();
  }
  function renderSelectors() {
    const cf = $("#charFilter");
    cf.replaceChildren(h("option", { value: "" }, "All speakers"), h("option", { value: "__narrator__" }, "Quotes given to the narrator"),
      ...st.script.characters.map(c => h("option", { value: c.id }, `${c.name} (${c.lines})`)));
    cf.value = st.filterChar;
    const nv = $("#narrator");
    nv.replaceChildren(h("option", { value: "" }, "Server default (" + voiceName(st.defaultVoice) + ")"),
      ...st.voices.filter(v => v.source !== "character").map(v => h("option", { value: v.id }, v.name)));
    nv.value = st.narrator;
  }

  function gotoChapter(i) {
    st.chapter = i; st.filterChar = ""; st.search = "";
    $("#charFilter").value = ""; $("#search").value = "";
    history.replaceState(null, "", "#c=" + i);
    renderText(); $("main").scrollTop = 0;
  }

  /* A paragraph as narration and quotation pieces. Quoted terms inside a sentence (line.mention) stay in
     the narration piece, as marks, so the sentence is read in one go. */
  function pieces(ci, pi) {
    const ch = st.book.chapters[ci], text = ch.paragraphs[pi], lines = st.script.lines;
    const qs = ch.quotes.filter(q => q[1] === pi).sort((a, b) => a[2] - b[2]);
    const out = []; let pos = 0, marks = [];
    for (const [qid, , s, e] of qs) {
      const l = lines[qid];
      if (l && l.mention && !l.speaker) { marks.push({ qid, s, e }); continue; }
      if (s > pos) out.push({ kind: "n", text: text.slice(pos, s), start: pos, marks });
      marks = [];
      out.push({ kind: "q", qid, text: text.slice(s, e) });
      pos = e;
    }
    if (pos < text.length) out.push({ kind: "n", text: text.slice(pos), start: pos, marks });
    return out;
  }

  function highlight(t) {
    if (!st.search) return [t];
    const out = [], low = t.toLowerCase(), q = st.search.toLowerCase(); let i = 0, j;
    while ((j = low.indexOf(q, i)) >= 0) { out.push(t.slice(i, j), h("mark", {}, t.slice(j, j + q.length))); i = j + q.length; }
    out.push(t.slice(i)); return out;
  }

  function renderParagraph(ci, pi, units) {
    const lines = st.script.lines, chars = charById();
    const p = h("p", { class: pi === 0 && st.book.chapters[ci].paragraphs[0] === st.book.chapters[ci].title ? "heading" : null });
    const ps = pieces(ci, pi);
    ps.forEach((piece, k) => {
      if (piece.kind === "n") {
        const kids = []; let at = 0;
        for (const m of piece.marks || []) {  // quoted terms: dotted underline, double-click to give to a speaker
          const a = m.s - piece.start, b = m.e - piece.start;
          kids.push(...highlight(piece.text.slice(at, a)));
          const ms = h("span", { class: "mention", title: "Quoted term, read as narration. Double-click to change." },
            ...highlight(piece.text.slice(a, b)));
          ms.addEventListener("dblclick", (e) => { e.stopPropagation(); editLine(m.qid, piece.text.slice(a, b)); });
          kids.push(ms); at = b;
        }
        kids.push(...highlight(piece.text.slice(at)));
        const span = h("span", { class: "nar" }, ...kids);
        if (/[\p{L}\p{N}]/u.test(piece.text)) {
          const idx = units.length;
          const narrator = chars[narratorAt(ci, pi)];
          units.push({ text: piece.text.trim(), voice: narrator ? narrator.voice : null, delivery: null, el: span, ci, pi });
          span.title = "Click to play from here";
          span.addEventListener("click", () => { if (getSelection().isCollapsed) playFrom(idx); });  // not while selecting text
        }
        p.append(span);
        return;
      }
      const line = lines[piece.qid];
      const c = line && line.speaker ? chars[line.speaker] : null;
      const col = line ? color(c ? c.id : null) : "transparent";
      const dim = st.tierHi && line && !st.tierHi.split(",").includes(c ? tierOf(c) : "main");
      const span = h("span", { class: "q" + (dim ? " dim" : ""), title: "Click to play from here",
        style: { background: line ? col + "22" : "transparent", boxShadow: `inset 0 -2px 0 ${col}` } }, ...highlight(piece.text));
      const idx = units.length;
      // Quotations given to the narrator (signs, titles) are read in the narration's voice.
      const nv = line && !c ? chars[narratorAt(ci, pi)] : null;
      units.push({ text: piece.text, voice: c ? c.voice : nv ? nv.voice : null, delivery: line ? line.delivery : null, el: span, ci, pi, qid: piece.qid });
      span.addEventListener("click", () => { if (getSelection().isCollapsed) playFrom(idx); });  // not while selecting text
      p.append(span);
      // One tag per speaker turn: skip it when the next piece continues the same quotation ("Yes," he said, "I will.").
      const between = ps[k + 1], next = ps[k + 2];
      const sameTurn = next && next.kind === "q" && between.text.length < 80 && /[,;:\u2014\u2013-]\s*$/.test(between.text) &&
        JSON.stringify(lines[next.qid] || null) === JSON.stringify(line || null);
      if (!sameTurn) {
        p.append(h("span", { class: "tag" + (line && line.corrected ? " fix" : ""),
          style: line ? { background: col + "40", borderColor: col, boxShadow: `inset 3px 0 0 ${col}` } : { color: "var(--muted)" },
          title: line && line.corrected ? "Corrected by you. Click to change." : "Change speaker or delivery",
          onclick: (e) => { e.stopPropagation(); editLine(piece.qid, piece.text); } },
          line ? (c ? c.name : "narrator") : "not analysed yet", line && line.delivery ? h("i", {}, " \u00b7 " + line.delivery) : null));
      }
    });
    return p;
  }

  function matches(ci, pi) {
    const ch = st.book.chapters[ci];
    if (st.search && !ch.paragraphs[pi].toLowerCase().includes(st.search.toLowerCase())) return false;
    if (st.filterChar) {
      const qs = ch.quotes.filter(q => q[1] === pi);
      if (st.filterChar === "__narrator__") return qs.some(q => st.script.lines[q[0]] && !st.script.lines[q[0]].speaker);
      return qs.some(q => (st.script.lines[q[0]] || {}).speaker === st.filterChar);
    }
    return true;
  }

  /* An illustration from the book (fetched with the token, so it is an object URL); click to open it full size. */
  function picture(path) {
    const img = h("img", { class: "pic", alt: "Illustration" });
    const fig = h("figure", { class: "pic" }, img);
    const cached = st.pictures[path];
    (cached || (st.pictures[path] = authBlobUrl(`/api/books/${id}/picture?path=${encodeURIComponent(path)}`))).then(url => {
      if (!url) { fig.remove(); return; }
      img.onload = () => { if (img.naturalWidth < 64 || img.naturalHeight < 64) fig.remove(); };  // ornaments
      img.src = url;
      img.onclick = () => window.open(url, "_blank");
    });
    return fig;
  }

  function renderText() {
    stopPlayback();
    const text = $("#text"), units = [];
    if (filtering()) {
      let n = 0;
      const out = [h("h2", {}, "Matching paragraphs")];
      st.book.chapters.forEach((ch, ci) => {
        let header = false;
        ch.paragraphs.forEach((_, pi) => {
          if (n >= 600 || !matches(ci, pi)) return;
          if (!header) { out.push(h("h4", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); gotoChapter(ci); } }, ch.title))); header = true; }
          out.push(renderParagraph(ci, pi, units)); n++;
        });
      });
      if (n === 0) out.push(h("p", { class: "muted" }, "Nothing matches."));
      if (n >= 600) out.push(h("p", { class: "muted" }, "Showing the first 600 paragraphs."));
      text.replaceChildren(...out);
    } else {
      const ch = st.book.chapters[st.chapter], chars = charById();
      const marker = (pi) => {
        const here = narratorAt(st.chapter, pi), before = pi === 0 ? Symbol() : narratorAt(st.chapter, pi - 1);
        if (here === before || !(st.script.narration || []).length) return null;
        const c = chars[here];
        return h("p", { class: "small muted" }, c ? h("span", {}, "Narrated by ", h("b", { style: { color: color(c.id) } }, c.name),
          c.voice ? ` (${voiceName(c.voice)})` : " (no voice yet)") : "Narrated in the book's narrator voice");
      };
      const pics = (paths) => (paths || []).map(picture);
      text.replaceChildren(...nonNull([h("h2", {}, ch.title),
        ...ch.paragraphs.flatMap((_, pi) => [marker(pi), ...pics((ch.images || {})[pi]), renderParagraph(st.chapter, pi, units)]),
        ...pics(ch.end_images),
        st.chapter + 1 < st.book.chapters.length
          ? h("p", {}, h("button", { onclick: () => gotoChapter(st.chapter + 1) }, "Next: " + st.book.chapters[st.chapter + 1].title)) : null]));
    }
    st.units = units; st.playing = -1; flushAudio();
    renderChapters();
  }

  /* -------------------------------------------------------------- playback */

  function unitRequest(i) {
    const u = st.units[i], next = st.units[i + 1];
    const req = { text: u.text, book: st.id, sentence_pause_ms: next && next.pi === u.pi && next.ci === u.ci ? 120 : 450 };
    if (st.language) req.language = st.language;
    if (TTS_FORMAT) req.format = TTS_FORMAT;
    if (u.voice || st.narrator) req.voice = u.voice || st.narrator;
    if (u.delivery) req.delivery = u.delivery;
    return req;
  }

  const AHEAD = 10;  // passages synthesized ahead of the one playing
  function fetchUnit(i) {
    if (!st.units[i]) return null;
    if (!st.fetches.has(i)) {
      const ctrl = new AbortController();
      const promise = api("POST", "/api/tts", unitRequest(i), ctrl.signal).then(speechUrl);
      promise.catch(() => {});  // a cancelled look-ahead isn't an error
      st.fetches.set(i, { promise, ctrl });
    }
    return st.fetches.get(i).promise;
  }

  /* Keep only the passages from `from` to `from + AHEAD`: the others are cancelled, and the server stops making
     their audio, so jumping elsewhere doesn't wait behind ten passages nobody will hear. */
  function keepFetches(from) {
    for (const [i, f] of st.fetches) {
      if (i >= from && i <= from + AHEAD) continue;
      f.ctrl.abort();
      f.promise.then(u => URL.revokeObjectURL(u)).catch(() => {});
      st.fetches.delete(i);
    }
  }

  function flushAudio() { keepFetches(Infinity); }

  async function playFrom(i) {
    stopPlayback();
    const session = (st.session = Symbol("play"));
    playLabel(true);
    for (let k = i; k < st.units.length; k++) {
      if (st.session !== session) return;
      const u = st.units[k];
      st.playing = k;
      document.querySelectorAll(".cur").forEach(e => e.classList.remove("cur"));
      u.el.classList.add("cur");
      u.el.scrollIntoView({ block: "center", behavior: "smooth" });
      $("#playStatus").textContent = "Synthesizing on the PC\u2026";
      let url;
      try {
        keepFetches(k);
        const current = fetchUnit(k);
        for (let j = 1; j <= AHEAD; j++) fetchUnit(k + j);  // queued on the PC behind this one
        url = await current;
      } catch (e) {
        if (st.session !== session) return;  // stopped or moved elsewhere meanwhile
        if (e.name === "AbortError") { k--; continue; }  // its audio was dropped (e.g. new narrator): fetch again
        $("#playStatus").textContent = "Error: " + e.message; st.session = null; playLabel(false); return;
      }
      if (st.session !== session) return;
      $("#playStatus").textContent = u.qid ? "Playing a line" : "Playing narration";
      st.audio.src = url;
      await st.audio.play().catch(() => {});
      await new Promise(res => { st.audio.onended = res; st.audio.onpause = res; });
    }
    if (st.session === session) stopPlayback();
  }

  function stopPlayback() {
    st.session = null;
    st.audio.pause();
    playLabel(false);
    const s = $("#playStatus"); if (s) s.textContent = "";
  }

  async function playSample(voiceId) {
    stopPlayback();
    const url = await authBlobUrl(`/api/voices/${voiceId}/audio`);
    if (url) { st.audio.src = url; st.audio.play(); }
  }

  /* -------------------------------------------------------------- editing */

  async function reloadScript() {
    st.script = await get(`/api/books/${st.id}/script`);
    renderAll();
  }

  function dialog(title, body, onSave) {
    const d = $("#dlg");
    d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, title), ...nonNull(body),
      h("div", { class: "row" }, h("button", { value: "cancel" }, "Cancel"), h("button", { class: "primary", value: "ok" }, "Save"))));
    d.onclose = async () => { if (d.returnValue === "ok") { try { await onSave(); } catch (e) { alert(e.message); } } };
    d.showModal();
  }

  function editLine(qid, text) {
    const line = st.script.lines[qid] || {};
    const sel = h("select", {}, h("option", { value: "" }, "Narrator (nobody speaks)"),
      ...st.script.characters.map(c => h("option", { value: c.id }, c.name)), h("option", { value: "__new__" }, "Someone else\u2026"));
    sel.value = line.speaker || "";
    const other = h("input", { placeholder: "New character's name" });
    const del = h("input", { value: line.delivery || "", placeholder: "e.g. shouting, urgent" });
    dialog("Who says this?", [h("p", {}, text), h("label", {}, "Speaker"), sel, h("label", {}, "New character (for \u201csomeone else\u201d)"), other,
      h("label", {}, "Delivery"), del], async () => {
      const speaker = sel.value === "__new__" ? other.value.trim() || null : sel.value || null;
      await api("PATCH", `/api/books/${st.id}/lines/${qid}`, { speaker, delivery: del.value.trim() });
      await reloadScript();
    });
  }

  const PROFILE_FIELDS = [
    ["gender", "Gender", ["", "male", "female", "unknown"]],
    ["apparent_age", "Apparent age (what a listener should hear)", ["", "child", "teen", "young adult", "adult", "middle-aged", "elderly", "unknown"]],
    ["appearance", "Physical appearance (young girl in a kimono, Java sparrow, android girl\u2026)"],
    ["speech_style", "Speech style (how they talk, verbal tics)"],
    ["notes", "Important characteristics (true age or nature, temperament, accent\u2026)"],
  ];

  /* Everything about one character, in a side drawer: tier, voice, profile, lines, and rarer actions under ⋯. */
  function openCharacter(cid) {
    const d = $("#cdlg");
    const patch = async (body) => {
      try { await api("PATCH", `/api/books/${st.id}/characters/${cid}`, body); } catch (e) { alert(e.message); return; }
      await reloadScript(); render();
    };
    const section = (title, ...kids) => h("section", {}, h("h4", {}, title), ...nonNull(kids));
    function render() {
      const c = charById()[cid];
      if (!c) { d.close(); return; }
      const tier = tierOf(c), model = c.profile || {}, mine = c.profile_user || {};
      const seg = h("div", { class: "seg" }, ...[["main", "Main"], ["supporting", "Supporting"], ["extra", "Extra"]].map(([k, label]) =>
        h("button", { type: "button", class: tier === k ? "on" : "", onclick: () => patch({ role: k }) }, label)));
      const why = [c.role_user ? "Your choice." : c.role ? `Automatic (${c.role_source || "rules"})${c.role_note ? ": " + c.role_note : "."}` : "Not sorted yet.",
        c.role_flag ? ` \u26A0 ${c.role_flag}.` : ""].join("");
      const voiceSel = h("select", { title: "Change voice", onchange: (e) => patch({ voice: e.target.value || null }) },
        h("option", { value: "" }, "No voice (narrator's)"),
        ...st.voices.map(v => h("option", { value: v.id }, v.name + (v.source === "character" ? " (character)" : ""))));
      voiceSel.value = c.voice || "";
      const inputs = {};
      const fields = PROFILE_FIELDS.map(([key, label, options]) => {
        const el = options ? h("select", {}, ...options.map(o => h("option", { value: o }, o || "\u2014")))
          : h(key === "notes" ? "textarea" : "input", { rows: key === "notes" ? 3 : undefined, maxlength: key === "notes" ? 300 : 320,
              style: { width: "100%" } });
        el.value = mine[key] ?? model[key] ?? "";
        inputs[key] = el;
        return [h("label", {}, label, mine[key] != null ? h("span", { class: "small", style: { color: "var(--accent)" } }, " \u270E edited") : null), el];
      }).flat();
      // Aliases help attribution (matching names in the text); they live with the overview, not the profile.
      const aliases = h("input", { value: (c.aliases || []).join(", "), title: "Other names the book uses for them",
        onchange: () => patch({ aliases: aliases.value.split(",").map(a => a.trim()).filter(Boolean) }) });
      const saveProfile = async () => patch({ profile: Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value])) });
      const design = h("button", { type: "button", onclick: async () => {
        design.disabled = true; design.textContent = "Designing\u2026 (about 20 s)";
        try {
          await saveProfile();
          await api("POST", `/api/books/${st.id}/characters/${cid}/voice-from-dossier`, {});
          flushAudio(); st.voices = (await get("/api/voices?all=1")).voices; await reloadScript(); render();
        } catch (err) { alert(err.message); design.disabled = false; design.textContent = "Design voice from profile"; }
      } }, "Design voice from profile");
      d.replaceChildren(
        h("div", { class: "dh" }, h("span", { class: "sw", style: { background: color(cid) } }), h("h2", { title: c.name }, c.name),
          h("button", { class: "iconbtn", title: "More", onclick: (e) => popMenu(e.currentTarget, [
            { text: "Rename\u2026", run: () => { const n = prompt("Name", c.name); if (n && n.trim() && n.trim() !== c.name) patch({ name: n.trim() }); } },
            { text: "How the name is said\u2026", title: "Fix the pronunciation of this name for the series", run: () => { d.close(); openPronunciations(c.name, null, c.voice); } },
            { text: "Same person as\u2026 (merge)", run: () => merge(c) },
          ]) }, "\u22EF"),
          h("button", { class: "iconbtn", title: "Close", onclick: () => d.close() }, "\u2715")),
        section("Overview",
          h("div", { class: "small muted" }, `${c.lines} lines`),
          h("label", {}, "Also called (comma separated; used to recognise them in the text)"), aliases,
          h("div", { class: "rowx" }, seg, c.role_user ? h("button", { type: "button", class: "iconbtn small", title: "Let the model decide again",
            onclick: () => patch({ role: null }) }, "use automatic") : null),
          h("div", { class: "small muted" }, why)),
        section("Voice",
          h("div", { class: "rowx" },
            c.voice ? h("button", { class: "iconbtn", title: "Play voice sample", onclick: () => playSample(c.voice) }, "\u25B6") : null,
            voiceSel,
            c.voice ? h("button", { type: "button", onclick: () => openVoiceEditor(c.voice, { book: st.id, character: cid, characterName: c.name,
              onChange: async () => { flushAudio(); st.voices = (await get("/api/voices?all=1")).voices; await reloadScript(); render(); } }) }, "Edit voice\u2026") : null),
          (() => {
            const v = st.voices.find(x => x.id === c.voice);
            const text = v && (v.description || v.instruct);
            return text ? h("div", { class: "small muted" }, text, (c.voice || "").startsWith("pool-") ? " (shared by several minor characters)" : "") : null;
          })()),
        h("section", {}, h("details", { class: "profile", open: st.profileOpen || undefined,
            ontoggle: (e) => { st.profileOpen = e.target.open; } },
          h("summary", {}, h("h4", { style: { display: "inline" } }, "Profile (for voice design)")),
          h("p", { class: "small muted" }, "Used to design this character's voice and for later volumes in the series. Doesn't change who-said-what."),
          ...fields,
          h("div", { class: "rowx" }, h("button", { type: "button", class: "primary", onclick: saveProfile }, "Save profile"), design))),
        section("Lines",
          h("button", { type: "button", onclick: () => {
            st.filterChar = cid; $("#charFilter").value = cid; renderText(); renderCast(); d.close(); setSide(false);
          } }, "Show this character's lines")));
    }
    d.onclick = (e) => { if (e.target === d) d.close(); };  // click outside the drawer
    render();
    if (!d.open) d.showModal();
  }

  function merge(c) {
    const sel = h("select", {}, ...st.script.characters.filter(o => o.id !== c.id).map(o => h("option", { value: o.id }, o.name)));
    dialog(`${c.name} is the same person as\u2026`, [h("p", { class: "small muted" }, "Their lines move over and the name becomes an alias."), sel],
      async () => {
        await api("PATCH", `/api/books/${st.id}/characters/${c.id}`, { merge_into: sel.value });
        $("#cdlg").close(); await reloadScript();
      });
  }
  async function relabel() {
    if (!confirm("Label every line again? Your line corrections, cast and voices are kept. This takes about as long as the first analysis (about an hour for a long novel).")) return;
    try { st.script = (await api("POST", `/api/books/${st.id}/analyze`, { relabel: true })).data; } catch (e) { alert(e.message); return; }
    renderStatus(); follow();
  }

  async function showSeries() {
    const el = $("#seriesInfo");
    if (!el) return;
    const [info, names] = await Promise.all([get(`/api/books/${st.id}/series`), seriesNames()]);
    el.replaceChildren("\uD83D\uDCDA ", seriesSelect(names, info.series, info.auto, info.detected, async (name) => {
      let r;
      try { r = (await api("POST", `/api/books/${st.id}/series`, { series: name })).data; } catch (e) { alert(e.message); return false; }
      if (r.can_apply) offerSeriesCast(r);
    }));
    el.title = "Series: books in a series share their cast and voices";
  }

  /* After the series changed: its cast is applied when the book is analysed; it can also be applied now. */
  function offerSeriesCast(r) {
    const theirs = Object.values(r.data.characters || {}).filter(e => (e.books || []).some(b => b !== st.id));
    const voiced = theirs.filter(e => e.voice).length;
    const d = $("#dlg");
    d.onclose = null;
    d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, `Series: ${r.series}`),
      h("p", {}, `This series already has a cast from its other books: ${theirs.length} characters, ${voiced} with voices ` +
        `(${theirs.slice(0, 6).map(e => e.name).join(", ")}${theirs.length > 6 ? ", \u2026" : ""}).`),
      h("p", { class: "small muted" }, "The series cast is applied when the book is analysed. Apply it now to give this book's " +
        "matching characters the series' voices, profiles and tiers and to add the series' characters to the cast, " +
        "without labelling the lines again. Voices you picked yourself are kept."),
      h("div", { class: "row" }, h("button", { value: "later" }, "Later"), h("button", { class: "primary", value: "apply" }, "Apply series cast now"))));
    d.onclose = async () => {
      d.onclose = null;
      if (d.returnValue !== "apply") return;
      try {
        await api("POST", `/api/books/${st.id}/series`, { apply: true });
        st.voices = (await get("/api/voices?all=1")).voices;
        await reloadScript();
      } catch (e) { alert(e.message); }
    };
    d.showModal();
  }

  async function castVoices(body = {}) {
    if (body instanceof Event) body = {};
    try { await api("POST", `/api/books/${st.id}/cast`, body); } catch (e) { alert(e.message); return; }
    const poll = async () => {
      st.script = await get(`/api/books/${st.id}/script`);
      renderStatus();
      if (st.script.status === "casting") setTimeout(poll, 5000);
      else { st.voices = (await get("/api/voices?all=1")).voices; renderAll(); }
    };
    poll();
  }

  /* Keep following an analysis that is still running. */
  function follow() {
    if (!BUSY.includes(st.script.status)) return;
    setTimeout(async () => {
      const before = Object.keys(st.script.lines).length;
      st.script = await get(`/api/books/${st.id}/script`);
      renderStatus(); renderCast();
      if (Object.keys(st.script.lines).length !== before && !st.session && !$("#dlg").open) renderText();
      if (!BUSY.includes(st.script.status)) { st.voices = (await get("/api/voices?all=1")).voices; renderAll(); }
      follow();
    }, 10000);
  }

  renderAll();
  get("/api/voices?all=1").then(v => { st.voices = v.voices; st.defaultVoice = v.default; renderSelectors(); renderCast(); }).catch(() => {});
  showSeries().catch(() => {});
  follow();

  // Select a word or name in the text to fix how it is said.
  const selBtn = h("button", { class: "selbtn", type: "button", title: "Fix how this is said (for the series)" }, "\uD83D\uDDE3 Pronunciation\u2026");
  selBtn.style.display = "none";
  document.body.append(selBtn);
  const hideSel = () => { selBtn.style.display = "none"; };
  const checkSel = () => {
    const sel = getSelection();
    if (!sel.rangeCount || !$("#text") || !$("#text").contains(sel.anchorNode)) return hideSel();
    const word = sel.toString().replace(/[\u201c\u201d"\u2018.,;:!?()]+/g, " ").replace(/[\u2019']s?\s*$/, "").trim();
    if (!word || word.length > 40 || word.split(/\s+/).length > 4 || !/\p{L}/u.test(word)) return hideSel();
    const r = sel.getRangeAt(0).getBoundingClientRect();
    const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const para = node && node.closest("p");
    selBtn.style.left = Math.max(8, Math.min(r.left, innerWidth - 180)) + "px";
    selBtn.style.top = (r.top > 50 ? r.top - 38 : r.bottom + 8) + "px";
    selBtn.style.display = "";
    selBtn.onclick = () => {
      hideSel();
      const text = para ? [...para.childNodes].filter(n => !(n.classList && n.classList.contains("tag"))).map(n => n.textContent).join("") : "";
      openPronunciations(word, text);
    };
  };
  $("#text").addEventListener("mouseup", () => setTimeout(checkSel));
  let selTimer = null;  // phones select by long-press: no mouseup
  document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(checkSel, 500); });
  document.addEventListener("mousedown", (e) => { if (e.target !== selBtn) hideSel(); });
  $("main").addEventListener("scroll", hideSel);
}
</script>
</body>
</html>
