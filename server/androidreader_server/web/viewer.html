<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AndroidReader books</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6; --accent:#3557d6; --card:#fff; --hl:#fff3b0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#e7e7ea; --muted:#9a9aa2; --line:#2c2c31; --accent:#7d9bff; --card:#1d1d21; --hl:#4a4320; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  a { color:var(--accent); text-decoration:none; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } header .grow { flex:1; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; padding:18px; }
  .book { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; color:inherit; }
  .book .cover { aspect-ratio:2/3; background:#8883; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font-weight:600; }
  .book .cover img { width:100%; height:100%; object-fit:cover; }
  .book .info { padding:10px; } .book .title { font-weight:600; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0; } .bar > div { height:100%; background:var(--accent); }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 55px); }
  aside { border-right:1px solid var(--line); overflow:auto; padding:12px 12px 80px; background:var(--card); }
  aside h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  .chap { display:block; width:100%; text-align:left; border:0; border-radius:4px; padding:3px 6px; background:none; }
  .chap.on { background:var(--accent); color:#fff; } .chap .cnt { float:right; font-size:12px; opacity:.7; }
  .char { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:6px; cursor:pointer; min-height:28px; }
  .char:hover { background:var(--line); } .char.on { box-shadow:inset 0 0 0 1px var(--accent); }
  .char .sw { width:9px; height:9px; border-radius:50%; flex:none; }
  .char .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .char .cnt { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .char .gap { width:22px; flex:none; }
  .iconbtn { border:0; background:none; padding:2px 5px; color:var(--muted); line-height:1; border-radius:5px; flex:none; }
  .iconbtn:hover { color:var(--accent); background:var(--line); }
  .casthead { display:flex; align-items:center; gap:6px; margin:16px 0 6px; } .casthead h3 { margin:0; flex:1; }
  #castSearch { width:100%; margin-bottom:4px; }
  details.tier > summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--muted); margin:10px 0 2px; list-style-position:inside; }
  .menu { position:fixed; z-index:50; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px;
    min-width:250px; max-width:92vw; box-shadow:0 8px 24px #0005; }
  .menu button { display:block; width:100%; text-align:left; border:0; background:none; padding:6px 10px; border-radius:5px; }
  .menu button:hover { background:var(--line); } .menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  .menu .lbl { font-size:12px; color:var(--muted); padding:4px 10px 0; }
  dialog.drawer { margin:0 0 0 auto; height:100vh; max-height:100vh; width:min(460px,100vw); max-width:100vw; min-width:0;
    border-radius:0; border:0; border-left:1px solid var(--line); padding:0; }
  .drawer .dh { position:sticky; top:0; z-index:2; background:var(--card); display:flex; align-items:center; gap:8px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  .drawer .dh h2 { margin:0; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drawer .dh .sw { width:12px; height:12px; border-radius:50%; flex:none; }
  .drawer section { padding:10px 16px 14px; border-bottom:1px solid var(--line); }
  .drawer section h4 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .drawer .rowx { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .drawer .rowx select { width:auto; flex:1; min-width:0; }
  .drawer details.profile > summary { cursor:pointer; list-style-position:inside; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:4px 12px; background:var(--card); }
  .seg button + button { border-left:1px solid var(--line); } .seg button.on { background:var(--accent); color:#fff; }
  .q.dim { opacity:.35; background:none !important; box-shadow:none !important; }
  main { overflow:auto; padding:20px 40px 120px; }
  main .text { max-width:780px; margin:auto; font-size:17px; line-height:1.75; }
  .text h2 { font-size:22px; } .text h4 { margin:26px 0 6px; color:var(--muted); font-size:13px; }
  .text p { margin:0 0 .9em; } .text p.heading { font-weight:600; font-size:1.1em; }
  .q { border-radius:4px; padding:1px 2px; cursor:pointer; }
  .nar { cursor:pointer; border-radius:4px; }
  .cur { outline:2px solid var(--accent); background:var(--hl); }
  .tag { font-size:12px; border-radius:10px; padding:0 7px; margin:0 3px; white-space:nowrap; vertical-align:1px; cursor:pointer; color:var(--fg); border:1px solid var(--line); }
  .tag i { color:var(--muted); }
  .tag.fix::after { content:" \270E"; }
  .mention { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
  figure.pic { margin: 1.2em 0; text-align: center; }
  img.pic { max-width: 100%; max-height: 85vh; cursor: zoom-in; border-radius: 4px; }
  .player { position:fixed; bottom:0; left:300px; right:0; background:var(--card); border-top:1px solid var(--line); padding:8px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); min-width:380px; max-width:560px; }
  dialog label { display:block; margin:8px 0 2px; font-size:13px; color:var(--muted); }
  dialog select, dialog input { width:100%; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  mark { background:var(--hl); color:inherit; }
  dialog.wide { max-width:820px; width:94vw; padding:18px 22px; }
  dialog.wide textarea, dialog.wide input:not([type=file]):not([type=number]) { width:100%; }
  textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .sec { border-top:1px solid var(--line); margin-top:14px; padding-top:6px; }
  .sec h4 { margin:6px 0; }
  .line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .line input[type=number] { width:6.5em; }
  .banner { background:var(--hl); border-radius:8px; padding:8px 12px; margin:8px 0; }
  table.vt { border-collapse:collapse; width:100%; } table.vt td, table.vt th { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  .narrowonly { display:none; }
  @media (max-width: 760px) {
    .narrowonly { display:inline-block; }
    header { gap:8px; padding:8px 10px; } header h1 { font-size:15px; } #status, header .grow { display:none; }
    header #search, header #charFilter { flex:1 1 140px; min-width:0; }
    .layout { grid-template-columns:1fr; height:auto; }
    aside { display:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:16px; }
    aside.open { display:block; }
    main { padding:16px 16px 160px; overflow:visible; min-width:0; } body { overflow-x:hidden; } main .text { font-size:16px; }
    .player { left:0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="vdlg" class="wide"></dialog>
<dialog id="cdlg" class="drawer"></dialog>
<script>
"use strict";
const EMBEDDED_TOKEN = __TOKEN__;  // only filled in for requests from the PC itself
const TOKEN_KEY = "androidreader-token";
const TOKEN = (() => {
  const m = location.hash.match(/(?:^#|&)token=([^&]+)/);
  if (m) {
    const t = decodeURIComponent(m[1]);
    localStorage.setItem(TOKEN_KEY, t);
    history.replaceState(null, "", location.pathname + location.search);  // keep it out of the address bar
    return t;
  }
  return EMBEDDED_TOKEN || localStorage.getItem(TOKEN_KEY) || "";
})();
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const nonNull = (xs) => xs.filter(x => x != null);

function tokenScreen(message) {
  if (tokenScreen.shown) return;
  tokenScreen.shown = true;
  const input = h("input", { type: "password", placeholder: "Token", autocomplete: "off", style: { width: "16em" } });
  const save = (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    location.reload();
  };
  $("#app").replaceChildren(h("form", { onsubmit: save, style: { maxWidth: "32em", margin: "3em auto" } },
    h("h2", {}, "Enter the server token"),
    h("p", {}, message),
    h("div", { style: { display: "flex", gap: "8px" } }, input, h("button", { class: "primary" }, "Open")),
    h("p", { class: "muted small" }, "The token is shown on the server's page on the PC (http://127.0.0.1:3950/). " +
      "Easier: open the viewer link or scan its QR code from that page; this browser then remembers the token.")));
  input.focus();
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, cache: "no-cache", headers: { Authorization: "Bearer " + TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { tokenScreen("The token was not accepted. Enter the current one."); throw new Error("Wrong token"); }
  const ct = r.headers.get("Content-Type") || "";
  const data = ct.includes("json") ? await r.json() : await r.arrayBuffer();
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return { data, headers: r.headers };
}
const get = (p) => api("GET", p).then(r => r.data);

async function authBlobUrl(path) {
  const r = await fetch(path, { cache: "no-cache", headers: { Authorization: "Bearer " + TOKEN } });
  if (r.status === 401) tokenScreen("The token was not accepted. Enter the current one.");
  if (!r.ok) return null;
  return URL.createObjectURL(await r.blob());
}

function wav(pcm, rate) {
  const b = new ArrayBuffer(44), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.byteLength, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.byteLength, true);
  return new Blob([b, pcm], { type: "audio/wav" });
}

// Mid-lightness colours: readable as tints and underlines on both the light and the dark theme.
const PALETTE = ["#e6194b","#3cb44b","#4f7cff","#f58231","#b05ce6","#2bb5d8","#f032e6","#c08a3e","#3fae9f","#a8a820","#9b8cff","#5aa0ff","#a9a9a9","#7fb800","#d6608a","#d98c3a","#2fae6a","#8a5cf6","#e0605a","#c9a500"];
const LANGS = { en:"English", de:"German", fr:"French", es:"Spanish", it:"Italian", pt:"Portuguese", ja:"Japanese", zh:"Chinese", ko:"Korean", ru:"Russian", nl:"Dutch", pl:"Polish" };
const BUSY = ["queued", "running", "casting"];

function statusText(s) {
  return ({ none: "Not analysed", queued: "Waiting to be analysed", running: `Analysing ${Math.round(s.progress * 100)}%`,
    casting: "Creating voices\u2026", done: "Analysed", error: "Error" })[s.status] + (s.detail ? " \u2014 " + s.detail : "");
}

const route = location.pathname.replace(/\/+$/, "");
const routeMatch = route.match(/^\/books\/([A-Za-z0-9_-]+)$/);
if (!TOKEN) tokenScreen("This browser doesn't have the server token yet.");
else if (routeMatch && routeMatch[1] === "voices") voicesView();
else if (routeMatch) bookView(routeMatch[1]); else libraryView();

/* ------------------------------------------------------------------ library */

async function libraryView() {
  $("#app").replaceChildren(
    h("header", {}, h("h1", {}, "AndroidReader \u2014 processed books"), h("span", { class: "grow" }), h("a", { href: "/books/voices" }, "Voices"), EMBEDDED_TOKEN ? h("a", { href: "/" }, "Pairing") : null),
    h("div", { class: "grid", id: "grid" }, h("p", { class: "muted" }, "Loading\u2026")));
  const covers = {};
  async function refresh() {
    const { books } = await get("/api/books");
    const grid = $("#grid");
    grid.replaceChildren(...(books.length ? [] : [h("p", { class: "muted" },
      "No books yet. Process one with scripts\\process_book.py, or turn on dramatized reading for a book in the app.")]));
    for (const b of books) {
      const cover = h("div", { class: "cover" }, b.title);
      if (b.cover) {
        covers[b.id] = covers[b.id] || authBlobUrl(`/api/books/${b.id}/cover`);
        covers[b.id].then(u => u && cover.replaceChildren(h("img", { src: u, alt: "" })));
      }
      grid.append(h("a", { class: "book", href: `/books/${b.id}` }, cover,
        h("div", { class: "info" },
          h("div", { class: "title" }, b.title),
          h("div", { class: "muted small" }, b.author),
          h("div", { class: "small" }, `${(b.words || 0).toLocaleString()} words \u00b7 ${b.quotes} quotations`),
          BUSY.includes(b.status) ? h("div", { class: "bar" }, h("div", { style: { width: (b.status === "casting" ? 100 : b.progress * 100) + "%" } })) : null,
          h("div", { class: "small" }, statusText(b)),
          h("div", { class: "small muted" }, `${b.lines} lines \u00b7 ${b.characters} characters \u00b7 ${b.voiced} voiced`))));
    }
    if (books.some(b => BUSY.includes(b.status))) setTimeout(refresh, 8000);
  }
  refresh().catch(e => tokenScreen.shown || $("#grid").replaceChildren(h("p", {}, "Error: " + e.message)));
}

/* ------------------------------------------------------------------ voices */

const ENGINE_INFO = { list: null, def: "" };
async function installedEngines() {
  if (!ENGINE_INFO.list) {
    const e = await get("/api/engines");
    ENGINE_INFO.list = e.engines.filter(x => x.installed);
    ENGINE_INFO.def = e.default || "";
  }
  return ENGINE_INFO.list;
}
const sharedPlayer = new Audio();
function playUrl(url) { if (url) { sharedPlayer.pause(); sharedPlayer.src = url; sharedPlayer.play().catch(() => {}); } }
async function playPath(path) { playUrl(await authBlobUrl(path)); }
const usedByText = (v, limit = 8) => {
  if (!v.used_by.length) return "nobody";
  const names = v.used_by.map(u => u.default ? u.name : `${u.name} (${[u.role, u.title || u.book].filter(Boolean).join(", ")})`);
  return names.length > limit ? names.slice(0, limit).join(", ") + ` and ${names.length - limit} more` : names.join(", ");
};

async function voicesView() {
  $("#app").replaceChildren(
    h("header", {}, h("a", { href: "/books" }, "\u2190 Books"), h("h1", {}, "Voices"), h("span", { class: "grow" }),
      h("input", { id: "vsearch", placeholder: "Filter by name, description or character\u2026", oninput: () => render() })),
    h("div", { id: "vlist", style: { padding: "12px 18px", maxWidth: "1100px" } }, h("p", { class: "muted" }, "Loading\u2026")));
  let voices = [];
  async function load() { voices = (await get("/api/voices?details=1")).voices; render(); }
  function render() {
    const q = ($("#vsearch").value || "").toLowerCase();
    const rows = voices.filter(v => !q || [v.name, v.description, v.instruct, usedByText(v)].join(" ").toLowerCase().includes(q));
    $("#vlist").replaceChildren(h("p", { class: "small muted" },
      `${voices.length} voices. Editing a voice changes it for everyone who uses it, unless you make a copy; the previous version is kept for undo.`),
      h("table", { class: "vt" },
        h("tr", {}, h("th", {}, ""), h("th", {}, "Voice"), h("th", {}, "Used by"), h("th", {}, "")),
        ...rows.map(v => h("tr", {},
          h("td", {}, h("button", { title: "Play the reference clip", onclick: () => playPath(`/api/voices/${v.id}/audio`) }, "\u25B6")),
          h("td", {}, h("div", {}, h("b", {}, v.name), h("span", { class: "muted small" }, ` \u00b7 ${v.source}${v.language ? " \u00b7 " + v.language : ""}`)),
            h("div", { class: "small muted" }, v.description || v.instruct || "")),
          h("td", { class: "small" }, usedByText(v)),
          h("td", {}, h("button", { onclick: () => openVoiceEditor(v.id, { onChange: load }) }, "Edit"))))));
  }
  load().catch(e => tokenScreen.shown || $("#vlist").replaceChildren(h("p", {}, "Error: " + e.message)));
}

/* The voice editor: describe the voice, pick one of three takes. Everything else is under Advanced.
   ctx: { book, character, characterName, onChange(voice) }. */
async function openVoiceEditor(voiceId, ctx = {}) {
  const d = $("#vdlg");
  let v = await get(`/api/voices/${voiceId}`);
  const engines = await installedEngines().catch(() => []);
  const designers = engines.filter(e => e.voice_design);
  let takes = [];                // generated options to choose from
  let message = "";              // short status line ("Saved.")
  let clip = null;               // advanced: { blob, url, duration } for a recorded or uploaded reference
  let recorder = null;
  const ui = {};                 // inputs that survive re-rendering

  // A voice shared with other characters is copied for this one, unless the user says otherwise.
  const others = () => v.used_by.filter(u => !(u.book === ctx.book && u.character === ctx.character));
  const forThisOnly = () => ctx.character && others().length > 0 && !(ui.everyone && ui.everyone.checked);
  async function target() {
    if (!forThisOnly()) return v.id;
    const copy = (await api("POST", `/api/voices/${v.id}/duplicate`, { book: ctx.book, character: ctx.character })).data;
    v = copy;
    return copy.id;
  }

  const changed = async (fresh, note) => { v = fresh; message = note || ""; render(); if (ctx.onChange) await ctx.onChange(v); };
  async function busy(btn, label, fn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = label;
    try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.textContent = old; }
  }
  function field(key, attrs, value) {
    if (!ui[key]) {
      ui[key] = h(attrs.rows ? "textarea" : "input", attrs);
      ui[key].addEventListener("input", () => { ui[key].dataset.touched = "1"; });
    }
    if (value !== undefined && !ui[key].dataset.touched) ui[key].value = value ?? "";
    return ui[key];
  }
  const untouch = (...keys) => keys.forEach(k => ui[k] && delete ui[k].dataset.touched);
  function engineSelect(key, list, preferred) {
    if (!ui[key]) {
      ui[key] = h("select", {}, ...list.map(e => h("option", { value: e.id }, e.label)));
      if (list.some(e => e.id === preferred)) ui[key].value = preferred;
    }
    return ui[key];
  }

  async function send(method, path, form) {
    const r = await fetch(path, { method, body: form, headers: { Authorization: "Bearer " + TOKEN } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
    return data;
  }

  async function setClip(blob) {
    let duration = 0;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      duration = (await ac.decodeAudioData(await blob.arrayBuffer())).duration;
      ac.close();
    } catch (e) { alert("This browser can't play that file; the server may still read it."); }
    clip = { blob, url: URL.createObjectURL(blob), duration };
    ui.start = null; ui.end = null; ui.clipText = null;
    render();
  }
  function clipForm(extra) {
    const f = new FormData();
    f.append("audio", clip.blob, "clip");
    if (Number(ui.start.value) > 0) f.append("start", ui.start.value);
    if (ui.end.value && Number(ui.end.value) < clip.duration) f.append("end", ui.end.value);
    for (const [k, val] of Object.entries(extra)) if (val) f.append(k, val);
    return f;
  }
  function listenToClip() {
    const a = sharedPlayer, s = Number(ui.start.value) || 0, e = Number(ui.end.value) || clip.duration;
    a.pause(); a.src = clip.url;
    a.onloadedmetadata = () => { a.currentTime = s; a.play(); };
    a.ontimeupdate = () => { if (a.currentTime >= e) { a.pause(); a.ontimeupdate = null; } };
  }
  async function toggleRecording(btn) {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { alert("No microphone access: " + e.message); return; }
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); recorder = null; setClip(new Blob(chunks, { type: chunks[0]?.type || "audio/webm" })); };

    btn.textContent = "\u25A0 Stop recording";
  }

  async function makeTakes(btn) {

    s.push(h("h4", {}, "Use a real recording instead"),

/* ------------------------------------------------------------------ book view */

async function bookView(id) {
  const st = {
    id, book: null, script: null, voices: [], engines: [], chapter: 0, filterChar: "", search: "",

    [st.book, st.script] = await Promise.all([get(`/api/books/${id}`), get(`/api/books/${id}/script`)]);
  } catch (e) {
    if (tokenScreen.shown) return;

  const charById = () => Object.fromEntries(st.script.characters.map(c => [c.id, c]));
  const narratorAt = (ci, pi) => {
    let who = null;
    for (const [c, p, id] of st.script.narration || []) { if (c < ci || (c === ci && p <= pi)) who = id; else break; }
    return who;
  };
  const color = (cid) => {
    const idx = st.script.characters.findIndex(c => c.id === cid);
    return idx < 0 ? "#888888" : PALETTE[idx % PALETTE.length];
  };
  const voiceName = (vid) => (st.voices.find(v => v.id === vid) || {}).name || vid || "default";
  const filtering = () => !!(st.filterChar || st.search);

  app.replaceChildren(
    h("header", {},
      h("a", { href: "/books" }, "\u2190 Books"),
      h("button", { class: "iconbtn narrowonly", title: "Chapters and cast", onclick: () => $("aside").classList.toggle("open") }, "\u2630"),
      h("h1", {}, st.book.title), h("span", { class: "muted small", id: "status" }), h("span", { class: "grow" }),
      h("a", { href: "/books/voices" }, "Voices"),
      h("input", { id: "search", placeholder: "Search text\u2026", onchange: (e) => { st.search = e.target.value.trim(); renderText(); } }),
      h("select", { id: "charFilter", onchange: (e) => { st.filterChar = e.target.value; renderText(); renderCast(); } })),
    h("div", { class: "layout" },
      h("aside", {},
        h("h3", {}, "Chapters"), h("div", { id: "chapters" }),
        h("div", { class: "casthead" }, h("h3", {}, "Cast"), h("span", { class: "small muted", id: "castBusy" }),
          h("button", { class: "iconbtn", title: "Cast actions", onclick: (e) => bookMenu(e.currentTarget) }, "\u22EF")),
        h("input", { id: "castSearch", type: "search", placeholder: "Find a character\u2026",
          oninput: (e) => { st.castQuery = e.target.value.trim().toLowerCase(); renderCast(); } }),
        h("div", { id: "cast" }),
        h("p", { class: "small muted", id: "seriesInfo" })),
      h("main", {}, h("div", { class: "text", id: "text" }))),
    h("div", { class: "player" },
      h("button", { class: "primary", id: "playBtn", onclick: () => st.session ? stopPlayback() : playFrom(Math.max(0, st.playing)) }, "\u25B6 Play"),
      h("span", { class: "small muted" }, "Narrator voice"),
      h("select", { id: "narrator", onchange: (e) => { st.narrator = e.target.value; localStorage.setItem("narrator:" + id, st.narrator); flushAudio(); } }),
      h("span", { class: "small muted" }, "Model"),
      h("select", { id: "engine", onchange: (e) => { st.engine = e.target.value; localStorage.setItem("engine:" + id, st.engine); flushAudio(); } }),
      h("span", { class: "small", id: "playStatus" })));

  function renderAll() { renderStatus(); renderCast(); renderSelectors(); renderText(); }

  function renderStatus() { $("#status").textContent = statusText(st.script); }

  function renderChapters() {
    const lines = st.script.lines;
    $("#chapters").replaceChildren(...st.book.chapters.map((c, i) => {
      const done = c.quotes.filter(q => lines[q[0]]).length;
      return h("button", { class: "chap" + (i === st.chapter && !filtering() ? " on" : ""), onclick: () => gotoChapter(i) },
        c.title, h("span", { class: "cnt" }, c.quotes.length ? `${done}/${c.quotes.length}` : ""));
    }));
  }

  const TIERS = [["main", "Main"], ["supporting", "Supporting"], ["extra", "Extras"], ["", "Not sorted yet"]];
  const tierOf = (c) => c && TIERS.some(([k]) => k && k === c.role) ? c.role : "";
  const castOpen = { main: true, supporting: true, extra: false, "": true };

  function renderCast() {
    const q = st.castQuery || "";
    const hit = (c) => !q || [c.name, ...(c.aliases || [])].some(n => n.toLowerCase().includes(q));
    const groups = TIERS.map(([key, label]) => {
      const all = st.script.characters.filter(c => tierOf(c) === key);
      const members = all.filter(hit);
      if (!members.length) return null;
      const d = h("details", { class: "tier" }, h("summary", {}, `${label} (${all.length})`), ...members.map(castRow));
      d.open = q ? true : castOpen[key];
      d.addEventListener("toggle", () => { if (!q) castOpen[key] = d.open; });
      return d;
    });
    const list = nonNull(groups);
    $("#cast").replaceChildren(...(list.length ? list : [h("p", { class: "small muted" }, q ? "Nobody matches." : "No characters yet.")]));
  }

  function castRow(c) {
    return h("div", { class: "char" + (st.filterChar === c.id ? " on" : ""), onclick: () => openCharacter(c.id),
        title: [c.name, ...(c.aliases || [])].join(" / ") + "\nClick for details" },
      h("span", { class: "sw", style: { background: color(c.id) } }),
      h("span", { class: "nm" }, c.name), h("span", { class: "cnt" }, c.lines),
      c.voice ? h("button", { class: "iconbtn", title: "Play voice sample: " + voiceName(c.voice),
        onclick: (e) => { e.stopPropagation(); playSample(c.voice); } }, "\u25B6") : h("span", { class: "gap", title: "No voice yet" }));
  }

  /* A small pop-up menu below `anchor`: items are {text, run, title, on}, "-" or {label}. */
  function popMenu(anchor, items) {
    document.querySelectorAll(".menu").forEach(m => m.remove());
    const m = h("div", { class: "menu", role: "menu" }, ...items.map(it => it === "-" ? h("hr")
      : it.label ? h("div", { class: "lbl" }, it.label)
      : h("button", { type: "button", title: it.title || "", onclick: () => { m.remove(); it.run(); } },
          it.on === undefined ? "" : (it.on ? "\u2713 " : "\u2003 "), it.text)));
    (anchor.closest("dialog") || document.body).append(m);
    const r = anchor.getBoundingClientRect(), w = m.offsetWidth;
    m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
    m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    const off = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", off, true); } };
    setTimeout(() => document.addEventListener("mousedown", off, true));
  }

  function bookMenu(anchor) {
    const hi = (value, text) => ({ text, on: st.tierHi === value,
      run: () => { st.tierHi = value; localStorage.setItem("tierHi", value); renderText(); } });
    popMenu(anchor, [
      { text: "Sort cast into tiers", title: "Ask the LLM to sort the cast into main, supporting and extras (your choices are kept)", run: sortCast },
      { text: "Create missing voices", run: () => castVoices() },
      { text: "Give supporting characters their own voices", title: "Supporting characters who share a pooled voice get a designed voice of their own",
        run: () => castVoices({ own_voices_for: ["supporting"] }) },
      { text: "Re-label lines\u2026", title: "Label every line again (your corrections are kept)", run: relabel },
      "-", { label: "Highlight lines of" },
      hi("", "Everyone"), hi("main", "Main characters only"), hi("main,supporting", "Main + supporting"),
    ]);
  }

  async function sortCast() {
    const busy = $("#castBusy");
    try { await api("POST", `/api/books/${st.id}/roles`, {}); } catch (e) { alert(e.message); return; }
    busy.textContent = "sorting\u2026";
    const poll = async () => {
      st.script = await get(`/api/books/${st.id}/script`);
      if ((st.script.roles_state || {}).running) { setTimeout(poll, 3000); return; }
      busy.textContent = "";
      if ((st.script.roles_state || {}).error) alert("Sorting failed: " + st.script.roles_state.error);
      renderAll();
    };
    poll();
  }
  function renderSelectors() {
    const cf = $("#charFilter");
    cf.replaceChildren(h("option", { value: "" }, "All speakers"), h("option", { value: "__narrator__" }, "Quotes given to the narrator"),
      ...st.script.characters.map(c => h("option", { value: c.id }, `${c.name} (${c.lines})`)));
    cf.value = st.filterChar;
    const nv = $("#narrator");
    nv.replaceChildren(h("option", { value: "" }, "Server default (" + voiceName(st.defaultVoice) + ")"),
      ...st.voices.filter(v => v.source !== "character").map(v => h("option", { value: v.id }, v.name)));
    nv.value = st.narrator;
    const en = $("#engine");
    en.replaceChildren(h("option", { value: "" }, "Server default (" + (st.defaultEngine || "") + ")"),
      ...st.engines.map(e => h("option", { value: e.id }, e.label)));
    en.value = st.engine;
  }

  function gotoChapter(i) {
    st.chapter = i; st.filterChar = ""; st.search = "";
    $("#charFilter").value = ""; $("#search").value = "";
    history.replaceState(null, "", "#c=" + i);
    renderText(); $("main").scrollTop = 0;
  }

  /* A paragraph as narration and quotation pieces. Quoted terms inside a sentence (line.mention) stay in
     the narration piece, as marks, so the sentence is read in one go. */
  function pieces(ci, pi) {
    const ch = st.book.chapters[ci], text = ch.paragraphs[pi], lines = st.script.lines;
    const qs = ch.quotes.filter(q => q[1] === pi).sort((a, b) => a[2] - b[2]);
    const out = []; let pos = 0, marks = [];
    for (const [qid, , s, e] of qs) {
      const l = lines[qid];
      if (l && l.mention && !l.speaker) { marks.push({ qid, s, e }); continue; }
      if (s > pos) out.push({ kind: "n", text: text.slice(pos, s), start: pos, marks });
      marks = [];
      out.push({ kind: "q", qid, text: text.slice(s, e) });
      pos = e;
    }
    if (pos < text.length) out.push({ kind: "n", text: text.slice(pos), start: pos, marks });
    return out;
  }

  function highlight(t) {
    if (!st.search) return [t];
    const out = [], low = t.toLowerCase(), q = st.search.toLowerCase(); let i = 0, j;
    while ((j = low.indexOf(q, i)) >= 0) { out.push(t.slice(i, j), h("mark", {}, t.slice(j, j + q.length))); i = j + q.length; }
    out.push(t.slice(i)); return out;
  }

  function renderParagraph(ci, pi, units) {
    const lines = st.script.lines, chars = charById();
    const p = h("p", { class: pi === 0 && st.book.chapters[ci].paragraphs[0] === st.book.chapters[ci].title ? "heading" : null });
    const ps = pieces(ci, pi);
    ps.forEach((piece, k) => {
      if (piece.kind === "n") {
        const kids = []; let at = 0;
        for (const m of piece.marks || []) {  // quoted terms: dotted underline, double-click to give to a speaker
          const a = m.s - piece.start, b = m.e - piece.start;
          kids.push(...highlight(piece.text.slice(at, a)));
          const ms = h("span", { class: "mention", title: "Quoted term, read as narration. Double-click to change." },
            ...highlight(piece.text.slice(a, b)));
          ms.addEventListener("dblclick", (e) => { e.stopPropagation(); editLine(m.qid, piece.text.slice(a, b)); });
          kids.push(ms); at = b;
        }
        kids.push(...highlight(piece.text.slice(at)));
        const span = h("span", { class: "nar" }, ...kids);
        if (/[\p{L}\p{N}]/u.test(piece.text)) {
          const idx = units.length;
          const narrator = chars[narratorAt(ci, pi)];
          units.push({ text: piece.text.trim(), voice: narrator ? narrator.voice : null, delivery: null, el: span, ci, pi });
          span.title = "Click to play from here";
          span.addEventListener("click", () => playFrom(idx));
        }
        p.append(span);
        return;
      }
      const line = lines[piece.qid];
      const c = line && line.speaker ? chars[line.speaker] : null;
      const col = line ? color(c ? c.id : null) : "transparent";
      const dim = st.tierHi && line && !st.tierHi.split(",").includes(c ? tierOf(c) : "main");
      const span = h("span", { class: "q" + (dim ? " dim" : ""), title: "Click to play from here",
        style: { background: line ? col + "22" : "transparent", boxShadow: `inset 0 -2px 0 ${col}` } }, ...highlight(piece.text));
      const idx = units.length;
      // Quotations given to the narrator (signs, titles) are read in the narration's voice.
      const nv = line && !c ? chars[narratorAt(ci, pi)] : null;
      units.push({ text: piece.text, voice: c ? c.voice : nv ? nv.voice : null, delivery: line ? line.delivery : null, el: span, ci, pi, qid: piece.qid });
      span.addEventListener("click", () => playFrom(idx));
      p.append(span);
      // One tag per speaker turn: skip it when the next piece continues the same quotation ("Yes," he said, "I will.").
      const between = ps[k + 1], next = ps[k + 2];
      const sameTurn = next && next.kind === "q" && between.text.length < 80 && /[,;:\u2014\u2013-]\s*$/.test(between.text) &&
        JSON.stringify(lines[next.qid] || null) === JSON.stringify(line || null);
      if (!sameTurn) {
        p.append(h("span", { class: "tag" + (line && line.corrected ? " fix" : ""),
          style: line ? { background: col + "40", borderColor: col, boxShadow: `inset 3px 0 0 ${col}` } : { color: "var(--muted)" },
          title: line && line.corrected ? "Corrected by you. Click to change." : "Change speaker or delivery",
          onclick: (e) => { e.stopPropagation(); editLine(piece.qid, piece.text); } },
          line ? (c ? c.name : "narrator") : "not analysed yet", line && line.delivery ? h("i", {}, " \u00b7 " + line.delivery) : null));
      }
    });
    return p;
  }

  function matches(ci, pi) {
    const ch = st.book.chapters[ci];
    if (st.search && !ch.paragraphs[pi].toLowerCase().includes(st.search.toLowerCase())) return false;
    if (st.filterChar) {
      const qs = ch.quotes.filter(q => q[1] === pi);
      if (st.filterChar === "__narrator__") return qs.some(q => st.script.lines[q[0]] && !st.script.lines[q[0]].speaker);
      return qs.some(q => (st.script.lines[q[0]] || {}).speaker === st.filterChar);
    }
    return true;
  }

  /* An illustration from the book (fetched with the token, so it is an object URL); click to open it full size. */
  function picture(path) {
    const img = h("img", { class: "pic", alt: "Illustration" });
    const fig = h("figure", { class: "pic" }, img);
    const cached = st.pictures[path];
    (cached || (st.pictures[path] = authBlobUrl(`/api/books/${id}/picture?path=${encodeURIComponent(path)}`))).then(url => {
      if (!url) { fig.remove(); return; }
      img.onload = () => { if (img.naturalWidth < 64 || img.naturalHeight < 64) fig.remove(); };  // ornaments
      img.src = url;
      img.onclick = () => window.open(url, "_blank");
    });
    return fig;
  }

  function renderText() {
    stopPlayback();
    const text = $("#text"), units = [];
    if (filtering()) {
      let n = 0;
      const out = [h("h2", {}, "Matching paragraphs")];
      st.book.chapters.forEach((ch, ci) => {
        let header = false;
        ch.paragraphs.forEach((_, pi) => {
          if (n >= 600 || !matches(ci, pi)) return;
          if (!header) { out.push(h("h4", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); gotoChapter(ci); } }, ch.title))); header = true; }
          out.push(renderParagraph(ci, pi, units)); n++;
        });
      });
      if (n === 0) out.push(h("p", { class: "muted" }, "Nothing matches."));
      if (n >= 600) out.push(h("p", { class: "muted" }, "Showing the first 600 paragraphs."));
      text.replaceChildren(...out);
    } else {
      const ch = st.book.chapters[st.chapter], chars = charById();
      const marker = (pi) => {
        const here = narratorAt(st.chapter, pi), before = pi === 0 ? Symbol() : narratorAt(st.chapter, pi - 1);
        if (here === before || !(st.script.narration || []).length) return null;
        const c = chars[here];
        return h("p", { class: "small muted" }, c ? h("span", {}, "Narrated by ", h("b", { style: { color: color(c.id) } }, c.name),
          c.voice ? ` (${voiceName(c.voice)})` : " (no voice yet)") : "Narrated in the book's narrator voice");
      };
      const pics = (paths) => (paths || []).map(picture);
      text.replaceChildren(...nonNull([h("h2", {}, ch.title),
        ...ch.paragraphs.flatMap((_, pi) => [marker(pi), ...pics((ch.images || {})[pi]), renderParagraph(st.chapter, pi, units)]),
        ...pics(ch.end_images),
        st.chapter + 1 < st.book.chapters.length
          ? h("p", {}, h("button", { onclick: () => gotoChapter(st.chapter + 1) }, "Next: " + st.book.chapters[st.chapter + 1].title)) : null]));
    }
    st.units = units; st.playing = -1; flushAudio();
    renderChapters();
  }

  /* -------------------------------------------------------------- playback */

  function unitRequest(i) {
    const u = st.units[i], next = st.units[i + 1];
    const req = { text: u.text, book: st.id, sentence_pause_ms: next && next.pi === u.pi && next.ci === u.ci ? 120 : 450 };
    if (st.engine) req.engine = st.engine;
    if (st.language) req.language = st.language;
    if (u.voice || st.narrator) req.voice = u.voice || st.narrator;
    if (u.delivery) req.delivery = u.delivery;
    return req;
  }

  function fetchUnit(i) {
    if (!st.units[i]) return null;
    if (!st.fetches.has(i)) {
      st.fetches.set(i, api("POST", "/api/tts", unitRequest(i))
        .then(r => URL.createObjectURL(wav(r.data, Number(r.headers.get("X-Sample-Rate") || 24000)))));
    }
    return st.fetches.get(i);
  }

  function flushAudio() { st.fetches.clear(); }

  async function playFrom(i) {
    stopPlayback();
    const session = (st.session = Symbol("play"));
    $("#playBtn").textContent = "\u25A0 Stop";
    for (let k = i; k < st.units.length; k++) {
      if (st.session !== session) return;
      const u = st.units[k];
      st.playing = k;
      document.querySelectorAll(".cur").forEach(e => e.classList.remove("cur"));
      u.el.classList.add("cur");
      u.el.scrollIntoView({ block: "center", behavior: "smooth" });
      $("#playStatus").textContent = "Synthesizing on the PC\u2026";
      let url;
      try {
        url = await fetchUnit(k);
        fetchUnit(k + 1); fetchUnit(k + 2);
      } catch (e) {
        $("#playStatus").textContent = "Error: " + e.message; st.session = null; $("#playBtn").textContent = "\u25B6 Play"; return;
      }
      if (st.session !== session) return;
      $("#playStatus").textContent = u.qid ? "Playing a line" : "Playing narration";
      st.audio.src = url;
      await st.audio.play().catch(() => {});
      await new Promise(res => { st.audio.onended = res; st.audio.onpause = res; });
    }
    if (st.session === session) stopPlayback();
  }

  function stopPlayback() {
    st.session = null;
    st.audio.pause();
    const b = $("#playBtn"); if (b) b.textContent = "\u25B6 Play";
    const s = $("#playStatus"); if (s) s.textContent = "";
  }

  async function playSample(voiceId) {
    stopPlayback();
    const url = await authBlobUrl(`/api/voices/${voiceId}/audio`);
    if (url) { st.audio.src = url; st.audio.play(); }
  }

  /* -------------------------------------------------------------- editing */

  async function reloadScript() {
    st.script = await get(`/api/books/${st.id}/script`);
    renderAll();
  }

  function dialog(title, body, onSave) {
    const d = $("#dlg");
    d.replaceChildren(h("form", { method: "dialog" }, h("h3", { style: { marginTop: 0 } }, title), ...nonNull(body),
      h("div", { class: "row" }, h("button", { value: "cancel" }, "Cancel"), h("button", { class: "primary", value: "ok" }, "Save"))));
    d.onclose = async () => { if (d.returnValue === "ok") { try { await onSave(); } catch (e) { alert(e.message); } } };
    d.showModal();
  }

  function editLine(qid, text) {
    const line = st.script.lines[qid] || {};
    const sel = h("select", {}, h("option", { value: "" }, "Narrator (nobody speaks)"),
      ...st.script.characters.map(c => h("option", { value: c.id }, c.name)), h("option", { value: "__new__" }, "Someone else\u2026"));
    sel.value = line.speaker || "";
    const other = h("input", { placeholder: "New character's name" });
    const del = h("input", { value: line.delivery || "", placeholder: "e.g. shouting, urgent" });
    dialog("Who says this?", [h("p", {}, text), h("label", {}, "Speaker"), sel, h("label", {}, "New character (for \u201csomeone else\u201d)"), other,
      h("label", {}, "Delivery"), del], async () => {
      const speaker = sel.value === "__new__" ? other.value.trim() || null : sel.value || null;
      await api("PATCH", `/api/books/${st.id}/lines/${qid}`, { speaker, delivery: del.value.trim() });
      await reloadScript();
    });
  }

  const PROFILE_FIELDS = [
    ["gender", "Gender", ["", "male", "female", "unknown"]],
    ["apparent_age", "Apparent age (what a listener should hear)", ["", "child", "teen", "young adult", "adult", "middle-aged", "elderly", "unknown"]],
    ["appearance", "Physical appearance (young girl in a kimono, Java sparrow, android girl\u2026)"],
    ["speech_style", "Speech style (how they talk, verbal tics)"],
    ["notes", "Important characteristics (true age or nature, temperament, accent\u2026)"],
  ];

  /* Everything about one character, in a side drawer: tier, voice, profile, lines, and rarer actions under ⋯. */
  function openCharacter(cid) {
    const d = $("#cdlg");
    const patch = async (body) => {
      try { await api("PATCH", `/api/books/${st.id}/characters/${cid}`, body); } catch (e) { alert(e.message); return; }
      await reloadScript(); render();
    };
    const section = (title, ...kids) => h("section", {}, h("h4", {}, title), ...nonNull(kids));
    function render() {
      const c = charById()[cid];
      if (!c) { d.close(); return; }
      const tier = tierOf(c), model = c.profile || {}, mine = c.profile_user || {};
      const seg = h("div", { class: "seg" }, ...[["main", "Main"], ["supporting", "Supporting"], ["extra", "Extra"]].map(([k, label]) =>
        h("button", { type: "button", class: tier === k ? "on" : "", onclick: () => patch({ role: k }) }, label)));
      const why = [c.role_user ? "Your choice." : c.role ? `Automatic (${c.role_source || "rules"})${c.role_note ? ": " + c.role_note : "."}` : "Not sorted yet.",
        c.role_flag ? ` \u26A0 ${c.role_flag}.` : ""].join("");
      const voiceSel = h("select", { title: "Change voice", onchange: (e) => patch({ voice: e.target.value || null }) },
        h("option", { value: "" }, "No voice (narrator's)"),
        ...st.voices.map(v => h("option", { value: v.id }, v.name + (v.source === "character" ? " (character)" : ""))));
      voiceSel.value = c.voice || "";
      const inputs = {};
      const fields = PROFILE_FIELDS.map(([key, label, options]) => {
        const el = options ? h("select", {}, ...options.map(o => h("option", { value: o }, o || "\u2014")))
          : h(key === "notes" ? "textarea" : "input", { rows: key === "notes" ? 3 : undefined, maxlength: key === "notes" ? 300 : 320,
              style: { width: "100%" } });
        el.value = mine[key] ?? model[key] ?? "";
        inputs[key] = el;
        return [h("label", {}, label, mine[key] != null ? h("span", { class: "small", style: { color: "var(--accent)" } }, " \u270E edited") : null), el];
      }).flat();
      // Aliases help attribution (matching names in the text); they live with the overview, not the profile.
      const aliases = h("input", { value: (c.aliases || []).join(", "), title: "Other names the book uses for them",
        onchange: () => patch({ aliases: aliases.value.split(",").map(a => a.trim()).filter(Boolean) }) });
      const saveProfile = async () => patch({ profile: Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value])) });
      const design = h("button", { type: "button", onclick: async () => {
        design.disabled = true; design.textContent = "Designing\u2026 (about 20 s)";
        try {
          await saveProfile();
          await api("POST", `/api/books/${st.id}/characters/${cid}/voice-from-dossier`, {});
          flushAudio(); st.voices = (await get("/api/voices?all=1")).voices; await reloadScript(); render();
        } catch (err) { alert(err.message); design.disabled = false; design.textContent = "Design voice from profile"; }
      } }, "Design voice from profile");
      d.replaceChildren(
        h("div", { class: "dh" }, h("span", { class: "sw", style: { background: color(cid) } }), h("h2", { title: c.name }, c.name),
          h("button", { class: "iconbtn", title: "More", onclick: (e) => popMenu(e.currentTarget, [
            { text: "Rename\u2026", run: () => { const n = prompt("Name", c.name); if (n && n.trim() && n.trim() !== c.name) patch({ name: n.trim() }); } },
            { text: "Same person as\u2026 (merge)", run: () => merge(c) },
          ]) }, "\u22EF"),
          h("button", { class: "iconbtn", title: "Close", onclick: () => d.close() }, "\u2715")),
        section("Overview",
          h("div", { class: "small muted" }, `${c.lines} lines`),
          h("label", {}, "Also called (comma separated; used to recognise them in the text)"), aliases,
          h("div", { class: "rowx" }, seg, c.role_user ? h("button", { type: "button", class: "iconbtn small", title: "Let the model decide again",
            onclick: () => patch({ role: null }) }, "use automatic") : null),
          h("div", { class: "small muted" }, why)),
        section("Voice",
          h("div", { class: "rowx" },
            c.voice ? h("button", { class: "iconbtn", title: "Play voice sample", onclick: () => playSample(c.voice) }, "\u25B6") : null,
            voiceSel,
            c.voice ? h("button", { type: "button", onclick: () => openVoiceEditor(c.voice, { book: st.id, character: cid, characterName: c.name,
              onChange: async () => { flushAudio(); st.voices = (await get("/api/voices?all=1")).voices; await reloadScript(); render(); } }) }, "Edit voice\u2026") : null),
          (() => {
            const v = st.voices.find(x => x.id === c.voice);
            const text = v && (v.description || v.instruct);
            return text ? h("div", { class: "small muted" }, text, (c.voice || "").startsWith("pool-") ? " (shared by several minor characters)" : "") : null;
          })()),
        h("section", {}, h("details", { class: "profile", open: st.profileOpen || undefined,
            ontoggle: (e) => { st.profileOpen = e.target.open; } },
          h("summary", {}, h("h4", { style: { display: "inline" } }, "Profile (for voice design)")),
          h("p", { class: "small muted" }, "Used to design this character's voice and for later volumes in the series. Doesn't change who-said-what."),
          ...fields,
          h("div", { class: "rowx" }, h("button", { type: "button", class: "primary", onclick: saveProfile }, "Save profile"), design))),
        section("Lines",
          h("button", { type: "button", onclick: () => {
            st.filterChar = cid; $("#charFilter").value = cid; renderText(); renderCast(); d.close(); $("aside").classList.remove("open");
          } }, "Show this character's lines")));
    }
    d.onclick = (e) => { if (e.target === d) d.close(); };  // click outside the drawer
    render();
    if (!d.open) d.showModal();
  }

  function merge(c) {
    const sel = h("select", {}, ...st.script.characters.filter(o => o.id !== c.id).map(o => h("option", { value: o.id }, o.name)));
    dialog(`${c.name} is the same person as\u2026`, [h("p", { class: "small muted" }, "Their lines move over and the name becomes an alias."), sel],
      async () => {
        await api("PATCH", `/api/books/${st.id}/characters/${c.id}`, { merge_into: sel.value });
        $("#cdlg").close(); await reloadScript();
      });
  }
  async function relabel() {
    if (!confirm("Label every line again? Your line corrections, cast and voices are kept. This takes about as long as the first analysis (about an hour for a long novel).")) return;
    try { st.script = (await api("POST", `/api/books/${st.id}/analyze`, { relabel: true })).data; } catch (e) { alert(e.message); return; }
    renderStatus(); follow();
  }

  async function showSeries() {
    const el = $("#seriesInfo");
    if (!el) return;
    const meta = (await get("/api/books")).books.find(b => b.id === st.id) || {};
    el.replaceChildren("Series: ", h("b", {}, meta.series || "(from the title)"), " ",
      h("button", { onclick: async () => {
        const name = prompt("Series this book belongs to (its cast and voices carry over to other volumes). Leave empty to detect it from the title.", meta.series || "");
        if (name === null) return;
        const r = await api("POST", `/api/books/${st.id}/series`, { series: name });
        el.querySelector("b").textContent = r.data.series;
      } }, "Change"));
  }

  async function castVoices(body = {}) {
    if (body instanceof Event) body = {};
    try { await api("POST", `/api/books/${st.id}/cast`, body); } catch (e) { alert(e.message); return; }
    const poll = async () => {
      st.script = await get(`/api/books/${st.id}/script`);
      renderStatus();
      if (st.script.status === "casting") setTimeout(poll, 5000);
      else { st.voices = (await get("/api/voices?all=1")).voices; renderAll(); }
    };
    poll();
  }

  /* Keep following an analysis that is still running. */
  function follow() {
    if (!BUSY.includes(st.script.status)) return;
    setTimeout(async () => {
      const before = Object.keys(st.script.lines).length;
      st.script = await get(`/api/books/${st.id}/script`);
      renderStatus(); renderCast();
      if (Object.keys(st.script.lines).length !== before && !st.session && !$("#dlg").open) renderText();
      if (!BUSY.includes(st.script.status)) { st.voices = (await get("/api/voices?all=1")).voices; renderAll(); }
      follow();
    }, 10000);
  }

  renderAll();
  get("/api/voices?all=1").then(v => { st.voices = v.voices; st.defaultVoice = v.default; renderSelectors(); renderCast(); }).catch(() => {});
  get("/api/engines").then(e => { st.engines = e.engines.filter(x => x.installed); st.defaultEngine = e.default; renderSelectors(); }).catch(() => {});
  showSeries().catch(() => {});
  follow();
}
</script>
</body>
</html>
